<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Badge / Label Effects</title>

  <style>
    :root {
      --bg: #000;
      --border: rgba(255,255,255,0.14);
      --text: #fff;
      --muted: rgba(255,255,255,0.58);
      --blue: #4f8cff;
      --purple: #8d6bff;
      --green: #35c759;
      --red: #ff5f57;
      --yellow: #ffbd2e;
      --orange: #ff9f0a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,0.15), transparent 24%),
        radial-gradient(circle at 18% 28%, rgba(79,140,255,0.11), transparent 28%),
        linear-gradient(180deg, #000, #050505 55%, #090909);
      color: var(--text);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.024) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.024) 1px, transparent 1px);
      background-size: 70px 70px;
      mask-image: radial-gradient(circle at center, black, transparent 75%);
      z-index: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(100%, 1560px);
      margin: 0 auto;
      padding: 22px;
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 16px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px;
      border-radius: 24px;
      background: rgba(20,20,20,0.78);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(26px);
      box-shadow: 0 20px 70px rgba(0,0,0,0.46);
      margin-bottom: 30px;
    }

    .search-box {
      width: 280px;
      height: 46px;
      border-radius: 16px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.12);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      flex: 0 0 auto;
    }

    .search-box svg {
      color: rgba(255,255,255,0.58);
      flex: 0 0 auto;
    }

    .search-box input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font-size: 14px;
      font-weight: 750;
    }

    .search-box input::placeholder {
      color: rgba(255,255,255,0.45);
    }

    .menu {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      flex: 1;
    }

    .menu::-webkit-scrollbar {
      display: none;
    }

    .menu a {
      height: 46px;
      padding: 0 16px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.68);
      font-size: 14px;
      font-weight: 850;
      border: 1px solid transparent;
      white-space: nowrap;
      transition: 180ms ease;
    }

    .menu a:hover,
    .menu a.active {
      background: rgba(255,255,255,0.11);
      border-color: rgba(255,255,255,0.12);
      color: white;
    }

    .menu a.active {
      background: rgba(79,140,255,0.22);
      border-color: rgba(79,140,255,0.38);
    }

    .content-header {
      margin-bottom: 24px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
    }

    .title-block h1 {
      font-size: clamp(34px, 4.8vw, 64px);
      line-height: 0.95;
      letter-spacing: -0.065em;
      font-weight: 950;
      margin-bottom: 10px;
    }

    .title-block p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
      font-weight: 650;
      max-width: 760px;
    }

    .count-pill {
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.74);
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
      padding-bottom: 35px;
    }

    .card {
      min-height: 238px;
      border-radius: 24px;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,0.12), transparent 50%),
        linear-gradient(180deg, rgba(255,255,255,0.09), rgba(255,255,255,0.04));
      border: 1px solid var(--border);
      overflow: hidden;
      transition: 220ms ease;
      box-shadow: 0 18px 50px rgba(0,0,0,0.25);
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(255,255,255,0.24);
      box-shadow: 0 28px 80px rgba(0,0,0,0.44);
    }

    .preview {
      height: 138px;
      display: grid;
      place-items: center;
      padding: 18px;
      border-bottom: 1px solid rgba(255,255,255,0.09);
      background: rgba(0,0,0,0.20);
      overflow: hidden;
      position: relative;
      perspective: 900px;
    }

    .badge-demo {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 34px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.16);
      color: white;
      font-size: 12px;
      font-weight: 950;
      letter-spacing: 0.02em;
      overflow: hidden;
      transition: 260ms ease;
      isolation: isolate;
      box-shadow: 0 14px 34px rgba(0,0,0,.28);
      transform-style: preserve-3d;
      white-space: nowrap;
    }

    .badge-demo span {
      position: relative;
      z-index: 5;
    }

    .card-body {
      padding: 15px;
    }

    .name-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .name-row h3 {
      font-size: 16px;
      line-height: 1.12;
      letter-spacing: -0.03em;
      font-weight: 900;
    }

    .copy-btn {
      width: 36px;
      height: 36px;
      border-radius: 13px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.085);
      color: white;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex: 0 0 auto;
      transition: 180ms ease;
    }

    .copy-btn:hover {
      background: rgba(79,140,255,0.95);
      border-color: rgba(79,140,255,0.95);
      transform: translateY(-2px);
    }

    .card-body p {
      color: rgba(255,255,255,0.55);
      font-size: 12.5px;
      line-height: 1.45;
      font-weight: 650;
    }

    .empty {
      padding: 24px;
      border-radius: 22px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.72);
      text-align: center;
      font-weight: 750;
      margin-bottom: 20px;
      display: none;
    }

    .load-status {
      margin: 0 auto 70px;
      width: fit-content;
      padding: 12px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.65);
      font-size: 12px;
      font-weight: 850;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%) translateY(18px);
      padding: 13px 18px;
      border-radius: 16px;
      background: rgba(255,255,255,0.93);
      color: #111;
      font-size: 13px;
      font-weight: 850;
      box-shadow: 0 18px 60px rgba(0,0,0,0.45);
      opacity: 0;
      pointer-events: none;
      transition: 220ms ease;
      z-index: 9999;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 1280px) {
      .grid { grid-template-columns: repeat(4, 1fr); }
    }

    @media (max-width: 1100px) {
      .grid { grid-template-columns: repeat(3, 1fr); }
      .topbar { align-items: flex-start; flex-direction: column; }
      .search-box { width: 100%; }
      .menu { width: 100%; }
    }

    @media (max-width: 760px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
      .content-header { display: block; }
      .count-pill { display: inline-block; margin-top: 12px; }
    }

    @media (max-width: 520px) {
      .page { padding: 12px; }
      .topbar { top: 10px; border-radius: 20px; }
      .menu a { height: 42px; padding: 0 13px; font-size: 13px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <div class="page">
    <header class="topbar">
      <div class="search-box">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2.2"/>
          <path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <input id="searchInput" type="text" placeholder="Search effect..." />
      </div>

      <nav class="menu" id="mainMenu"></nav>
    </header>

    <main>
      <header class="content-header">
        <div class="title-block">
          <h1>Badge / Label Effects</h1>
          <p>100 live badge and label effects for live tags, verified marks, premium labels, counters, status pills, and notification badges.</p>
        </div>

        <div class="count-pill" id="countPill">0 Effects</div>
      </header>

      <div id="emptyState" class="empty">
        No effect found. Try searching “live”, “verified”, “premium”, “glow”, “token”, “count”, or “ribbon”.
      </div>

      <section id="grid" class="grid"></section>

      <div id="loadStatus" class="load-status">Showing 0 of 100 effects</div>
    </main>
  </div>

  <style id="dynamicEffectStyles"></style>

  <script src="nav.js"></script>

  <script>
    const effects = [];

    const baseBadgeCSS = `.badge-demo {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 34px;
  padding: 8px 14px;
  border-radius: 999px;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.16);
  color: white;
  font-size: 12px;
  font-weight: 950;
  letter-spacing: 0.02em;
  overflow: hidden;
  transition: 260ms ease;
  isolation: isolate;
  box-shadow: 0 14px 34px rgba(0,0,0,.28);
  white-space: nowrap;
}
.badge-demo span {
  position: relative;
  z-index: 5;
}`;

    const commonKeyframes = `
@keyframes badgePulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.12);} }
@keyframes badgeBounce { 0%,100%{transform:translateY(0);} 40%{transform:translateY(-10px);} 60%{transform:translateY(3px);} }
@keyframes badgeFloat { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);} }
@keyframes badgeBlink { 0%,100%{opacity:1;} 50%{opacity:.42;} }
@keyframes badgeSpin { to{transform:rotate(360deg);} }
@keyframes badgeGlow { 0%,100%{box-shadow:0 0 0 rgba(79,140,255,0);} 50%{box-shadow:0 0 28px rgba(79,140,255,.72);} }
@keyframes badgeRedGlow { 0%,100%{box-shadow:0 0 0 rgba(255,95,87,0);} 50%{box-shadow:0 0 28px rgba(255,95,87,.72);} }
@keyframes badgeGreenGlow { 0%,100%{box-shadow:0 0 0 rgba(53,199,89,0);} 50%{box-shadow:0 0 28px rgba(53,199,89,.72);} }
@keyframes badgeGoldGlow { 0%,100%{box-shadow:0 0 0 rgba(255,189,46,0);} 50%{box-shadow:0 0 28px rgba(255,189,46,.72);} }
@keyframes badgeGradient { 0%,100%{background-position:0% center;} 50%{background-position:100% center;} }
@keyframes badgeShimmer { to{background-position:-220% center;} }
@keyframes badgeShine { 0%{left:-45%;} 55%,100%{left:130%;} }
@keyframes badgeShake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-4px);} 75%{transform:translateX(4px);} }
@keyframes badgePop { 0%,100%{transform:scale(1);} 50%{transform:scale(1.22);} }
@keyframes badgePing { 0%{box-shadow:0 0 0 0 rgba(255,95,87,.65);} 70%{box-shadow:0 0 0 10px rgba(255,95,87,0);} 100%{box-shadow:0 0 0 0 rgba(255,95,87,0);} }
@keyframes badgeBorderRotate { to{transform:rotate(360deg);} }
@keyframes badgeScan { 0%,100%{top:0;} 50%{top:calc(100% - 3px);} }
@keyframes badgeTypingDots { 0%{content:"";} 25%{content:".";} 50%{content:"..";} 75%,100%{content:"...";} }
`;

    function addEffect(name, about, className, css, html) {
      effects.push({
        id: String(effects.length),
        name,
        about,
        className,
        html: html || `<div class="badge-demo ${className}"><span>Badge</span></div>`,
        css
      });
    }

    addEffect("Pulse Badge", "Badge gently scales up and down.", "badge-pulse", `.badge-pulse{animation:badgePulse 1.4s ease-in-out infinite;}`);
    addEffect("Bounce Badge", "Badge bounces upward repeatedly.", "badge-bounce", `.badge-bounce{animation:badgeBounce 1.5s ease-in-out infinite;}`);
    addEffect("Float Badge", "Badge floats softly like a pill.", "badge-float", `.badge-float{animation:badgeFloat 2.4s ease-in-out infinite;}`);
    addEffect("Blink Badge", "Badge blinks for urgent labels.", "badge-blink", `.badge-blink{background:rgba(255,95,87,.22);border-color:rgba(255,95,87,.55);animation:badgeBlink 1s ease-in-out infinite;}`, `<div class="badge-demo badge-blink"><span>ALERT</span></div>`);
    addEffect("Pop Badge", "Badge pops like a notification count.", "badge-pop", `.badge-pop{animation:badgePop 1.4s ease-in-out infinite;}`);
    addEffect("Shake Badge", "Badge shakes for warning state.", "badge-shake", `.badge-shake{background:rgba(255,95,87,.16);border-color:rgba(255,95,87,.45);animation:badgeShake .65s ease-in-out infinite;}`, `<div class="badge-demo badge-shake"><span>ERROR</span></div>`);
    addEffect("Swing Badge", "Badge swings side to side.", "badge-swing", `.badge-swing{transform-origin:top center;animation:badgeSwing 1.7s ease-in-out infinite;} @keyframes badgeSwing{0%,100%{transform:rotate(0);}25%{transform:rotate(8deg);}75%{transform:rotate(-8deg);}}`);
    addEffect("Wobble Badge", "Badge wobbles horizontally.", "badge-wobble", `.badge-wobble{animation:badgeWobble 1.4s ease-in-out infinite;} @keyframes badgeWobble{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px) rotate(-3deg);}40%{transform:translateX(6px) rotate(2deg);}60%{transform:translateX(-4px) rotate(-2deg);}80%{transform:translateX(3px) rotate(1deg);}}`);
    addEffect("Jelly Badge", "Badge stretches like jelly.", "badge-jelly", `.badge-jelly{animation:badgeJelly 1.6s ease-in-out infinite;} @keyframes badgeJelly{0%,100%{transform:scale(1);}30%{transform:scale(1.18,.82);}50%{transform:scale(.9,1.12);}70%{transform:scale(1.05,.95);}}`);
    addEffect("Rubber Badge", "Badge gets rubber band stretch.", "badge-rubber", `.badge-rubber{animation:badgeRubber 1.7s ease-in-out infinite;} @keyframes badgeRubber{0%,100%{transform:scale(1);}35%{transform:scaleX(1.22) scaleY(.82);}55%{transform:scaleX(.9) scaleY(1.12);}75%{transform:scaleX(1.04) scaleY(.96);}}`);

    addEffect("Glow Badge", "Badge glows with blue light.", "badge-glow", `.badge-glow{background:rgba(79,140,255,.18);border-color:rgba(79,140,255,.45);animation:badgeGlow 1.8s ease-in-out infinite;}`, `<div class="badge-demo badge-glow"><span>PRO</span></div>`);
    addEffect("Soft Glow Badge", "Soft white glow around badge.", "badge-soft-glow", `.badge-soft-glow{animation:badgeSoftGlow 1.8s ease-in-out infinite;} @keyframes badgeSoftGlow{0%,100%{box-shadow:0 0 0 rgba(255,255,255,0);}50%{box-shadow:0 0 25px rgba(255,255,255,.35);}}`);
    addEffect("Red Glow Badge", "Red alert glow badge.", "badge-red-glow", `.badge-red-glow{background:rgba(255,95,87,.16);border-color:rgba(255,95,87,.45);animation:badgeRedGlow 1.6s ease-in-out infinite;}`, `<div class="badge-demo badge-red-glow"><span>HOT</span></div>`);
    addEffect("Green Glow Badge", "Green success glow badge.", "badge-green-glow", `.badge-green-glow{background:rgba(53,199,89,.16);border-color:rgba(53,199,89,.45);animation:badgeGreenGlow 1.6s ease-in-out infinite;}`, `<div class="badge-demo badge-green-glow"><span>DONE</span></div>`);
    addEffect("Gold Glow Badge", "Premium gold glow badge.", "badge-gold-glow", `.badge-gold-glow{background:rgba(255,189,46,.16);border-color:rgba(255,189,46,.45);color:#fff7df;animation:badgeGoldGlow 1.6s ease-in-out infinite;}`, `<div class="badge-demo badge-gold-glow"><span>VIP</span></div>`);
    addEffect("Neon Badge", "Neon border and text glow.", "badge-neon", `.badge-neon{border-color:rgba(79,140,255,.9);text-shadow:0 0 14px rgba(255,255,255,.85);box-shadow:0 0 18px rgba(79,140,255,.45),inset 0 0 14px rgba(79,140,255,.15);animation:badgeNeon 1.5s ease-in-out infinite;} @keyframes badgeNeon{0%,100%{filter:brightness(1);}50%{filter:brightness(1.35);}}`, `<div class="badge-demo badge-neon"><span>NEON</span></div>`);
    addEffect("Shadow Badge", "Badge shadow grows and shrinks.", "badge-shadow", `.badge-shadow{animation:badgeShadow 1.8s ease-in-out infinite;} @keyframes badgeShadow{0%,100%{box-shadow:0 8px 16px rgba(0,0,0,.25);}50%{box-shadow:0 22px 45px rgba(0,0,0,.55);transform:translateY(-5px);}}`);
    addEffect("Inset Badge", "Inner glow badge style.", "badge-inset", `.badge-inset{animation:badgeInset 1.8s ease-in-out infinite;} @keyframes badgeInset{0%,100%{box-shadow:inset 0 0 0 rgba(79,140,255,0);}50%{box-shadow:inset 0 0 20px rgba(79,140,255,.45);}}`);
    addEffect("Border Glow Badge", "Border glow pulses around badge.", "badge-border-glow", `.badge-border-glow{border-color:rgba(79,140,255,.55);animation:badgeBorderGlow 1.7s ease-in-out infinite;} @keyframes badgeBorderGlow{0%,100%{border-color:rgba(79,140,255,.25);}50%{border-color:rgba(79,140,255,1);box-shadow:0 0 22px rgba(79,140,255,.55);}}`);
    addEffect("Aura Badge", "Large soft aura behind badge.", "badge-aura", `.badge-aura::before{content:"";position:absolute;inset:-18px;border-radius:inherit;background:radial-gradient(circle,rgba(79,140,255,.4),transparent 65%);z-index:1;animation:badgeAura 1.8s ease-in-out infinite;} @keyframes badgeAura{0%,100%{opacity:.2;transform:scale(.75);}50%{opacity:1;transform:scale(1.08);}}`);

    addEffect("Shimmer Badge", "Gradient shimmer moves across badge.", "badge-shimmer", `.badge-shimmer{background:linear-gradient(90deg,rgba(255,255,255,.12),rgba(79,140,255,.42),rgba(255,255,255,.12));background-size:220%;animation:badgeShimmer 1.7s linear infinite;}`, `<div class="badge-demo badge-shimmer"><span>SHIMMER</span></div>`);
    addEffect("Shine Badge", "White shine sweep passes over badge.", "badge-shine", `.badge-shine::after{content:"";position:absolute;top:-80%;left:-45%;width:34%;height:260%;background:rgba(255,255,255,.6);transform:rotate(25deg);animation:badgeShine 2.1s linear infinite;z-index:4;}`, `<div class="badge-demo badge-shine"><span>SHINE</span></div>`);
    addEffect("Slow Shine Badge", "Slow premium shine sweep.", "badge-slow-shine", `.badge-slow-shine::after{content:"";position:absolute;top:-80%;left:-45%;width:34%;height:260%;background:rgba(255,255,255,.6);transform:rotate(25deg);animation:badgeShine 3.4s linear infinite;z-index:4;}`);
    addEffect("Gradient Badge", "Animated gradient badge.", "badge-gradient", `.badge-gradient{background:linear-gradient(90deg,#4f8cff,#8d6bff,#4f8cff);background-size:220%;border:0;animation:badgeGradient 2.3s ease-in-out infinite;}`, `<div class="badge-demo badge-gradient"><span>PLUS</span></div>`);
    addEffect("Rainbow Badge", "Rainbow gradient moving badge.", "badge-rainbow", `.badge-rainbow{background:linear-gradient(90deg,#ff5f57,#ffbd2e,#35c759,#4f8cff,#8d6bff,#ff5f57);background-size:300%;border:0;animation:badgeGradient 2.8s linear infinite;}`, `<div class="badge-demo badge-rainbow"><span>COLOR</span></div>`);
    addEffect("Holographic Badge", "Pastel holographic moving badge.", "badge-holo", `.badge-holo{background:linear-gradient(120deg,rgba(255,255,255,.22),rgba(135,247,255,.32),rgba(255,158,231,.28),rgba(255,255,255,.22));background-size:260%;border-color:rgba(255,255,255,.26);animation:badgeGradient 2.4s ease-in-out infinite;}`, `<div class="badge-demo badge-holo"><span>HOLO</span></div>`);
    addEffect("Chrome Badge", "Metal chrome shine badge.", "badge-chrome", `.badge-chrome{background:linear-gradient(90deg,#777,#fff,#777,#fff,#777);background-size:250%;color:#111;border:0;animation:badgeGradient 2.4s linear infinite;}`, `<div class="badge-demo badge-chrome"><span>METAL</span></div>`);
    addEffect("Glass Badge", "Glassmorphism badge style.", "badge-glass", `.badge-glass{background:rgba(255,255,255,.12);backdrop-filter:blur(16px);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 14px 34px rgba(0,0,0,.28);animation:badgeGlass 2s ease-in-out infinite;} @keyframes badgeGlass{0%,100%{background:rgba(255,255,255,.1);}50%{background:rgba(255,255,255,.2);}}`);

    addEffect("Double Border Badge", "Badge has animated inner border.", "badge-double-border", `.badge-double-border::before{content:"";position:absolute;inset:4px;border:1px solid rgba(255,255,255,.24);border-radius:inherit;animation:badgeDouble 1.8s ease-in-out infinite;z-index:4;} @keyframes badgeDouble{0%,100%{inset:4px;}50%{inset:-4px;border-color:rgba(79,140,255,.75);}}`);
    addEffect("Scan Badge", "Scan line moves over badge.", "badge-scan", `.badge-scan::after{content:"";position:absolute;left:0;right:0;height:3px;background:#4f8cff;box-shadow:0 0 18px rgba(79,140,255,.9);animation:badgeScan 1.4s ease-in-out infinite;z-index:4;}`);
    addEffect("Ripple Badge", "Ripple expands inside badge.", "badge-ripple", `.badge-ripple::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:rgba(79,140,255,.55);animation:badgeRipple 1.4s ease-out infinite;z-index:1;} @keyframes badgeRipple{0%{transform:scale(0);opacity:1;}100%{transform:scale(8);opacity:0;}}`);
    addEffect("Highlight Badge", "Highlight wipe moves behind text.", "badge-highlight", `.badge-highlight{background:linear-gradient(90deg,transparent 50%,rgba(79,140,255,.35) 50%);background-size:220%;animation:badgeHighlight 1.8s ease-in-out infinite;} @keyframes badgeHighlight{0%,100%{background-position:0%;}50%{background-position:-100%;}}`);
    addEffect("Underline Badge", "Small underline animates under badge text.", "badge-underline", `.badge-underline::after{content:"";position:absolute;left:14px;right:14px;bottom:5px;height:3px;border-radius:999px;background:#4f8cff;transform-origin:left;animation:badgeUnderline 1.5s ease-in-out infinite;z-index:4;} @keyframes badgeUnderline{0%,100%{transform:scaleX(0);}50%{transform:scaleX(1);}}`);
    addEffect("Corner Peel Badge", "Corner peel appears on badge.", "badge-corner-peel", `.badge-corner-peel::after{content:"";position:absolute;right:0;top:0;width:0;height:0;border-top:20px solid rgba(255,255,255,.38);border-left:20px solid transparent;animation:badgePeel 1.8s ease-in-out infinite;z-index:4;} @keyframes badgePeel{0%,100%{transform:translate(20px,-20px);}50%{transform:translate(0,0);}}`);
    addEffect("Final Premium Badge", "Premium gradient, shine, and glow badge.", "badge-final-premium", `.badge-final-premium{background:linear-gradient(90deg,#4f8cff,#8d6bff,#4f8cff);background-size:240%;border:0;animation:badgeFinal 2.4s ease-in-out infinite;} .badge-final-premium::after{content:"";position:absolute;top:-80%;left:-45%;width:32%;height:260%;background:rgba(255,255,255,.55);transform:rotate(25deg);animation:badgeShine 2.4s linear infinite;z-index:4;} @keyframes badgeFinal{0%,100%{background-position:0% center;box-shadow:0 0 0 rgba(79,140,255,0);}50%{background-position:100% center;box-shadow:0 0 28px rgba(79,140,255,.65);}}`, `<div class="badge-demo badge-final-premium"><span>FINAL</span></div>`);

    const grid = document.getElementById("grid");
    const searchInput = document.getElementById("searchInput");
    const countPill = document.getElementById("countPill");
    const emptyState = document.getElementById("emptyState");
    const loadStatus = document.getElementById("loadStatus");
    const dynamicEffectStyles = document.getElementById("dynamicEffectStyles");

    const batchSize = 20;
    let visibleCount = batchSize;
    let filteredEffects = [...effects];
    let isLoadingMore = false;

    dynamicEffectStyles.textContent = commonKeyframes + "\n\n" + effects.map(effect => effect.css).join("\n\n");

    function copyIcon() {
      return `
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <rect x="9" y="9" width="10" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
          <rect x="5" y="5" width="10" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
        </svg>
      `;
    }

    function renderCards() {
      grid.innerHTML = "";

      const visibleEffects = filteredEffects.slice(0, visibleCount);

      visibleEffects.forEach(effect => {
        const card = document.createElement("div");
        card.className = "card";
        card.dataset.search = `${effect.name} ${effect.about} ${effect.className}`.toLowerCase();

        card.innerHTML = `
          <div class="preview">${effect.html}</div>
          <div class="card-body">
            <div class="name-row">
              <h3>${effect.name}</h3>
              <button class="copy-btn" data-id="${effect.id}" title="Copy code">
                ${copyIcon()}
              </button>
            </div>
            <p>${effect.about}</p>
          </div>
        `;

        grid.appendChild(card);
      });

      document.querySelectorAll(".copy-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          copyCode(btn.dataset.id);
        });
      });

      emptyState.style.display = filteredEffects.length ? "none" : "block";
      countPill.textContent = filteredEffects.length + " Effects";

      const shown = Math.min(visibleCount, filteredEffects.length);
      loadStatus.textContent = `Showing ${shown} of ${filteredEffects.length} effects`;

      if (filteredEffects.length === 0) {
        loadStatus.style.display = "none";
      } else {
        loadStatus.style.display = "block";
      }
    }

    function copyCode(id) {
      const effect = effects.find(item => item.id === id);

      if (!effect) {
        showToast("Code not found");
        return;
      }

      const code = `${effect.html}

<style>
${baseBadgeCSS}

${commonKeyframes}

${effect.css}
</style>`;

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(code).then(() => {
          showToast("Code copied");
        }).catch(() => {
          fallbackCopy(code);
        });
      } else {
        fallbackCopy(code);
      }
    }

    function fallbackCopy(text) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      textarea.style.top = "-9999px";
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();

      try {
        document.execCommand("copy");
        showToast("Code copied");
      } catch (err) {
        showToast("Copy failed");
      }

      document.body.removeChild(textarea);
    }

    function showToast(message) {
      const oldToast = document.querySelector(".toast");
      if (oldToast) oldToast.remove();

      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = message;
      document.body.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.add("show");
      });

      setTimeout(() => {
        toast.classList.remove("show");
        setTimeout(() => toast.remove(), 250);
      }, 1500);
    }

    function applySearch() {
      const value = searchInput.value.trim().toLowerCase();

      filteredEffects = effects.filter(effect => {
        return (
          effect.name.toLowerCase().includes(value) ||
          effect.about.toLowerCase().includes(value) ||
          effect.className.toLowerCase().includes(value)
        );
      });

      visibleCount = batchSize;
      renderCards();
    }

    function loadMoreOnScroll() {
      if (isLoadingMore) return;
      if (visibleCount >= filteredEffects.length) return;

      const nearBottom = window.innerHeight + window.scrollY >= document.body.offsetHeight - 450;

      if (nearBottom) {
        isLoadingMore = true;

        setTimeout(() => {
          visibleCount += batchSize;
          renderCards();
          isLoadingMore = false;
        }, 180);
      }
    }

    searchInput.addEventListener("input", applySearch);
    window.addEventListener("scroll", loadMoreOnScroll);

    renderCards();
  </script>
</body>
</html>
