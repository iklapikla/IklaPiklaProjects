<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Button Animation Effects</title>

  <style>
    :root {
      --bg: #000;
      --border: rgba(255,255,255,0.14);
      --text: #fff;
      --muted: rgba(255,255,255,0.58);
      --blue: #4f8cff;
      --purple: #8d6bff;
      --green: #35c759;
      --red: #ff5f57;
      --yellow: #ffbd2e;
      --orange: #ff9f0a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,0.15), transparent 24%),
        radial-gradient(circle at 18% 28%, rgba(79,140,255,0.11), transparent 28%),
        linear-gradient(180deg, #000, #050505 55%, #090909);
      color: var(--text);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.024) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.024) 1px, transparent 1px);
      background-size: 70px 70px;
      mask-image: radial-gradient(circle at center, black, transparent 75%);
      z-index: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(100%, 1560px);
      margin: 0 auto;
      padding: 22px;
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 16px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px;
      border-radius: 24px;
      background: rgba(20,20,20,0.78);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(26px);
      box-shadow: 0 20px 70px rgba(0,0,0,0.46);
      margin-bottom: 30px;
    }

    .search-box {
      width: 280px;
      height: 46px;
      border-radius: 16px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.12);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      flex: 0 0 auto;
    }

    .search-box svg {
      color: rgba(255,255,255,0.58);
      flex: 0 0 auto;
    }

    .search-box input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font-size: 14px;
      font-weight: 750;
    }

    .search-box input::placeholder {
      color: rgba(255,255,255,0.45);
    }

    .menu {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      flex: 1;
    }

    .menu::-webkit-scrollbar {
      display: none;
    }

    .menu a {
      height: 46px;
      padding: 0 16px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.68);
      font-size: 14px;
      font-weight: 850;
      border: 1px solid transparent;
      white-space: nowrap;
      transition: 180ms ease;
    }

    .menu a:hover,
    .menu a.active {
      background: rgba(255,255,255,0.11);
      border-color: rgba(255,255,255,0.12);
      color: white;
    }

    .menu a.active {
      background: rgba(79,140,255,0.22);
      border-color: rgba(79,140,255,0.38);
    }

    .content-header {
      margin-bottom: 24px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
    }

    .title-block h1 {
      font-size: clamp(34px, 4.8vw, 64px);
      line-height: 0.95;
      letter-spacing: -0.065em;
      font-weight: 950;
      margin-bottom: 10px;
    }

    .title-block p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
      font-weight: 650;
      max-width: 760px;
    }

    .count-pill {
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.74);
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
      padding-bottom: 35px;
    }

    .card {
      min-height: 238px;
      border-radius: 24px;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,0.12), transparent 50%),
        linear-gradient(180deg, rgba(255,255,255,0.09), rgba(255,255,255,0.04));
      border: 1px solid var(--border);
      overflow: hidden;
      transition: 220ms ease;
      box-shadow: 0 18px 50px rgba(0,0,0,0.25);
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(255,255,255,0.24);
      box-shadow: 0 28px 80px rgba(0,0,0,0.44);
    }

    .preview {
      height: 138px;
      display: grid;
      place-items: center;
      padding: 18px;
      border-bottom: 1px solid rgba(255,255,255,0.09);
      background: rgba(0,0,0,0.20);
      overflow: hidden;
      position: relative;
      perspective: 900px;
    }

    .demo-btn {
      position: relative;
      min-width: 132px;
      height: 46px;
      border: 0;
      border-radius: 15px;
      padding: 0 20px;
      color: white;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.18);
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      overflow: hidden;
      transition: 220ms ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      isolation: isolate;
      white-space: nowrap;
      transform-style: preserve-3d;
    }

    .demo-btn span {
      position: relative;
      z-index: 4;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .card-body {
      padding: 15px;
    }

    .name-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .name-row h3 {
      font-size: 16px;
      line-height: 1.12;
      letter-spacing: -0.03em;
      font-weight: 900;
    }

    .copy-btn {
      width: 36px;
      height: 36px;
      border-radius: 13px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.085);
      color: white;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex: 0 0 auto;
      transition: 180ms ease;
    }

    .copy-btn:hover {
      background: rgba(79,140,255,0.95);
      border-color: rgba(79,140,255,0.95);
      transform: translateY(-2px);
    }

    .card-body p {
      color: rgba(255,255,255,0.55);
      font-size: 12.5px;
      line-height: 1.45;
      font-weight: 650;
    }

    .empty {
      padding: 24px;
      border-radius: 22px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.72);
      text-align: center;
      font-weight: 750;
      margin-bottom: 20px;
      display: none;
    }

    .load-status {
      margin: 0 auto 70px;
      width: fit-content;
      padding: 12px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.65);
      font-size: 12px;
      font-weight: 850;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%) translateY(18px);
      padding: 13px 18px;
      border-radius: 16px;
      background: rgba(255,255,255,0.93);
      color: #111;
      font-size: 13px;
      font-weight: 850;
      box-shadow: 0 18px 60px rgba(0,0,0,0.45);
      opacity: 0;
      pointer-events: none;
      transition: 220ms ease;
      z-index: 9999;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 1280px) {
      .grid { grid-template-columns: repeat(4, 1fr); }
    }

    @media (max-width: 1100px) {
      .grid { grid-template-columns: repeat(3, 1fr); }
      .topbar { align-items: flex-start; flex-direction: column; }
      .search-box { width: 100%; }
      .menu { width: 100%; }
    }

    @media (max-width: 760px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
      .content-header { display: block; }
      .count-pill { display: inline-block; margin-top: 12px; }
    }

    @media (max-width: 520px) {
      .page { padding: 12px; }
      .topbar { top: 10px; border-radius: 20px; }
      .menu a { height: 42px; padding: 0 13px; font-size: 13px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <div class="page">
    <header class="topbar">
      <div class="search-box">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2.2"/>
          <path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <input id="searchInput" type="text" placeholder="Search effect..." />
      </div>

      <nav class="menu" id="mainMenu"></nav>
    </header>

    <main>
      <header class="content-header">
        <div class="title-block">
          <h1>Button Animation</h1>
          <p>100 live button animation effects. First 20 effects load initially, then next 20 effects load automatically while scrolling.</p>
        </div>

        <div class="count-pill" id="countPill">0 Effects</div>
      </header>

      <div id="emptyState" class="empty">
        No effect found. Try searching “glow”, “shine”, “ripple”, “3D”, “loading”, “premium”, or “hover”.
      </div>

      <section id="grid" class="grid"></section>

      <div id="loadStatus" class="load-status">Showing 0 of 100 effects</div>
    </main>
  </div>

  <style id="dynamicEffectStyles"></style>

  <script src="nav.js"></script>

  <script>
    const effects = [];

    const baseButtonCSS = `.demo-btn {
  position: relative;
  min-width: 132px;
  height: 46px;
  border: 0;
  border-radius: 15px;
  padding: 0 20px;
  color: white;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.18);
  font-size: 14px;
  font-weight: 900;
  cursor: pointer;
  overflow: hidden;
  transition: 220ms ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  isolation: isolate;
  white-space: nowrap;
}
.demo-btn span {
  position: relative;
  z-index: 4;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}`;

    function addEffect(name, about, className, css, html) {
      effects.push({
        id: String(effects.length),
        name,
        about,
        className,
        html: html || `<button class="demo-btn ${className}"><span>Button</span></button>`,
        css
      });
    }

    addEffect("Fill Left Button", "Background fills from left to right on hover.", "btn-fill-left", `.btn-fill-left::before { content: ""; position: absolute; inset: 0; background: #4f8cff; transform: scaleX(0); transform-origin: left; transition: transform .35s ease; z-index: 1; }
.btn-fill-left:hover::before { transform: scaleX(1); }`);

    addEffect("Fill Right Button", "Background fills from right to left on hover.", "btn-fill-right", `.btn-fill-right::before { content: ""; position: absolute; inset: 0; background: #4f8cff; transform: scaleX(0); transform-origin: right; transition: transform .35s ease; z-index: 1; }
.btn-fill-right:hover::before { transform: scaleX(1); }`);

    addEffect("Fill Up Button", "Background slides upward from bottom.", "btn-fill-up", `.btn-fill-up::before { content: ""; position: absolute; inset: 0; background: #4f8cff; transform: translateY(100%); transition: transform .35s ease; z-index: 1; }
.btn-fill-up:hover::before { transform: translateY(0); }`);

    addEffect("Fill Down Button", "Background slides downward from top.", "btn-fill-down", `.btn-fill-down::before { content: ""; position: absolute; inset: 0; background: #4f8cff; transform: translateY(-100%); transition: transform .35s ease; z-index: 1; }
.btn-fill-down:hover::before { transform: translateY(0); }`);

    addEffect("Diagonal Fill Button", "Gradient fills diagonally on hover.", "btn-diagonal-fill", `.btn-diagonal-fill::before { content: ""; position: absolute; inset: 0; background: linear-gradient(135deg, #4f8cff, #8d6bff); transform: translate(-100%, 100%); transition: transform .38s ease; z-index: 1; }
.btn-diagonal-fill:hover::before { transform: translate(0,0); }`);

    addEffect("Split Fill Button", "Two halves fill from opposite sides.", "btn-split-fill", `.btn-split-fill::before, .btn-split-fill::after { content: ""; position: absolute; top: 0; width: 50%; height: 100%; background: #4f8cff; transition: transform .35s ease; z-index: 1; }
.btn-split-fill::before { left: 0; transform: translateY(-100%); }
.btn-split-fill::after { right: 0; transform: translateY(100%); }
.btn-split-fill:hover::before, .btn-split-fill:hover::after { transform: translateY(0); }`);

    addEffect("Center Expand Button", "Fill expands from center horizontally.", "btn-center-expand", `.btn-center-expand::before { content: ""; position: absolute; inset: 0; background: #4f8cff; transform: scaleX(0); transform-origin: center; transition: transform .35s ease; z-index: 1; }
.btn-center-expand:hover::before { transform: scaleX(1); }`);

    addEffect("Circle Reveal Button", "Circle expands behind the text.", "btn-circle-reveal", `.btn-circle-reveal::before { content: ""; position: absolute; width: 22px; height: 22px; border-radius: 50%; background: #4f8cff; transform: scale(0); transition: transform .38s ease; z-index: 1; }
.btn-circle-reveal:hover::before { transform: scale(8); }`);

    addEffect("Ripple Button", "Ripple expands from center repeatedly.", "btn-ripple", `.btn-ripple::after { content: ""; position: absolute; width: 18px; height: 18px; border-radius: 50%; background: rgba(79,140,255,.55); transform: scale(0); animation: btnRipple 1.4s ease-out infinite; z-index: 1; }
@keyframes btnRipple { to { transform: scale(7); opacity: 0; } }`);

    addEffect("Click Ripple Button", "Ripple appears on hover like tap feedback.", "btn-click-ripple", `.btn-click-ripple::after { content: ""; position: absolute; inset: auto; width: 22px; height: 22px; border-radius: 50%; background: rgba(255,255,255,.35); transform: scale(0); transition: .45s ease; z-index: 2; }
.btn-click-ripple:hover::after { transform: scale(8); opacity: 0; }`);

    addEffect("Glow Button", "Continuous blue glow for CTA.", "btn-glow", `.btn-glow { background: linear-gradient(180deg, #5a96ff, #2f6df6); animation: btnGlow 1.8s ease-in-out infinite; }
@keyframes btnGlow { 0%, 100% { box-shadow: 0 0 0 rgba(79,140,255,0); } 50% { box-shadow: 0 0 28px rgba(79,140,255,.75); } }`);

    addEffect("Soft Glow Button", "Soft premium glow animation.", "btn-soft-glow", `.btn-soft-glow { animation: btnSoftGlow 2s ease-in-out infinite; }
@keyframes btnSoftGlow { 0%, 100% { box-shadow: 0 0 0 rgba(255,255,255,0); } 50% { box-shadow: 0 0 24px rgba(255,255,255,.35); } }`);

    addEffect("Neon Button", "Neon border with pulse brightness.", "btn-neon", `.btn-neon { border-color: rgba(79,140,255,.85); box-shadow: 0 0 16px rgba(79,140,255,.35), inset 0 0 14px rgba(79,140,255,.15); text-shadow: 0 0 12px rgba(255,255,255,.8); animation: btnNeon 1.6s ease-in-out infinite; }
@keyframes btnNeon { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.35); } }`);

    addEffect("Red Glow Button", "Red alert glow effect.", "btn-red-glow", `.btn-red-glow { background: rgba(255,95,87,.16); border-color: rgba(255,95,87,.42); animation: btnRedGlow 1.6s ease-in-out infinite; }
@keyframes btnRedGlow { 0%, 100% { box-shadow: 0 0 0 rgba(255,95,87,0); } 50% { box-shadow: 0 0 28px rgba(255,95,87,.75); } }`);

    addEffect("Green Success Button", "Green success pulse style.", "btn-green-success", `.btn-green-success { background: rgba(53,199,89,.18); border-color: rgba(53,199,89,.45); animation: btnGreenSuccess 1.6s ease-in-out infinite; }
@keyframes btnGreenSuccess { 0%, 100% { box-shadow: 0 0 0 rgba(53,199,89,0); transform: scale(1); } 50% { box-shadow: 0 0 26px rgba(53,199,89,.65); transform: scale(1.04); } }`);

    addEffect("Gold Premium Button", "Gold premium glow for paid actions.", "btn-gold-premium", `.btn-gold-premium { background: linear-gradient(90deg, rgba(255,189,46,.24), rgba(255,159,10,.42)); border-color: rgba(255,189,46,.55); color: #fff7df; animation: btnGoldPremium 1.8s ease-in-out infinite; }
@keyframes btnGoldPremium { 0%, 100% { box-shadow: 0 0 0 rgba(255,189,46,0); } 50% { box-shadow: 0 0 28px rgba(255,189,46,.7); } }`);

    addEffect("Shine Button", "White shine sweep passes over button.", "btn-shine", `.btn-shine { background: linear-gradient(180deg, #5a96ff, #2f6df6); }
.btn-shine::after { content: ""; position: absolute; top: -60%; left: -45%; width: 35%; height: 220%; background: rgba(255,255,255,.55); transform: rotate(25deg); animation: btnShine 2.2s linear infinite; z-index: 3; }
@keyframes btnShine { 0% { left: -45%; } 55%, 100% { left: 130%; } }`);

    addEffect("Slow Shine Button", "Slow luxury shine sweep.", "btn-slow-shine", `.btn-slow-shine { background: linear-gradient(180deg, #5a96ff, #2f6df6); }
.btn-slow-shine::after { content: ""; position: absolute; top: -60%; left: -45%; width: 35%; height: 220%; background: rgba(255,255,255,.55); transform: rotate(25deg); animation: btnSlowShine 3.5s linear infinite; z-index: 3; }
@keyframes btnSlowShine { 0% { left: -45%; } 45%, 100% { left: 130%; } }`);

    addEffect("Gradient Button", "Gradient background keeps moving.", "btn-gradient", `.btn-gradient { background: linear-gradient(90deg, #4f8cff, #8d6bff, #4f8cff); background-size: 220%; animation: btnGradient 2.4s ease-in-out infinite; }
@keyframes btnGradient { 0%, 100% { background-position: 0% center; } 50% { background-position: 100% center; } }`);

    addEffect("Rainbow Button", "Rainbow background animation.", "btn-rainbow", `.btn-rainbow { background: linear-gradient(90deg, #ff5f57, #ffbd2e, #35c759, #4f8cff, #8d6bff, #ff5f57); background-size: 300%; animation: btnRainbow 3s linear infinite; border: 0; }
@keyframes btnRainbow { to { background-position: 300% center; } }`);

    addEffect("Holographic Button", "Pastel holographic moving button.", "btn-holo", `.btn-holo { background: linear-gradient(120deg, rgba(255,255,255,.22), rgba(135,247,255,.32), rgba(255,158,231,.28), rgba(255,255,255,.22)); background-size: 260%; border-color: rgba(255,255,255,.26); animation: btnHolo 2.4s ease-in-out infinite; }
@keyframes btnHolo { 0%, 100% { background-position: 0% center; } 50% { background-position: 100% center; } }`);

    addEffect("Glass Button", "Frosted glass hover feel.", "btn-glass", `.btn-glass { background: rgba(255,255,255,.10); backdrop-filter: blur(16px); box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 18px 35px rgba(0,0,0,.28); }
.btn-glass:hover { background: rgba(255,255,255,.18); transform: translateY(-3px); }`);

    addEffect("Blur Glass Button", "More blurred glass look on hover.", "btn-blur-glass", `.btn-blur-glass { background: rgba(255,255,255,.08); backdrop-filter: blur(8px); }
.btn-blur-glass:hover { backdrop-filter: blur(22px); background: rgba(255,255,255,.16); box-shadow: 0 22px 45px rgba(0,0,0,.35); }`);

    addEffect("Border Draw Button", "Animated border line around button.", "btn-border-draw", `.btn-border-draw { background: transparent; }
.btn-border-draw::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 2px; background: linear-gradient(90deg, transparent, #4f8cff, transparent); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; animation: btnBorderDraw 1.7s linear infinite; z-index: 3; }
@keyframes btnBorderDraw { to { filter: hue-rotate(360deg); } }`);

    addEffect("Rotating Border Button", "Conic gradient border rotates.", "btn-rotate-border", `.btn-rotate-border { background: #111; }
.btn-rotate-border::before { content: ""; position: absolute; inset: -60%; background: conic-gradient(from 0deg, transparent, #4f8cff, transparent, #8d6bff, transparent); animation: btnRotateBorder 2s linear infinite; z-index: 1; }
.btn-rotate-border::after { content: ""; position: absolute; inset: 2px; border-radius: inherit; background: #111; z-index: 2; }
@keyframes btnRotateBorder { to { transform: rotate(360deg); } }`);

    addEffect("Dashed Border Button", "Dashed border pulse effect.", "btn-dashed-border", `.btn-dashed-border { border: 2px dashed rgba(79,140,255,.8); animation: btnDashedBorder 1.2s linear infinite; }
@keyframes btnDashedBorder { 0%, 100% { border-color: rgba(79,140,255,.35); } 50% { border-color: rgba(79,140,255,1); } }`);

    addEffect("Lift Button", "Button lifts upward on hover.", "btn-lift", `.btn-lift:hover { transform: translateY(-8px); box-shadow: 0 20px 45px rgba(0,0,0,.42); }`);

    addEffect("Shadow Lift Button", "Button lifts with hard shadow layer.", "btn-shadow-lift", `.btn-shadow-lift { box-shadow: 0 10px 0 rgba(255,255,255,.08); }
.btn-shadow-lift:hover { transform: translateY(-5px); box-shadow: 0 16px 0 rgba(255,255,255,.08), 0 26px 45px rgba(0,0,0,.42); }`);

    addEffect("Scale Hover Button", "Button grows smoothly on hover.", "btn-scale-hover", `.btn-scale-hover:hover { transform: scale(1.1); background: #4f8cff; }`);

    addEffect("Mini Scale Button", "Subtle premium scale on hover.", "btn-mini-scale", `.btn-mini-scale:hover { transform: scale(1.035); background: rgba(79,140,255,.28); }`);

    addEffect("Press Button", "Button feels pressed on hover.", "btn-press", `.btn-press:hover { transform: translateY(4px) scale(.97); box-shadow: inset 0 5px 16px rgba(0,0,0,.35); }`);

@keyframes btnSegment { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(78px); } }`, `<button class="demo-btn btn-segment"><span>A</span><span>B</span></button>`);

    addEffect("Pill Toggle Button", "Pill toggle with glow.", "btn-pill-toggle", `.btn-pill-toggle { border-radius: 999px; animation: btnPillToggle 1.8s ease-in-out infinite; }
@keyframes btnPillToggle { 0%, 100% { background: rgba(255,255,255,.1); } 50% { background: rgba(53,199,89,.25); box-shadow: 0 0 22px rgba(53,199,89,.45); } }`, `<button class="demo-btn btn-pill-toggle"><span>Active</span></button>`);

    addEffect("Tab Button", "Small active tab line moves.", "btn-tab", `.btn-tab::after { content: ""; position: absolute; left: 18px; bottom: 7px; width: 36px; height: 3px; border-radius: 999px; background: #4f8cff; animation: btnTab 1.8s ease-in-out infinite; z-index: 4; }
@keyframes btnTab { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(50px); } }`, `<button class="demo-btn btn-tab"><span>Tabs</span></button>`);

    addEffect("Badge Button", "Small badge pops on button.", "btn-badge", `.btn-badge::after { content: "NEW"; position: absolute; right: -12px; top: -10px; padding: 4px 7px; border-radius: 999px; background: #ff5f57; font-size: 10px; font-weight: 950; animation: btnBadge 1.3s ease-in-out infinite; z-index: 6; }
@keyframes btnBadge { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }`);

    addEffect("Corner Label Button", "Corner label slides in.", "btn-corner-label", `.btn-corner-label::after { content: "PRO"; position: absolute; right: 0; top: 0; padding: 4px 8px; border-radius: 0 15px 0 10px; background: #4f8cff; font-size: 10px; transform: translate(100%,-100%); transition: .28s ease; z-index: 6; }
.btn-corner-label:hover::after { transform: translate(0,0); }`);

    addEffect("Wave Button", "Button waves left and right.", "btn-wave", `.btn-wave { animation: btnWave 1.8s ease-in-out infinite; }
@keyframes btnWave { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(3deg); } 75% { transform: rotate(-3deg); } }`);

    addEffect("Orbit Glow Button", "Small glow dot orbits border.", "btn-orbit-glow", `.btn-orbit-glow::after { content: ""; position: absolute; top: -4px; left: 50%; width: 9px; height: 9px; border-radius: 50%; background: #4f8cff; box-shadow: 0 0 18px rgba(79,140,255,.9); transform-origin: 0 27px; animation: btnOrbitGlow 1.8s linear infinite; z-index: 6; }
@keyframes btnOrbitGlow { to { transform: rotate(360deg); } }`);

    addEffect("Radar Button", "Radar sweep inside button.", "btn-radar", `.btn-radar::before { content: ""; position: absolute; inset: 0; background: conic-gradient(from 0deg, rgba(79,140,255,.55), transparent 35%); animation: btnRadar 1.8s linear infinite; z-index: 1; }
@keyframes btnRadar { to { transform: rotate(360deg); } }`);

    addEffect("Scanline Button", "Horizontal scanline shimmer.", "btn-scanline", `.btn-scanline::before { content: ""; position: absolute; left: 0; right: 0; height: 2px; background: rgba(255,255,255,.5); animation: btnScanline 1.6s ease-in-out infinite; z-index: 5; }
@keyframes btnScanline { 0%,100% { top: 0; opacity:0; } 50% { top: 100%; opacity:1; } }`);

    addEffect("Noise Button", "Subtle glitch noise feeling.", "btn-noise", `.btn-noise { animation: btnNoise .7s steps(2) infinite; }
@keyframes btnNoise { 0%,100% { filter: contrast(1); } 50% { filter: contrast(1.35) brightness(1.2); transform: translate(1px,-1px); } }`);

    addEffect("Final Premium Button", "Clean premium CTA shine and glow.", "btn-final-premium", `.btn-final-premium { background: linear-gradient(90deg, #4f8cff, #8d6bff, #4f8cff); background-size: 240%; border: 0; animation: btnFinalPremium 2.4s ease-in-out infinite; }
.btn-final-premium::after { content: ""; position: absolute; top: -60%; left: -45%; width: 32%; height: 220%; background: rgba(255,255,255,.55); transform: rotate(25deg); animation: btnFinalShine 2.6s linear infinite; z-index: 3; }
@keyframes btnFinalPremium { 0%,100% { background-position: 0% center; box-shadow: 0 0 0 rgba(79,140,255,0); } 50% { background-position: 100% center; box-shadow: 0 0 28px rgba(79,140,255,.65); } }
@keyframes btnFinalShine { 0% { left: -45%; } 55%,100% { left: 130%; } }`);

    const grid = document.getElementById("grid");
    const searchInput = document.getElementById("searchInput");
    const countPill = document.getElementById("countPill");
    const emptyState = document.getElementById("emptyState");
    const loadStatus = document.getElementById("loadStatus");
    const dynamicEffectStyles = document.getElementById("dynamicEffectStyles");

    const batchSize = 20;
    let visibleCount = batchSize;
    let filteredEffects = [...effects];
    let isLoadingMore = false;

    dynamicEffectStyles.textContent = effects.map(effect => effect.css).join("\n\n");

    function copyIcon() {
      return `
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <rect x="9" y="9" width="10" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
          <rect x="5" y="5" width="10" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
        </svg>
      `;
    }

    function renderCards() {
      grid.innerHTML = "";

      const visibleEffects = filteredEffects.slice(0, visibleCount);

      visibleEffects.forEach(effect => {
        const card = document.createElement("div");
        card.className = "card";
        card.dataset.search = `${effect.name} ${effect.about} ${effect.className}`.toLowerCase();

        card.innerHTML = `
          <div class="preview">${effect.html}</div>
          <div class="card-body">
            <div class="name-row">
              <h3>${effect.name}</h3>
              <button class="copy-btn" data-id="${effect.id}" title="Copy code">
                ${copyIcon()}
              </button>
            </div>
            <p>${effect.about}</p>
          </div>
        `;

        grid.appendChild(card);
      });

      document.querySelectorAll(".copy-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          copyCode(btn.dataset.id);
        });
      });

      emptyState.style.display = filteredEffects.length ? "none" : "block";
      countPill.textContent = filteredEffects.length + " Effects";

      const shown = Math.min(visibleCount, filteredEffects.length);
      loadStatus.textContent = `Showing ${shown} of ${filteredEffects.length} effects`;

      if (filteredEffects.length === 0) {
        loadStatus.style.display = "none";
      } else {
        loadStatus.style.display = "block";
      }
    }

    function copyCode(id) {
      const effect = effects.find(item => item.id === id);

      if (!effect) {
        showToast("Code not found");
        return;
      }

      const code = `${effect.html}

<style>
${baseButtonCSS}

${effect.css}
</style>`;

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(code).then(() => {
          showToast("Code copied");
        }).catch(() => {
          fallbackCopy(code);
        });
      } else {
        fallbackCopy(code);
      }
    }

    function fallbackCopy(text) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      textarea.style.top = "-9999px";
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();

      try {
        document.execCommand("copy");
        showToast("Code copied");
      } catch (err) {
        showToast("Copy failed");
      }

      document.body.removeChild(textarea);
    }

    function showToast(message) {
      const oldToast = document.querySelector(".toast");
      if (oldToast) oldToast.remove();

      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = message;
      document.body.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.add("show");
      });

      setTimeout(() => {
        toast.classList.remove("show");
        setTimeout(() => toast.remove(), 250);
      }, 1500);
    }

    function applySearch() {
      const value = searchInput.value.trim().toLowerCase();

      filteredEffects = effects.filter(effect => {
        return (
          effect.name.toLowerCase().includes(value) ||
          effect.about.toLowerCase().includes(value) ||
          effect.className.toLowerCase().includes(value)
        );
      });

      visibleCount = batchSize;
      renderCards();
    }

    function loadMoreOnScroll() {
      if (isLoadingMore) return;
      if (visibleCount >= filteredEffects.length) return;

      const nearBottom = window.innerHeight + window.scrollY >= document.body.offsetHeight - 450;

      if (nearBottom) {
        isLoadingMore = true;

        setTimeout(() => {
          visibleCount += batchSize;
          renderCards();
          isLoadingMore = false;
        }, 180);
      }
    }

    searchInput.addEventListener("input", applySearch);
    window.addEventListener("scroll", loadMoreOnScroll);

    renderCards();
  </script>
</body>
</html>
