<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Button Animation Effects</title>

  <style>
    :root {
      --bg: #000;
      --card: rgba(255,255,255,0.08);
      --card2: rgba(255,255,255,0.12);
      --border: rgba(255,255,255,0.14);
      --text: #fff;
      --muted: rgba(255,255,255,0.58);
      --blue: #4f8cff;
      --green: #35c759;
      --red: #ff5f57;
      --yellow: #ffbd2e;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,0.15), transparent 24%),
        radial-gradient(circle at 18% 28%, rgba(79,140,255,0.11), transparent 28%),
        linear-gradient(180deg, #000, #050505 55%, #090909);
      color: var(--text);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.024) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.024) 1px, transparent 1px);
      background-size: 70px 70px;
      mask-image: radial-gradient(circle at center, black, transparent 75%);
      z-index: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(100%, 1480px);
      margin: 0 auto;
      padding: 22px;
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 16px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px;
      border-radius: 24px;
      background: rgba(20,20,20,0.78);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(26px);
      box-shadow: 0 20px 70px rgba(0,0,0,0.46);
      margin-bottom: 30px;
    }

    .search-box {
      width: 280px;
      height: 46px;
      border-radius: 16px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.12);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      flex: 0 0 auto;
    }

    .search-box svg {
      color: rgba(255,255,255,0.58);
      flex: 0 0 auto;
    }

    .search-box input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font-size: 14px;
      font-weight: 750;
    }

    .search-box input::placeholder {
      color: rgba(255,255,255,0.45);
    }

    .menu {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      flex: 1;
    }

    .menu::-webkit-scrollbar {
      display: none;
    }

    .menu a {
      height: 46px;
      padding: 0 16px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.68);
      font-size: 14px;
      font-weight: 850;
      border: 1px solid transparent;
      white-space: nowrap;
      transition: 180ms ease;
    }

    .menu a:hover,
    .menu a.active {
      background: rgba(255,255,255,0.11);
      border-color: rgba(255,255,255,0.12);
      color: white;
    }

    .menu a.active {
      background: rgba(79,140,255,0.22);
      border-color: rgba(79,140,255,0.38);
    }

    .content-header {
      margin-bottom: 24px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
    }

    .title-block h1 {
      font-size: clamp(34px, 4.8vw, 64px);
      line-height: 0.95;
      letter-spacing: -0.065em;
      font-weight: 950;
      margin-bottom: 10px;
    }

    .title-block p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
      font-weight: 650;
      max-width: 680px;
    }

    .count-pill {
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.74);
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      padding-bottom: 70px;
    }

    .card {
      min-height: 238px;
      border-radius: 24px;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,0.12), transparent 50%),
        linear-gradient(180deg, rgba(255,255,255,0.09), rgba(255,255,255,0.04));
      border: 1px solid var(--border);
      overflow: hidden;
      transition: 220ms ease;
      box-shadow: 0 18px 50px rgba(0,0,0,0.25);
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(255,255,255,0.24);
      box-shadow: 0 28px 80px rgba(0,0,0,0.44);
    }

    .preview {
      height: 138px;
      display: grid;
      place-items: center;
      padding: 18px;
      border-bottom: 1px solid rgba(255,255,255,0.09);
      background: rgba(0,0,0,0.20);
      overflow: hidden;
    }

    .demo-btn {
      position: relative;
      min-width: 132px;
      height: 46px;
      border: 0;
      border-radius: 15px;
      padding: 0 20px;
      color: white;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.18);
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      overflow: hidden;
      transition: 220ms ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      isolation: isolate;
    }

    .card-body {
      padding: 15px;
    }

    .name-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .name-row h3 {
      font-size: 16px;
      line-height: 1.12;
      letter-spacing: -0.03em;
      font-weight: 900;
    }

    .copy-btn {
      width: 36px;
      height: 36px;
      border-radius: 13px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.085);
      color: white;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex: 0 0 auto;
      transition: 180ms ease;
    }

    .copy-btn:hover {
      background: rgba(79,140,255,0.95);
      border-color: rgba(79,140,255,0.95);
      transform: translateY(-2px);
    }

    .card-body p {
      color: rgba(255,255,255,0.55);
      font-size: 12.5px;
      line-height: 1.45;
      font-weight: 650;
    }

    .empty {
      padding: 24px;
      border-radius: 22px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.72);
      text-align: center;
      font-weight: 750;
      margin-bottom: 20px;
      display: none;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%) translateY(18px);
      padding: 13px 18px;
      border-radius: 16px;
      background: rgba(255,255,255,0.93);
      color: #111;
      font-size: 13px;
      font-weight: 850;
      box-shadow: 0 18px 60px rgba(0,0,0,0.45);
      opacity: 0;
      pointer-events: none;
      transition: 220ms ease;
      z-index: 9999;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Button Animations */
    .btn-fill {
      background: rgba(255,255,255,0.08);
    }
    .btn-fill::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--blue);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .35s ease;
      z-index: -1;
    }
    .btn-fill:hover::before {
      transform: scaleX(1);
    }

    .btn-slide-up::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--blue);
      transform: translateY(100%);
      transition: transform .35s ease;
      z-index: -1;
    }
    .btn-slide-up:hover::before {
      transform: translateY(0);
    }

    .btn-glow {
      background: linear-gradient(180deg, #5a96ff, #2f6df6);
      box-shadow: 0 0 0 rgba(79,140,255,0);
      animation: glowButton 1.8s ease-in-out infinite;
    }
    @keyframes glowButton {
      0%, 100% { box-shadow: 0 0 0 rgba(79,140,255,0); }
      50% { box-shadow: 0 0 28px rgba(79,140,255,.75); }
    }

    .btn-neon {
      border-color: rgba(79,140,255,.8);
      box-shadow: 0 0 16px rgba(79,140,255,.35), inset 0 0 14px rgba(79,140,255,.15);
      text-shadow: 0 0 12px rgba(255,255,255,.8);
      animation: neonPulse 1.7s ease-in-out infinite;
    }
    @keyframes neonPulse {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.35); }
    }

    .btn-shine {
      background: linear-gradient(180deg, #5a96ff, #2f6df6);
    }
    .btn-shine::after {
      content: "";
      position: absolute;
      top: -60%;
      left: -40%;
      width: 35%;
      height: 220%;
      background: rgba(255,255,255,.55);
      transform: rotate(25deg);
      animation: shineSweep 2.2s linear infinite;
    }
    @keyframes shineSweep {
      0% { left: -45%; }
      55%, 100% { left: 130%; }
    }

    .btn-ripple::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(79,140,255,.55);
      transform: scale(0);
      animation: rippleBtn 1.4s ease-out infinite;
    }
    @keyframes rippleBtn {
      to { transform: scale(7); opacity: 0; }
    }

    .btn-float {
      background: linear-gradient(180deg, #5a96ff, #2f6df6);
      animation: floatBtn 2.2s ease-in-out infinite;
    }
    @keyframes floatBtn {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .btn-bounce {
      background: linear-gradient(180deg, #5a96ff, #2f6df6);
      animation: bounceBtn 1.5s ease-in-out infinite;
    }
    @keyframes bounceBtn {
      0%, 100% { transform: translateY(0); }
      40% { transform: translateY(-10px); }
      60% { transform: translateY(3px); }
    }

    .btn-pulse {
      background: linear-gradient(180deg, #5a96ff, #2f6df6);
      animation: pulseBtn 1.5s ease-in-out infinite;
    }
    @keyframes pulseBtn {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    .btn-press:hover {
      transform: translateY(4px) scale(.97);
      box-shadow: inset 0 5px 16px rgba(0,0,0,.35);
    }

    .btn-tilt {
      animation: tiltBtn 2.2s ease-in-out infinite;
      transform-style: preserve-3d;
    }
    @keyframes tiltBtn {
      0%, 100% { transform: perspective(500px) rotateX(0deg) rotateY(0deg); }
      50% { transform: perspective(500px) rotateX(10deg) rotateY(-12deg); }
    }

    .btn-arrow span {
      transition: transform .25s ease;
    }
    .btn-arrow:hover span {
      transform: translateX(6px);
    }

    .btn-border-draw {
      background: transparent;
    }
    .btn-border-draw::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 2px;
      background: linear-gradient(90deg, transparent, var(--blue), transparent);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: borderMove 1.7s linear infinite;
    }
    @keyframes borderMove {
      to { filter: hue-rotate(360deg); }
    }

    .btn-gradient {
      background: linear-gradient(90deg, #4f8cff, #8d6bff, #4f8cff);
      background-size: 220%;
      animation: gradientBtn 2.5s ease-in-out infinite;
    }
    @keyframes gradientBtn {
      0%, 100% { background-position: 0% center; }
      50% { background-position: 100% center; }
    }

    .btn-glass {
      background: rgba(255,255,255,.10);
      backdrop-filter: blur(16px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 18px 35px rgba(0,0,0,.28);
    }
    .btn-glass:hover {
      background: rgba(255,255,255,.18);
      transform: translateY(-3px);
    }

    .btn-jelly {
      animation: jellyBtn 1.8s ease-in-out infinite;
    }
    @keyframes jellyBtn {
      0%, 100% { transform: scale(1); }
      30% { transform: scale(1.12, .88); }
      45% { transform: scale(.92, 1.08); }
      60% { transform: scale(1.04, .96); }
    }

    .btn-loading {
      color: transparent;
    }
    .btn-loading::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,.25);
      border-top-color: #fff;
      animation: spinBtn .8s linear infinite;
    }
    @keyframes spinBtn {
      to { transform: rotate(360deg); }
    }

    .btn-success {
      background: rgba(53,199,89,.18);
      border-color: rgba(53,199,89,.45);
      color: #fff;
    }
    .btn-success span {
      animation: successPop 1.5s ease-in-out infinite;
    }
    @keyframes successPop {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.25); }
    }

    .btn-danger {
      background: rgba(255,95,87,.16);
      border-color: rgba(255,95,87,.42);
      animation: dangerShake 1.2s ease-in-out infinite;
    }
    @keyframes dangerShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-3px); }
      40% { transform: translateX(3px); }
      60% { transform: translateX(-2px); }
      80% { transform: translateX(2px); }
    }

    .btn-scale-hover:hover {
      transform: scale(1.1);
      background: var(--blue);
    }

    .btn-rotate-hover:hover {
      transform: rotate(-3deg) scale(1.06);
      background: var(--blue);
    }

    .btn-split::before,
    .btn-split::after {
      content: "";
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      background: var(--blue);
      z-index: -1;
      transition: transform .35s ease;
    }
    .btn-split::before {
      left: 0;
      transform: translateY(-100%);
    }
    .btn-split::after {
      right: 0;
      transform: translateY(100%);
    }
    .btn-split:hover::before,
    .btn-split:hover::after {
      transform: translateY(0);
    }

    .btn-magnetic {
      animation: magneticBtn 2.4s ease-in-out infinite;
    }
    @keyframes magneticBtn {
      0%, 100% { transform: translate(0,0); }
      25% { transform: translate(5px,-4px); }
      50% { transform: translate(-4px,5px); }
      75% { transform: translate(4px,3px); }
    }

    .btn-stretch:hover {
      letter-spacing: .08em;
      min-width: 150px;
      background: var(--blue);
    }

    .btn-blink {
      background: linear-gradient(180deg, #5a96ff, #2f6df6);
      animation: blinkBtn 1.1s ease-in-out infinite;
    }
    @keyframes blinkBtn {
      0%, 100% { opacity: 1; }
      50% { opacity: .55; }
    }

    .btn-shadow-lift {
      background: rgba(255,255,255,.12);
      box-shadow: 0 10px 0 rgba(255,255,255,.08);
    }
    .btn-shadow-lift:hover {
      transform: translateY(-5px);
      box-shadow: 0 16px 0 rgba(255,255,255,.08);
    }

    @media (max-width: 1100px) {
      .grid { grid-template-columns: repeat(3, 1fr); }
      .topbar { align-items: flex-start; flex-direction: column; }
      .search-box { width: 100%; }
      .menu { width: 100%; }
    }

    @media (max-width: 760px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
      .content-header { display: block; }
      .count-pill { display: inline-block; margin-top: 12px; }
    }

    @media (max-width: 520px) {
      .page { padding: 12px; }
      .topbar { top: 10px; border-radius: 20px; }
      .menu a { height: 42px; padding: 0 13px; font-size: 13px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <div class="page">
    <header class="topbar">
      <div class="search-box">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2.2"/>
          <path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <input id="searchInput" type="text" placeholder="Search effect..." />
      </div>

      <nav class="menu">
        <a href="text-animation.html">Text</a>
        <a class="active" href="button-animation.html">Button</a>
        <a href="hover-effects.html">Hover</a>
        <a href="card-effects.html">Card</a>
        <a href="ui-motion.html">UI Motion</a>
        <a href="loader-effects.html">Loader</a>
        <a href="input-focus-effects.html">Input</a>
        <a href="cursor-effects.html">Cursor</a>
        <a href="background-effects.html">Background</a>
      </nav>
    </header>

    <main>
      <header class="content-header">
        <div class="title-block">
          <h1>Button Animation</h1>
          <p>Live button hover and motion effects with effect name, short usage note, and copy-code button.</p>
        </div>

        <div class="count-pill" id="countPill">0 Effects</div>
      </header>

      <div id="emptyState" class="empty">
        No effect found. Try searching “glow”, “shine”, “ripple”, “loading”, or “hover”.
      </div>

      <section id="grid" class="grid"></section>
    </main>
  </div>

  <script>
    const effects = [
      {
        name: "Fill Button",
        about: "Background fills from left to right on hover.",
        className: "btn-fill",
        html: '<button class="btn-fill">Button</button>',
        css: `.btn-fill {
  position: relative;
  overflow: hidden;
  z-index: 1;
}
.btn-fill::before {
  content: "";
  position: absolute;
  inset: 0;
  background: #4f8cff;
  transform: scaleX(0);
  transform-origin: left;
  transition: transform .35s ease;
  z-index: -1;
}
.btn-fill:hover::before {
  transform: scaleX(1);
}`
      },
      {
        name: "Slide Up Button",
        about: "Background slides upward from bottom on hover.",
        className: "btn-slide-up",
        html: '<button class="btn-slide-up">Button</button>',
        css: `.btn-slide-up {
  position: relative;
  overflow: hidden;
  z-index: 1;
}
.btn-slide-up::before {
  content: "";
  position: absolute;
  inset: 0;
  background: #4f8cff;
  transform: translateY(100%);
  transition: transform .35s ease;
  z-index: -1;
}
.btn-slide-up:hover::before {
  transform: translateY(0);
}`
      },
      {
        name: "Glow Button",
        about: "Continuous glow animation for important CTA buttons.",
        className: "btn-glow",
        html: '<button class="btn-glow">Button</button>',
        css: `.btn-glow {
  background: linear-gradient(180deg, #5a96ff, #2f6df6);
  color: white;
  animation: glowButton 1.8s ease-in-out infinite;
}
@keyframes glowButton {
  0%, 100% { box-shadow: 0 0 0 rgba(79,140,255,0); }
  50% { box-shadow: 0 0 28px rgba(79,140,255,.75); }
}`
      },
      {
        name: "Neon Button",
        about: "Neon border and brightness pulse for gaming UI.",
        className: "btn-neon",
        html: '<button class="btn-neon">Button</button>',
        css: `.btn-neon {
  border: 1px solid rgba(79,140,255,.8);
  box-shadow: 0 0 16px rgba(79,140,255,.35), inset 0 0 14px rgba(79,140,255,.15);
  text-shadow: 0 0 12px rgba(255,255,255,.8);
  animation: neonPulse 1.7s ease-in-out infinite;
}
@keyframes neonPulse {
  0%, 100% { filter: brightness(1); }
  50% { filter: brightness(1.35); }
}`
      },
      {
        name: "Shine Button",
        about: "Premium light sweep animation across the button.",
        className: "btn-shine",
        html: '<button class="btn-shine">Button</button>',
        css: `.btn-shine {
  position: relative;
  overflow: hidden;
  background: linear-gradient(180deg, #5a96ff, #2f6df6);
}
.btn-shine::after {
  content: "";
  position: absolute;
  top: -60%;
  left: -40%;
  width: 35%;
  height: 220%;
  background: rgba(255,255,255,.55);
  transform: rotate(25deg);
  animation: shineSweep 2.2s linear infinite;
}
@keyframes shineSweep {
  0% { left: -45%; }
  55%, 100% { left: 130%; }
}`
      },
      {
        name: "Ripple Button",
        about: "Soft ripple pulse from center for interactive buttons.",
        className: "btn-ripple",
        html: '<button class="btn-ripple">Button</button>',
        css: `.btn-ripple {
  position: relative;
  overflow: hidden;
}
.btn-ripple::after {
  content: "";
  position: absolute;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: rgba(79,140,255,.55);
  transform: scale(0);
  animation: rippleBtn 1.4s ease-out infinite;
}
@keyframes rippleBtn {
  to { transform: scale(7); opacity: 0; }
}`
      },
      {
        name: "Floating Button",
        about: "Button floats smoothly up and down.",
        className: "btn-float",
        html: '<button class="btn-float">Button</button>',
        css: `.btn-float {
  background: linear-gradient(180deg, #5a96ff, #2f6df6);
  animation: floatBtn 2.2s ease-in-out infinite;
}
@keyframes floatBtn {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}`
      },

    const grid = document.getElementById("grid");
    const searchInput = document.getElementById("searchInput");
    const countPill = document.getElementById("countPill");
    const emptyState = document.getElementById("emptyState");

    function copyIcon() {
      return `
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <rect x="9" y="9" width="10" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
          <rect x="5" y="5" width="10" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
        </svg>
      `;
    }

    function renderCards(list) {
      grid.innerHTML = "";

      list.forEach(effect => {
        const card = document.createElement("div");
        card.className = "card";
        card.dataset.search = `${effect.name} ${effect.about} ${effect.className}`.toLowerCase();

        const preview = effect.previewHtml || `<button class="demo-btn ${effect.className}">Button</button>`;

        card.innerHTML = `
          <div class="preview">${preview}</div>
          <div class="card-body">
            <div class="name-row">
              <h3>${effect.name}</h3>
              <button class="copy-btn" data-id="${effect.id}" title="Copy code">
                ${copyIcon()}
              </button>
            </div>
            <p>${effect.about}</p>
          </div>
        `;

        grid.appendChild(card);
      });

      document.querySelectorAll(".copy-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          copyCode(btn.dataset.id);
        });
      });

      countPill.textContent = list.length + " Effects";
      emptyState.style.display = list.length ? "none" : "block";
    }

    effects.forEach((effect, index) => {
      effect.id = String(index);
    });

    function copyCode(id) {
      const effect = effects.find(item => item.id === id);

      if (!effect) {
        showToast("Code not found");
        return;
      }

      const baseCSS = `.demo-btn {
  position: relative;
  min-width: 132px;
  height: 46px;
  border: 0;
  border-radius: 15px;
  padding: 0 20px;
  color: white;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.18);
  font-size: 14px;
  font-weight: 900;
  cursor: pointer;
  overflow: hidden;
  transition: 220ms ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}`;

      const code = `${effect.html}

<style>
${baseCSS}

${effect.css}
</style>`;

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(code).then(() => {
          showToast("Code copied");
        }).catch(() => {
          fallbackCopy(code);
        });
      } else {
        fallbackCopy(code);
      }
    }

    function fallbackCopy(text) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      textarea.style.top = "-9999px";
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();

      try {
        document.execCommand("copy");
        showToast("Code copied");
      } catch (err) {
        showToast("Copy failed");
      }

      document.body.removeChild(textarea);
    }

    function showToast(message) {
      const oldToast = document.querySelector(".toast");
      if (oldToast) oldToast.remove();

      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = message;
      document.body.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.add("show");
      });

      setTimeout(() => {
        toast.classList.remove("show");
        setTimeout(() => toast.remove(), 250);
      }, 1500);
    }

    searchInput.addEventListener("input", () => {
      const value = searchInput.value.trim().toLowerCase();

      const filtered = effects.filter(effect => {
        return (
          effect.name.toLowerCase().includes(value) ||
          effect.about.toLowerCase().includes(value) ||
          effect.className.toLowerCase().includes(value)
        );
      });

      renderCards(filtered);
    });

    renderCards(effects);
  </script>
