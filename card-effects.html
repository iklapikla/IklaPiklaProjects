<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Effects</title>

  <style>
    :root {
      --bg: #000;
      --border: rgba(255,255,255,0.14);
      --text: #fff;
      --muted: rgba(255,255,255,0.58);
      --blue: #4f8cff;
      --purple: #8d6bff;
      --green: #35c759;
      --red: #ff5f57;
      --yellow: #ffbd2e;
      --orange: #ff9f0a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,0.15), transparent 24%),
        radial-gradient(circle at 18% 28%, rgba(79,140,255,0.11), transparent 28%),
        linear-gradient(180deg, #000, #050505 55%, #090909);
      color: var(--text);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.024) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.024) 1px, transparent 1px);
      background-size: 70px 70px;
      mask-image: radial-gradient(circle at center, black, transparent 75%);
      z-index: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(100%, 1560px);
      margin: 0 auto;
      padding: 22px;
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 16px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px;
      border-radius: 24px;
      background: rgba(20,20,20,0.78);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(26px);
      box-shadow: 0 20px 70px rgba(0,0,0,0.46);
      margin-bottom: 30px;
    }

    .search-box {
      width: 280px;
      height: 46px;
      border-radius: 16px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.12);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      flex: 0 0 auto;
    }

    .search-box svg {
      color: rgba(255,255,255,0.58);
      flex: 0 0 auto;
    }

    .search-box input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font-size: 14px;
      font-weight: 750;
    }

    .search-box input::placeholder {
      color: rgba(255,255,255,0.45);
    }

    .menu {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      flex: 1;
    }

    .menu::-webkit-scrollbar {
      display: none;
    }

    .menu a {
      height: 46px;
      padding: 0 16px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.68);
      font-size: 14px;
      font-weight: 850;
      border: 1px solid transparent;
      white-space: nowrap;
      transition: 180ms ease;
    }

    .menu a:hover,
    .menu a.active {
      background: rgba(255,255,255,0.11);
      border-color: rgba(255,255,255,0.12);
      color: white;
    }

    .menu a.active {
      background: rgba(79,140,255,0.22);
      border-color: rgba(79,140,255,0.38);
    }

    .content-header {
      margin-bottom: 24px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
    }

    .title-block h1 {
      font-size: clamp(34px, 4.8vw, 64px);
      line-height: 0.95;
      letter-spacing: -0.065em;
      font-weight: 950;
      margin-bottom: 10px;
    }

    .title-block p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
      font-weight: 650;
      max-width: 760px;
    }

    .count-pill {
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.74);
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
      padding-bottom: 35px;
    }

    .card {
      min-height: 238px;
      border-radius: 24px;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,0.12), transparent 50%),
        linear-gradient(180deg, rgba(255,255,255,0.09), rgba(255,255,255,0.04));
      border: 1px solid var(--border);
      overflow: hidden;
      transition: 220ms ease;
      box-shadow: 0 18px 50px rgba(0,0,0,0.25);
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(255,255,255,0.24);
      box-shadow: 0 28px 80px rgba(0,0,0,0.44);
    }

    .preview {
      height: 138px;
      display: grid;
      place-items: center;
      padding: 18px;
      border-bottom: 1px solid rgba(255,255,255,0.09);
      background: rgba(0,0,0,0.20);
      overflow: hidden;
      position: relative;
      perspective: 900px;
    }

    .demo-card {
      position: relative;
      width: 132px;
      height: 90px;
      border-radius: 22px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.07));
      border: 1px solid rgba(255,255,255,.16);
      display: grid;
      place-items: center;
      color: white;
      font-size: 14px;
      font-weight: 900;
      overflow: hidden;
      transition: 260ms ease;
      box-shadow: 0 14px 34px rgba(0,0,0,.28);
      isolation: isolate;
      transform-style: preserve-3d;
    }

    .demo-card span {
      position: relative;
      z-index: 5;
    }

    .card-body {
      padding: 15px;
    }

    .name-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .name-row h3 {
      font-size: 16px;
      line-height: 1.12;
      letter-spacing: -0.03em;
      font-weight: 900;
    }

    .copy-btn {
      width: 36px;
      height: 36px;
      border-radius: 13px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.085);
      color: white;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex: 0 0 auto;
      transition: 180ms ease;
    }

    .copy-btn:hover {
      background: rgba(79,140,255,0.95);
      border-color: rgba(79,140,255,0.95);
      transform: translateY(-2px);
    }

    .card-body p {
      color: rgba(255,255,255,0.55);
      font-size: 12.5px;
      line-height: 1.45;
      font-weight: 650;
    }

    .empty {
      padding: 24px;
      border-radius: 22px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.72);
      text-align: center;
      font-weight: 750;
      margin-bottom: 20px;
      display: none;
    }

    .load-status {
      margin: 0 auto 70px;
      width: fit-content;
      padding: 12px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.65);
      font-size: 12px;
      font-weight: 850;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%) translateY(18px);
      padding: 13px 18px;
      border-radius: 16px;
      background: rgba(255,255,255,0.93);
      color: #111;
      font-size: 13px;
      font-weight: 850;
      box-shadow: 0 18px 60px rgba(0,0,0,0.45);
      opacity: 0;
      pointer-events: none;
      transition: 220ms ease;
      z-index: 9999;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 1280px) {
      .grid { grid-template-columns: repeat(4, 1fr); }
    }

    @media (max-width: 1100px) {
      .grid { grid-template-columns: repeat(3, 1fr); }
      .topbar { align-items: flex-start; flex-direction: column; }
      .search-box { width: 100%; }
      .menu { width: 100%; }
    }

    @media (max-width: 760px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
      .content-header { display: block; }
      .count-pill { display: inline-block; margin-top: 12px; }
    }

    @media (max-width: 520px) {
      .page { padding: 12px; }
      .topbar { top: 10px; border-radius: 20px; }
      .menu a { height: 42px; padding: 0 13px; font-size: 13px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <div class="page">
    <header class="topbar">
      <div class="search-box">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2.2"/>
          <path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <input id="searchInput" type="text" placeholder="Search effect..." />
      </div>

      <nav class="menu" id="mainMenu"></nav>
    </header>

    <main>
      <header class="content-header">
        <div class="title-block">
          <h1>Card Effects</h1>
          <p>100 live card and box effects. First 20 effects load initially, then next 20 effects load automatically while scrolling.</p>
        </div>

        <div class="count-pill" id="countPill">0 Effects</div>
      </header>

      <div id="emptyState" class="empty">
        No effect found. Try searching “glow”, “tilt”, “glass”, “overlay”, “premium”, “3D”, or “shadow”.
      </div>

      <section id="grid" class="grid"></section>

      <div id="loadStatus" class="load-status">Showing 0 of 100 effects</div>
    </main>
  </div>

  <style id="dynamicEffectStyles"></style>

  <script src="nav.js"></script>

  <script>
    const effects = [];

    const baseCardCSS = `.demo-card {
  position: relative;
  width: 132px;
  height: 90px;
  border-radius: 22px;
  background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.07));
  border: 1px solid rgba(255,255,255,.16);
  display: grid;
  place-items: center;
  color: white;
  font-size: 14px;
  font-weight: 900;
  overflow: hidden;
  transition: 260ms ease;
  box-shadow: 0 14px 34px rgba(0,0,0,.28);
  isolation: isolate;
  transform-style: preserve-3d;
}
.demo-card span {
  position: relative;
  z-index: 5;
}`;

    const commonKeyframes = `
@keyframes cardSpin { to { transform: rotate(360deg); } }
@keyframes cardBounce { 0%,100%{transform:translateY(0);} 40%{transform:translateY(-14px);} 60%{transform:translateY(4px);} }
@keyframes cardPulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.08);} }
@keyframes cardFloat { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-12px);} }
@keyframes cardGlowPulse { 0%,100%{box-shadow:0 0 0 rgba(79,140,255,0);} 50%{box-shadow:0 0 34px rgba(79,140,255,.75);} }
@keyframes cardShake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }
@keyframes cardSwing { 0%,100%{transform:rotate(0);} 25%{transform:rotate(7deg);} 75%{transform:rotate(-7deg);} }
@keyframes cardGradient { 0%,100%{background-position:0% center;} 50%{background-position:100% center;} }
@keyframes cardShineMove { 0%{left:-45%;} 55%,100%{left:130%;} }
@keyframes cardScan { 0%,100%{top:0;} 50%{top:calc(100% - 3px);} }
@keyframes cardBorderRotate { to { transform:rotate(360deg); } }
@keyframes cardPop { from { transform:scale(.4); opacity:0; } to { transform:scale(1); opacity:1; } }
@keyframes cardJelly { 0%,100%{transform:scale(1);} 30%{transform:scale(1.12,.88);} 50%{transform:scale(.92,1.08);} 70%{transform:scale(1.04,.96);} }
@keyframes cardRubber { 0%,100%{transform:scale(1);} 35%{transform:scaleX(1.22) scaleY(.82);} 55%{transform:scaleX(.9) scaleY(1.12);} 75%{transform:scaleX(1.04) scaleY(.96);} }
@keyframes cardWobble { 0%,100%{transform:translateX(0);} 20%{transform:translateX(-9px) rotate(-3deg);} 40%{transform:translateX(7px) rotate(2deg);} 60%{transform:translateX(-5px) rotate(-2deg);} 80%{transform:translateX(3px) rotate(1deg);} }
`;

    function addEffect(name, about, className, css, html) {
      effects.push({
        id: String(effects.length),
        name,
        about,
        className,
        html: html || `<div class="demo-card ${className}"><span>Card</span></div>`,
        css
      });
    }

    addEffect("Card Lift", "Card lifts upward with deeper shadow.", "card-lift", `.card-lift:hover { transform: translateY(-14px); box-shadow: 0 32px 70px rgba(0,0,0,.52); }`);
    addEffect("Card Scale", "Card scales up smoothly on hover.", "card-scale", `.card-scale:hover { transform: scale(1.12); background: rgba(79,140,255,.28); }`);
    addEffect("Card Shrink", "Card shrinks slightly on hover.", "card-shrink", `.card-shrink:hover { transform: scale(.88); background: rgba(141,107,255,.22); }`);
    addEffect("Card Press", "Card feels pressed inward.", "card-press", `.card-press:hover { transform: translateY(6px) scale(.96); box-shadow: inset 0 8px 18px rgba(0,0,0,.35); }`);
    addEffect("Card Push Down", "Physical push-down card motion.", "card-push-down", `.card-push-down { box-shadow: 0 9px 0 rgba(255,255,255,.08); } .card-push-down:hover { transform: translateY(9px); box-shadow: 0 0 0 rgba(255,255,255,0); }`);
    addEffect("Card Glow", "Blue glow appears around the card.", "card-glow", `.card-glow:hover { border-color: rgba(79,140,255,.95); box-shadow: 0 0 36px rgba(79,140,255,.7); }`);
    addEffect("Soft Glow Card", "Soft white glow on hover.", "card-soft-glow", `.card-soft-glow:hover { box-shadow: 0 0 28px rgba(255,255,255,.35); border-color: rgba(255,255,255,.35); }`);
    addEffect("Red Glow Card", "Red warning-style glow.", "card-red-glow", `.card-red-glow:hover { background: rgba(255,95,87,.16); border-color: rgba(255,95,87,.55); box-shadow: 0 0 32px rgba(255,95,87,.65); }`);
    addEffect("Green Glow Card", "Green success-style glow.", "card-green-glow", `.card-green-glow:hover { background: rgba(53,199,89,.16); border-color: rgba(53,199,89,.55); box-shadow: 0 0 32px rgba(53,199,89,.65); }`);
    addEffect("Gold Glow Card", "Gold premium glow effect.", "card-gold-glow", `.card-gold-glow:hover { background: rgba(255,189,46,.16); border-color: rgba(255,189,46,.6); box-shadow: 0 0 32px rgba(255,189,46,.65); }`);

    addEffect("Border Glow Card", "Inner and outer border glow.", "card-border-glow", `.card-border-glow:hover { border-color: rgba(79,140,255,1); box-shadow: inset 0 0 0 1px rgba(79,140,255,.55), 0 0 28px rgba(79,140,255,.52); }`);
    addEffect("Inset Glow Card", "Card glows from inside.", "card-inset-glow", `.card-inset-glow:hover { box-shadow: inset 0 0 24px rgba(79,140,255,.55), 0 0 18px rgba(79,140,255,.25); }`);
    addEffect("Shadow Expand Card", "Card shadow expands with depth.", "card-shadow-expand", `.card-shadow-expand:hover { transform: translateY(-7px); box-shadow: 0 18px 0 rgba(255,255,255,.07), 0 35px 70px rgba(0,0,0,.48); }`);
    addEffect("Layered Shadow Card", "Stacked shadow layers appear.", "card-layered-shadow", `.card-layered-shadow { box-shadow: 8px 8px 0 rgba(255,255,255,.06), 16px 16px 0 rgba(255,255,255,.03); } .card-layered-shadow:hover { transform: translate(-6px,-6px); box-shadow: 14px 14px 0 rgba(79,140,255,.16), 28px 28px 0 rgba(79,140,255,.07); }`);
    addEffect("Floating Shadow Card", "Floating shadow moves under card.", "card-floating-shadow", `.card-floating-shadow::after { content:""; position:absolute; left:22%; right:22%; bottom:-12px; height:12px; border-radius:50%; background:rgba(0,0,0,.45); filter:blur(6px); z-index:-1; } .card-floating-shadow:hover::after { transform:scale(.72); opacity:.45; }`);
    addEffect("Rotate Card", "Card rotates slightly on hover.", "card-rotate", `.card-rotate:hover { transform: rotate(-5deg) scale(1.06); background: rgba(79,140,255,.28); }`);
    addEffect("Rotate Right Card", "Card rotates right on hover.", "card-rotate-right", `.card-rotate-right:hover { transform: rotate(6deg) scale(1.06); background: rgba(141,107,255,.28); }`);
    addEffect("Spin Card", "Card spins once on hover.", "card-spin-hover", `.card-spin-hover:hover { transform: rotate(360deg); background: rgba(79,140,255,.26); }`);
    addEffect("Flip X Card", "Card flips vertically in 3D.", "card-flip-x", `.card-flip-x:hover { transform: rotateX(180deg); }`);
    addEffect("Flip Y Card", "Card flips horizontally in 3D.", "card-flip-y", `.card-flip-y:hover { transform: rotateY(180deg); }`);

    addEffect("3D Tilt Card", "Premium 3D tilt hover effect.", "card-tilt", `.card-tilt:hover { transform: perspective(600px) rotateX(12deg) rotateY(-16deg); }`);
    addEffect("3D Push Card", "Card moves forward in 3D.", "card-3d-push", `.card-3d-push:hover { transform: perspective(700px) translateZ(80px); }`);
    addEffect("Perspective Lean Card", "Card leans backward in perspective.", "card-perspective-lean", `.card-perspective-lean { transform-origin: bottom; } .card-perspective-lean:hover { transform: perspective(700px) rotateX(35deg); }`);
    addEffect("Skew Card", "Card skews and scales.", "card-skew", `.card-skew:hover { transform: skewX(-9deg) scale(1.06); background: rgba(79,140,255,.25); }`);
    addEffect("Stretch Card", "Card stretches horizontally.", "card-stretch", `.card-stretch:hover { transform: scaleX(1.24); background: rgba(79,140,255,.22); }`);
    addEffect("Squeeze Card", "Card squeezes horizontally.", "card-squeeze", `.card-squeeze:hover { transform: scaleX(.72); background: rgba(141,107,255,.22); }`);
    addEffect("Rounded Morph Card", "Card radius morphs on hover.", "card-rounded-morph", `.card-rounded-morph:hover { border-radius: 38px 14px 38px 14px; background: rgba(79,140,255,.22); }`);
    addEffect("Circle Morph Card", "Card morphs into circle shape.", "card-circle-morph", `.card-circle-morph:hover { width: 90px; border-radius: 50%; background: rgba(79,140,255,.52); }`);
    addEffect("Glass Card", "Card becomes frosted glass.", "card-glass", `.card-glass:hover { background: rgba(255,255,255,.18); backdrop-filter: blur(18px); box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 24px 46px rgba(0,0,0,.38); }`);
    addEffect("Blur Card", "Card blurs on hover.", "card-blur", `.card-blur:hover { filter: blur(2px); transform: scale(1.05); }`);

    addEffect("Focus Card", "Blurred card sharpens on hover.", "card-focus", `.card-focus { filter: blur(3px); opacity:.55; } .card-focus:hover { filter: blur(0); opacity:1; transform:scale(1.08); }`);
    addEffect("Brightness Card", "Brightness increases on hover.", "card-brightness", `.card-brightness:hover { filter: brightness(1.55); }`);
    addEffect("Contrast Card", "Contrast increases on hover.", "card-contrast", `.card-contrast:hover { filter: contrast(1.7) brightness(1.1); }`);
    addEffect("Saturate Card", "Card becomes more colorful.", "card-saturate", `.card-saturate:hover { filter: saturate(2); background: linear-gradient(135deg,#4f8cff,#8d6bff); }`);
    addEffect("Shine Card", "White shine sweep passes over card.", "card-shine", `.card-shine::after { content:""; position:absolute; top:-60%; left:-45%; width:35%; height:220%; background:rgba(255,255,255,.55); transform:rotate(25deg); transition:.35s ease; z-index:4; } .card-shine:hover::after { left:130%; }`);
    addEffect("Auto Shine Card", "Continuous shine while hovered.", "card-auto-shine", `.card-auto-shine:hover::after { content:""; position:absolute; top:-60%; width:35%; height:220%; background:rgba(255,255,255,.55); transform:rotate(25deg); animation:cardShineMove 1.1s linear infinite; z-index:4; }`);
    addEffect("Spotlight Card", "Spotlight moves across card.", "card-spotlight", `.card-spotlight::before { content:""; position:absolute; inset:-50%; background:radial-gradient(circle,rgba(255,255,255,.35),transparent 35%); transform:translate(-45%,-45%); transition:.35s ease; z-index:1; } .card-spotlight:hover::before { transform:translate(25%,20%); }`);
    addEffect("Scanline Card", "Scan line moves vertically.", "card-scanline", `.card-scanline::after { content:""; position:absolute; left:0; right:0; height:3px; background:#4f8cff; box-shadow:0 0 18px rgba(79,140,255,.9); opacity:0; z-index:4; } .card-scanline:hover::after { opacity:1; animation:cardScan 1s ease-in-out infinite; }`);
    addEffect("Ripple Card", "Ripple expands from center.", "card-ripple", `.card-ripple::after { content:""; position:absolute; width:22px; height:22px; border-radius:50%; background:rgba(79,140,255,.55); transform:scale(0); opacity:1; transition:.45s ease; z-index:1; } .card-ripple:hover::after { transform:scale(9); opacity:0; }`);
    addEffect("Circle Reveal Card", "Circle expands behind card text.", "card-circle-reveal", `.card-circle-reveal::before { content:""; position:absolute; width:22px; height:22px; border-radius:50%; background:#4f8cff; transform:scale(0); transition:.38s ease; z-index:1; } .card-circle-reveal:hover::before { transform:scale(9); }`);

    addEffect("Fill Left Card", "Card fills from left side.", "card-fill-left", `.card-fill-left::before { content:""; position:absolute; inset:0; background:#4f8cff; transform:scaleX(0); transform-origin:left; transition:.35s ease; z-index:1; } .card-fill-left:hover::before { transform:scaleX(1); }`);
    addEffect("Fill Right Card", "Card fills from right side.", "card-fill-right", `.card-fill-right::before { content:""; position:absolute; inset:0; background:#4f8cff; transform:scaleX(0); transform-origin:right; transition:.35s ease; z-index:1; } .card-fill-right:hover::before { transform:scaleX(1); }`);

    const grid = document.getElementById("grid");
    const searchInput = document.getElementById("searchInput");
    const countPill = document.getElementById("countPill");
    const emptyState = document.getElementById("emptyState");
    const loadStatus = document.getElementById("loadStatus");
    const dynamicEffectStyles = document.getElementById("dynamicEffectStyles");

    const batchSize = 20;
    let visibleCount = batchSize;
    let filteredEffects = [...effects];
    let isLoadingMore = false;

    dynamicEffectStyles.textContent = commonKeyframes + "\n\n" + effects.map(effect => effect.css).join("\n\n");

    function copyIcon() {
      return `
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <rect x="9" y="9" width="10" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
          <rect x="5" y="5" width="10" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
        </svg>
      `;
    }

    function renderCards() {
      grid.innerHTML = "";

      const visibleEffects = filteredEffects.slice(0, visibleCount);

      visibleEffects.forEach(effect => {
        const card = document.createElement("div");
        card.className = "card";
        card.dataset.search = `${effect.name} ${effect.about} ${effect.className}`.toLowerCase();

        card.innerHTML = `
          <div class="preview">${effect.html}</div>
          <div class="card-body">
            <div class="name-row">
              <h3>${effect.name}</h3>
              <button class="copy-btn" data-id="${effect.id}" title="Copy code">
                ${copyIcon()}
              </button>
            </div>
            <p>${effect.about}</p>
          </div>
        `;

        grid.appendChild(card);
      });

      document.querySelectorAll(".copy-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          copyCode(btn.dataset.id);
        });
      });

      emptyState.style.display = filteredEffects.length ? "none" : "block";
      countPill.textContent = filteredEffects.length + " Effects";

      const shown = Math.min(visibleCount, filteredEffects.length);
      loadStatus.textContent = `Showing ${shown} of ${filteredEffects.length} effects`;

      if (filteredEffects.length === 0) {
        loadStatus.style.display = "none";
      } else {
        loadStatus.style.display = "block";
      }
    }

    function copyCode(id) {
      const effect = effects.find(item => item.id === id);

      if (!effect) {
        showToast("Code not found");
        return;
      }

      const code = `${effect.html}

<style>
${baseCardCSS}

${commonKeyframes}

${effect.css}
</style>`;

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(code).then(() => {
          showToast("Code copied");
        }).catch(() => {
          fallbackCopy(code);
        });
      } else {
        fallbackCopy(code);
      }
    }

    function fallbackCopy(text) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      textarea.style.top = "-9999px";
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();

      try {
        document.execCommand("copy");
        showToast("Code copied");
      } catch (err) {
        showToast("Copy failed");
      }

      document.body.removeChild(textarea);
    }

    function showToast(message) {
      const oldToast = document.querySelector(".toast");
      if (oldToast) oldToast.remove();

      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = message;
      document.body.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.add("show");
      });

      setTimeout(() => {
        toast.classList.remove("show");
        setTimeout(() => toast.remove(), 250);
      }, 1500);
    }

    function applySearch() {
      const value = searchInput.value.trim().toLowerCase();

      filteredEffects = effects.filter(effect => {
        return (
          effect.name.toLowerCase().includes(value) ||
          effect.about.toLowerCase().includes(value) ||
          effect.className.toLowerCase().includes(value)
        );
      });

      visibleCount = batchSize;
      renderCards();
    }

    function loadMoreOnScroll() {
      if (isLoadingMore) return;
      if (visibleCount >= filteredEffects.length) return;

      const nearBottom = window.innerHeight + window.scrollY >= document.body.offsetHeight - 450;

      if (nearBottom) {
        isLoadingMore = true;

        setTimeout(() => {
          visibleCount += batchSize;
          renderCards();
          isLoadingMore = false;
        }, 180);
      }
    }

    searchInput.addEventListener("input", applySearch);
    window.addEventListener("scroll", loadMoreOnScroll);

    renderCards();
  </script>
</body>
</html>
