<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hover Effects</title>

  <style>
    :root {
      --bg: #000;
      --border: rgba(255,255,255,0.14);
      --text: #fff;
      --muted: rgba(255,255,255,0.58);
      --blue: #4f8cff;
      --purple: #8d6bff;
      --green: #35c759;
      --red: #ff5f57;
      --yellow: #ffbd2e;
      --orange: #ff9f0a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,0.15), transparent 24%),
        radial-gradient(circle at 18% 28%, rgba(79,140,255,0.11), transparent 28%),
        linear-gradient(180deg, #000, #050505 55%, #090909);
      color: var(--text);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.024) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.024) 1px, transparent 1px);
      background-size: 70px 70px;
      mask-image: radial-gradient(circle at center, black, transparent 75%);
      z-index: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(100%, 1560px);
      margin: 0 auto;
      padding: 22px;
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 16px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px;
      border-radius: 24px;
      background: rgba(20,20,20,0.78);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(26px);
      box-shadow: 0 20px 70px rgba(0,0,0,0.46);
      margin-bottom: 30px;
    }

    .search-box {
      width: 280px;
      height: 46px;
      border-radius: 16px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.12);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      flex: 0 0 auto;
    }

    .search-box svg {
      color: rgba(255,255,255,0.58);
      flex: 0 0 auto;
    }

    .search-box input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font-size: 14px;
      font-weight: 750;
    }

    .search-box input::placeholder {
      color: rgba(255,255,255,0.45);
    }

    .menu {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      flex: 1;
    }

    .menu::-webkit-scrollbar {
      display: none;
    }

    .menu a {
      height: 46px;
      padding: 0 16px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.68);
      font-size: 14px;
      font-weight: 850;
      border: 1px solid transparent;
      white-space: nowrap;
      transition: 180ms ease;
    }

    .menu a:hover,
    .menu a.active {
      background: rgba(255,255,255,0.11);
      border-color: rgba(255,255,255,0.12);
      color: white;
    }

    .menu a.active {
      background: rgba(79,140,255,0.22);
      border-color: rgba(79,140,255,0.38);
    }

    .content-header {
      margin-bottom: 24px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
    }

    .title-block h1 {
      font-size: clamp(34px, 4.8vw, 64px);
      line-height: 0.95;
      letter-spacing: -0.065em;
      font-weight: 950;
      margin-bottom: 10px;
    }

    .title-block p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
      font-weight: 650;
      max-width: 760px;
    }

    .count-pill {
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.74);
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
      padding-bottom: 35px;
    }

    .card {
      min-height: 238px;
      border-radius: 24px;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,0.12), transparent 50%),
        linear-gradient(180deg, rgba(255,255,255,0.09), rgba(255,255,255,0.04));
      border: 1px solid var(--border);
      overflow: hidden;
      transition: 220ms ease;
      box-shadow: 0 18px 50px rgba(0,0,0,0.25);
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(255,255,255,0.24);
      box-shadow: 0 28px 80px rgba(0,0,0,0.44);
    }

    .preview {
      height: 138px;
      display: grid;
      place-items: center;
      padding: 18px;
      border-bottom: 1px solid rgba(255,255,255,0.09);
      background: rgba(0,0,0,0.20);
      overflow: hidden;
      position: relative;
      perspective: 900px;
    }

    .hover-box {
      width: 124px;
      height: 82px;
      border-radius: 20px;
      background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.07));
      border: 1px solid rgba(255,255,255,.16);
      color: white;
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 900;
      position: relative;
      overflow: hidden;
      transition: 260ms ease;
      isolation: isolate;
      box-shadow: 0 14px 34px rgba(0,0,0,.28);
    }

    .hover-box span {
      position: relative;
      z-index: 5;
    }

    .hover-link {
      position: relative;
      display: inline-block;
      color: white;
      font-size: 24px;
      line-height: 1;
      letter-spacing: -0.055em;
      font-weight: 950;
      transition: 240ms ease;
      padding: 8px 4px;
    }

    .hover-image {
      width: 124px;
      height: 82px;
      border-radius: 20px;
      background:
        radial-gradient(circle at 30% 20%, rgba(255,255,255,.45), transparent 24%),
        linear-gradient(135deg, rgba(79,140,255,.95), rgba(141,107,255,.95));
      color: white;
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 900;
      position: relative;
      overflow: hidden;
      transition: 260ms ease;
      box-shadow: 0 14px 34px rgba(0,0,0,.28);
    }

    .card-body {
      padding: 15px;
    }

    .name-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .name-row h3 {
      font-size: 16px;
      line-height: 1.12;
      letter-spacing: -0.03em;
      font-weight: 900;
    }

    .copy-btn {
      width: 36px;
      height: 36px;
      border-radius: 13px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.085);
      color: white;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex: 0 0 auto;
      transition: 180ms ease;
    }

    .copy-btn:hover {
      background: rgba(79,140,255,0.95);
      border-color: rgba(79,140,255,0.95);
      transform: translateY(-2px);
    }

    .card-body p {
      color: rgba(255,255,255,0.55);
      font-size: 12.5px;
      line-height: 1.45;
      font-weight: 650;
    }

    .empty {
      padding: 24px;
      border-radius: 22px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.72);
      text-align: center;
      font-weight: 750;
      margin-bottom: 20px;
      display: none;
    }

    .load-status {
      margin: 0 auto 70px;
      width: fit-content;
      padding: 12px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.65);
      font-size: 12px;
      font-weight: 850;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%) translateY(18px);
      padding: 13px 18px;
      border-radius: 16px;
      background: rgba(255,255,255,0.93);
      color: #111;
      font-size: 13px;
      font-weight: 850;
      box-shadow: 0 18px 60px rgba(0,0,0,0.45);
      opacity: 0;
      pointer-events: none;
      transition: 220ms ease;
      z-index: 9999;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 1280px) {
      .grid { grid-template-columns: repeat(4, 1fr); }
    }

    @media (max-width: 1100px) {
      .grid { grid-template-columns: repeat(3, 1fr); }
      .topbar { align-items: flex-start; flex-direction: column; }
      .search-box { width: 100%; }
      .menu { width: 100%; }
    }

    @media (max-width: 760px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
      .content-header { display: block; }
      .count-pill { display: inline-block; margin-top: 12px; }
    }

    @media (max-width: 520px) {
      .page { padding: 12px; }
      .topbar { top: 10px; border-radius: 20px; }
      .menu a { height: 42px; padding: 0 13px; font-size: 13px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <div class="page">
    <header class="topbar">
      <div class="search-box">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2.2"/>
          <path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <input id="searchInput" type="text" placeholder="Search effect..." />
      </div>

      <nav class="menu" id="mainMenu"></nav>
    </header>

    <main>
      <header class="content-header">
        <div class="title-block">
          <h1>Hover Effects</h1>
          <p>100 live hover effects. First 20 effects load initially, then next 20 effects load automatically while scrolling.</p>
        </div>

        <div class="count-pill" id="countPill">0 Effects</div>
      </header>

      <div id="emptyState" class="empty">
        No effect found. Try searching “glow”, “image”, “underline”, “shine”, “tilt”, “overlay”, or “3D”.
      </div>

      <section id="grid" class="grid"></section>

      <div id="loadStatus" class="load-status">Showing 0 of 100 effects</div>
    </main>
  </div>

  <style id="dynamicEffectStyles"></style>

  <script src="nav.js"></script>

  <script>
    const effects = [];

    const baseBoxCSS = `.hover-box {
  width: 124px;
  height: 82px;
  border-radius: 20px;
  background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.07));
  border: 1px solid rgba(255,255,255,.16);
  color: white;
  display: grid;
  place-items: center;
  font-size: 14px;
  font-weight: 900;
  position: relative;
  overflow: hidden;
  transition: 260ms ease;
  isolation: isolate;
  box-shadow: 0 14px 34px rgba(0,0,0,.28);
}
.hover-box span {
  position: relative;
  z-index: 5;
}`;

    const baseImageCSS = `.hover-image {
  width: 124px;
  height: 82px;
  border-radius: 20px;
  background:
    radial-gradient(circle at 30% 20%, rgba(255,255,255,.45), transparent 24%),
    linear-gradient(135deg, rgba(79,140,255,.95), rgba(141,107,255,.95));
  color: white;
  display: grid;
  place-items: center;
  font-size: 14px;
  font-weight: 900;
  position: relative;
  overflow: hidden;
  transition: 260ms ease;
}`;

    const baseLinkCSS = `.hover-link {
  position: relative;
  display: inline-block;
  color: white;
  font-size: 24px;
  line-height: 1;
  letter-spacing: -0.055em;
  font-weight: 950;
  transition: 240ms ease;
  padding: 8px 4px;
}`;

    function addEffect(name, about, type, className, css, html) {
      let baseClass = type === "link" ? "hover-link" : type === "image" ? "hover-image" : "hover-box";
      effects.push({
        id: String(effects.length),
        name,
        about,
        type,
        className,
        html: html || `<div class="${baseClass} ${className}"><span>${type === "link" ? "Text" : "Hover"}</span></div>`,
        css
      });
    }

    addEffect("Lift Hover", "Element lifts upward with soft shadow.", "box", "hover-lift", `.hover-lift:hover { transform: translateY(-12px); box-shadow: 0 25px 55px rgba(0,0,0,.48); }`);

    addEffect("Scale Hover", "Element grows smoothly on hover.", "box", "hover-scale", `.hover-scale:hover { transform: scale(1.14); background: rgba(79,140,255,.75); }`);

    addEffect("Small Scale Hover", "Subtle premium scale hover.", "box", "hover-small-scale", `.hover-small-scale:hover { transform: scale(1.045); background: rgba(255,255,255,.16); }`);

    addEffect("Shrink Hover", "Element shrinks slightly on hover.", "box", "hover-shrink", `.hover-shrink:hover { transform: scale(.88); background: rgba(79,140,255,.35); }`);

    addEffect("Press Hover", "Element looks pressed inward.", "box", "hover-press", `.hover-press:hover { transform: translateY(5px) scale(.96); box-shadow: inset 0 8px 18px rgba(0,0,0,.35); }`);

    addEffect("Push Down Hover", "Physical push-down effect.", "box", "hover-push-down", `.hover-push-down { box-shadow: 0 9px 0 rgba(255,255,255,.08); } .hover-push-down:hover { transform: translateY(9px); box-shadow: 0 0 0 rgba(255,255,255,0); }`);

    addEffect("Glow Hover", "Blue glow appears around element.", "box", "hover-glow", `.hover-glow:hover { border-color: rgba(79,140,255,.95); box-shadow: 0 0 36px rgba(79,140,255,.7); }`);

    addEffect("Soft Glow Hover", "Soft white glow appears on hover.", "box", "hover-soft-glow", `.hover-soft-glow:hover { box-shadow: 0 0 28px rgba(255,255,255,.35); border-color: rgba(255,255,255,.35); }`);

    addEffect("Red Glow Hover", "Red glow for warning elements.", "box", "hover-red-glow", `.hover-red-glow:hover { border-color: rgba(255,95,87,.8); box-shadow: 0 0 32px rgba(255,95,87,.65); background: rgba(255,95,87,.18); }`);

    addEffect("Green Glow Hover", "Green success glow hover.", "box", "hover-green-glow", `.hover-green-glow:hover { border-color: rgba(53,199,89,.8); box-shadow: 0 0 32px rgba(53,199,89,.65); background: rgba(53,199,89,.18); }`);

    addEffect("Gold Glow Hover", "Gold premium glow hover.", "box", "hover-gold-glow", `.hover-gold-glow:hover { border-color: rgba(255,189,46,.8); box-shadow: 0 0 32px rgba(255,189,46,.65); background: rgba(255,189,46,.16); }`);

    addEffect("Border Glow Hover", "Inner and outer border glow.", "box", "hover-border-glow", `.hover-border-glow:hover { border-color: rgba(79,140,255,1); box-shadow: inset 0 0 0 1px rgba(79,140,255,.55), 0 0 28px rgba(79,140,255,.52); }`);

    addEffect("Inset Glow Hover", "Glow appears inside element.", "box", "hover-inset-glow", `.hover-inset-glow:hover { box-shadow: inset 0 0 24px rgba(79,140,255,.55), 0 0 18px rgba(79,140,255,.25); border-color: rgba(79,140,255,.7); }`);

    addEffect("Shadow Expand Hover", "Shadow expands with depth.", "box", "hover-shadow-expand", `.hover-shadow-expand:hover { transform: translateY(-7px); box-shadow: 0 18px 0 rgba(255,255,255,.07), 0 35px 70px rgba(0,0,0,.48); }`);

    addEffect("Layered Shadow Hover", "Multiple stacked shadows on hover.", "box", "hover-layered-shadow", `.hover-layered-shadow { box-shadow: 8px 8px 0 rgba(255,255,255,.06), 16px 16px 0 rgba(255,255,255,.03); } .hover-layered-shadow:hover { transform: translate(-6px,-6px); box-shadow: 14px 14px 0 rgba(79,140,255,.16), 28px 28px 0 rgba(79,140,255,.07); }`);

    addEffect("Rotate Hover", "Element rotates slightly on hover.", "box", "hover-rotate", `.hover-rotate:hover { transform: rotate(-5deg) scale(1.06); background: rgba(79,140,255,.7); }`);

    addEffect("Rotate Right Hover", "Element rotates right on hover.", "box", "hover-rotate-right", `.hover-rotate-right:hover { transform: rotate(6deg) scale(1.06); background: rgba(141,107,255,.6); }`);

    addEffect("Spin Hover", "Element spins on hover.", "box", "hover-spin", `.hover-spin:hover { transform: rotate(360deg); background: rgba(79,140,255,.7); }`);

    addEffect("Flip X Hover", "Element flips vertically.", "box", "hover-flip-x", `.hover-flip-x:hover { transform: rotateX(180deg); }`);

    addEffect("Flip Y Hover", "Element flips horizontally.", "box", "hover-flip-y", `.hover-flip-y:hover { transform: rotateY(180deg); }`);

    addEffect("3D Tilt Hover", "3D perspective tilt effect.", "box", "hover-tilt", `.hover-tilt:hover { transform: perspective(600px) rotateX(12deg) rotateY(-16deg); }`);

    addEffect("3D Push Hover", "Element moves forward in 3D.", "box", "hover-3d-push", `.hover-3d-push:hover { transform: perspective(700px) translateZ(80px); }`);

    addEffect("Perspective Lean Hover", "Element leans in perspective.", "box", "hover-perspective-lean", `.hover-perspective-lean:hover { transform: perspective(700px) rotateX(35deg); transform-origin: bottom; }`);

    addEffect("Skew Hover", "Element skews and scales.", "box", "hover-skew", `.hover-skew:hover { transform: skewX(-9deg) scale(1.06); background: rgba(79,140,255,.75); }`);

    addEffect("Stretch Hover", "Element stretches horizontally.", "box", "hover-stretch", `.hover-stretch:hover { transform: scaleX(1.25); background: rgba(79,140,255,.45); }`);

    addEffect("Squeeze Hover", "Element squeezes horizontally.", "box", "hover-squeeze", `.hover-squeeze:hover { transform: scaleX(.72); background: rgba(141,107,255,.45); }`);

    addEffect("Rounded Morph Hover", "Border radius morphs on hover.", "box", "hover-rounded-morph", `.hover-rounded-morph:hover { border-radius: 36px 12px 36px 12px; background: rgba(79,140,255,.28); }`);

    addEffect("Circle Morph Hover", "Shape morphs into circle.", "box", "hover-circle-morph", `.hover-circle-morph:hover { width: 82px; border-radius: 50%; background: rgba(79,140,255,.65); }`);

    addEffect("Glass Hover", "Element turns into frosted glass.", "box", "hover-glass", `.hover-glass:hover { background: rgba(255,255,255,.18); backdrop-filter: blur(18px); box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 24px 46px rgba(0,0,0,.38); }`);

    addEffect("Blur Hover", "Element becomes blurred on hover.", "box", "hover-blur", `.hover-blur:hover { filter: blur(2px); transform: scale(1.05); }`);

    addEffect("Focus Hover", "Blurred element becomes sharp.", "box", "hover-focus", `.hover-focus { filter: blur(3px); opacity: .55; } .hover-focus:hover { filter: blur(0); opacity: 1; transform: scale(1.08); }`);

    addEffect("Brightness Hover", "Element brightness increases.", "box", "hover-brightness", `.hover-brightness:hover { filter: brightness(1.5); }`);

    addEffect("Contrast Hover", "Element contrast increases.", "box", "hover-contrast", `.hover-contrast:hover { filter: contrast(1.7) brightness(1.1); }`);

    addEffect("Saturate Hover", "Element becomes more colorful.", "box", "hover-saturate", `.hover-saturate:hover { filter: saturate(2); background: linear-gradient(135deg, #4f8cff, #8d6bff); }`);

    addEffect("Grayscale Hover", "Element changes from grayscale to color.", "image", "hover-grayscale", `.hover-grayscale { filter: grayscale(1); } .hover-grayscale:hover { filter: grayscale(0); transform: scale(1.08); }`);

    addEffect("Image Zoom Hover", "Image zooms inside frame.", "image", "hover-image-zoom", `.hover-image-zoom:hover { transform: scale(1.16); }`);

    addEffect("Image Zoom Out Hover", "Image zooms out on hover.", "image", "hover-image-zoom-out", `.hover-image-zoom-out { transform: scale(1.12); } .hover-image-zoom-out:hover { transform: scale(1); }`);

    addEffect("Image Pan Right Hover", "Image background pans right.", "image", "hover-image-pan-right", `.hover-image-pan-right { background-size: 150%; background-position: left center; } .hover-image-pan-right:hover { background-position: right center; }`);

    addEffect("Image Pan Left Hover", "Image background pans left.", "image", "hover-image-pan-left", `.hover-image-pan-left { background-size: 150%; background-position: right center; } .hover-image-pan-left:hover { background-position: left center; }`);

    addEffect("Image Rotate Hover", "Image rotates and zooms.", "image", "hover-image-rotate", `.hover-image-rotate:hover { transform: rotate(-5deg) scale(1.12); }`);

    addEffect("Image Blur Reveal Hover", "Image blur clears on hover.", "image", "hover-image-blur-reveal", `.hover-image-blur-reveal { filter: blur(4px); } .hover-image-blur-reveal:hover { filter: blur(0); transform: scale(1.07); }`);

    addEffect("Overlay Slide Up Hover", "Overlay slides up from bottom.", "image", "hover-overlay-up", `.hover-overlay-up::after { content: "View"; position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.58); transform: translateY(100%); transition: .28s ease; } .hover-overlay-up:hover::after { transform: translateY(0); }`);

    addEffect("Overlay Slide Down Hover", "Overlay slides down from top.", "image", "hover-overlay-down", `.hover-overlay-down::after { content: "View"; position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.58); transform: translateY(-100%); transition: .28s ease; } .hover-overlay-down:hover::after { transform: translateY(0); }`);

    addEffect("Overlay Fade Hover", "Overlay fades in smoothly.", "image", "hover-overlay-fade", `.hover-overlay-fade::after { content: "View"; position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.58); opacity: 0; transition: .28s ease; } .hover-overlay-fade:hover::after { opacity: 1; }`);

    addEffect("Overlay Zoom Hover", "Overlay zooms in on hover.", "image", "hover-overlay-zoom", `.hover-overlay-zoom::after { content: "View"; position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.58); opacity: 0; transform: scale(.6); transition: .28s ease; } .hover-overlay-zoom:hover::after { opacity: 1; transform: scale(1); }`);

    addEffect("Cyber Hover", "Cyberpunk glitch hover.", "box", "hover-cyber", `.hover-cyber:hover { text-shadow: 2px 0 #ff5f57, -2px 0 #4f8cff; animation: hoverCyber .7s steps(2) infinite; } @keyframes hoverCyber { 0%,100%{transform:translate(0);} 30%{transform:translate(-2px,1px);} 60%{transform:translate(2px,-1px);} }`);

    addEffect("Outline Hover", "Element becomes outline style.", "box", "hover-outline", `.hover-outline:hover { background: transparent; border-color: rgba(255,255,255,.65); box-shadow: inset 0 0 0 2px rgba(255,255,255,.15); }`);

    addEffect("Stroke Fill Hover", "Outline fills with color.", "box", "hover-stroke-fill", `.hover-stroke-fill { background: transparent; border-color: rgba(79,140,255,.55); } .hover-stroke-fill:hover { background: rgba(79,140,255,.35); }`);

    addEffect("Minimal Hover", "Very minimal background hover.", "box", "hover-minimal", `.hover-minimal { background: transparent; border-color: transparent; box-shadow: none; } .hover-minimal:hover { background: rgba(255,255,255,.1); transform: translateY(-3px); }`);

    addEffect("Apple Smooth Hover", "Soft Apple-like hover movement.", "box", "hover-apple-smooth", `.hover-apple-smooth:hover { transform: translateY(-7px) scale(1.035); box-shadow: 0 24px 50px rgba(0,0,0,.38); }`);

    addEffect("Cinematic Hover", "Cinematic scale and blur hover.", "box", "hover-cinematic", `.hover-cinematic:hover { transform: scale(1.08); filter: contrast(1.12) brightness(1.15); box-shadow: 0 32px 80px rgba(0,0,0,.48); }`);

    addEffect("Final Premium Hover", "Premium gradient, shine, and glow hover.", "box", "hover-final-premium", `.hover-final-premium:hover { background: linear-gradient(90deg, #4f8cff, #8d6bff, #4f8cff); background-size: 240%; border-color: transparent; box-shadow: 0 0 30px rgba(79,140,255,.65); animation: hoverFinalGradient 1.4s ease-in-out infinite; } .hover-final-premium:hover::after { content: ""; position: absolute; top: -60%; left: -45%; width: 32%; height: 220%; background: rgba(255,255,255,.55); transform: rotate(25deg); animation: hoverFinalShine 1.3s linear infinite; z-index: 4; } @keyframes hoverFinalGradient { 0%,100%{background-position:0% center;} 50%{background-position:100% center;} } @keyframes hoverFinalShine { to { left: 130%; } }`);

    const grid = document.getElementById("grid");
    const searchInput = document.getElementById("searchInput");
    const countPill = document.getElementById("countPill");
    const emptyState = document.getElementById("emptyState");
    const loadStatus = document.getElementById("loadStatus");
    const dynamicEffectStyles = document.getElementById("dynamicEffectStyles");

    const batchSize = 20;
    let visibleCount = batchSize;
    let filteredEffects = [...effects];
    let isLoadingMore = false;

    dynamicEffectStyles.textContent = effects.map(effect => effect.css).join("\n\n");

    function copyIcon() {
      return `
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <rect x="9" y="9" width="10" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
          <rect x="5" y="5" width="10" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
        </svg>
      `;
    }

    function renderCards() {
      grid.innerHTML = "";

      const visibleEffects = filteredEffects.slice(0, visibleCount);

      visibleEffects.forEach(effect => {
        const card = document.createElement("div");
        card.className = "card";
        card.dataset.search = `${effect.name} ${effect.about} ${effect.className} ${effect.type}`.toLowerCase();

        card.innerHTML = `
          <div class="preview">${effect.html}</div>
          <div class="card-body">
            <div class="name-row">
              <h3>${effect.name}</h3>
              <button class="copy-btn" data-id="${effect.id}" title="Copy code">
                ${copyIcon()}
              </button>
            </div>
            <p>${effect.about}</p>
          </div>
        `;

        grid.appendChild(card);
      });

      document.querySelectorAll(".copy-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          copyCode(btn.dataset.id);
        });
      });

      emptyState.style.display = filteredEffects.length ? "none" : "block";
      countPill.textContent = filteredEffects.length + " Effects";

      const shown = Math.min(visibleCount, filteredEffects.length);
      loadStatus.textContent = `Showing ${shown} of ${filteredEffects.length} effects`;

      if (filteredEffects.length === 0) {
        loadStatus.style.display = "none";
      } else {
        loadStatus.style.display = "block";
      }
    }

    function baseCSSFor(type) {
      if (type === "link") return baseLinkCSS;
      if (type === "image") return baseImageCSS;
      return baseBoxCSS;
    }

    function copyCode(id) {
      const effect = effects.find(item => item.id === id);

      if (!effect) {
        showToast("Code not found");
        return;
      }

      const code = `${effect.html}

<style>
${baseCSSFor(effect.type)}

${effect.css}
</style>`;

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(code).then(() => {
          showToast("Code copied");
        }).catch(() => {
          fallbackCopy(code);
        });
      } else {
        fallbackCopy(code);
      }
    }

    function fallbackCopy(text) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      textarea.style.top = "-9999px";
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();

      try {
        document.execCommand("copy");
        showToast("Code copied");
      } catch (err) {
        showToast("Copy failed");
      }

      document.body.removeChild(textarea);
    }

    function showToast(message) {
      const oldToast = document.querySelector(".toast");
      if (oldToast) oldToast.remove();

      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = message;
      document.body.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.add("show");
      });

      setTimeout(() => {
        toast.classList.remove("show");
        setTimeout(() => toast.remove(), 250);
      }, 1500);
    }

    function applySearch() {
      const value = searchInput.value.trim().toLowerCase();

      filteredEffects = effects.filter(effect => {
        return (
          effect.name.toLowerCase().includes(value) ||
          effect.about.toLowerCase().includes(value) ||
          effect.className.toLowerCase().includes(value) ||
          effect.type.toLowerCase().includes(value)
        );
      });

      visibleCount = batchSize;
      renderCards();
    }

    function loadMoreOnScroll() {
      if (isLoadingMore) return;
      if (visibleCount >= filteredEffects.length) return;

      const nearBottom = window.innerHeight + window.scrollY >= document.body.offsetHeight - 450;

      if (nearBottom) {
        isLoadingMore = true;

        setTimeout(() => {
          visibleCount += batchSize;
          renderCards();
          isLoadingMore = false;
        }, 180);
      }
    }

    searchInput.addEventListener("input", applySearch);
    window.addEventListener("scroll", loadMoreOnScroll);

    renderCards();
  </script>
</body>
</html>
