<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Icon Effects</title>

  <style>
    :root {
      --bg: #000;
      --border: rgba(255,255,255,0.14);
      --text: #fff;
      --muted: rgba(255,255,255,0.58);
      --blue: #4f8cff;
      --purple: #8d6bff;
      --green: #35c759;
      --red: #ff5f57;
      --yellow: #ffbd2e;
      --orange: #ff9f0a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,0.15), transparent 24%),
        radial-gradient(circle at 18% 28%, rgba(79,140,255,0.11), transparent 28%),
        linear-gradient(180deg, #000, #050505 55%, #090909);
      color: var(--text);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.024) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.024) 1px, transparent 1px);
      background-size: 70px 70px;
      mask-image: radial-gradient(circle at center, black, transparent 75%);
      z-index: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(100%, 1560px);
      margin: 0 auto;
      padding: 22px;
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 16px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px;
      border-radius: 24px;
      background: rgba(20,20,20,0.78);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(26px);
      box-shadow: 0 20px 70px rgba(0,0,0,0.46);
      margin-bottom: 30px;
    }

    .search-box {
      width: 280px;
      height: 46px;
      border-radius: 16px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.12);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      flex: 0 0 auto;
    }

    .search-box svg {
      color: rgba(255,255,255,0.58);
      flex: 0 0 auto;
    }

    .search-box input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font-size: 14px;
      font-weight: 750;
    }

    .search-box input::placeholder {
      color: rgba(255,255,255,0.45);
    }

    .menu {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      flex: 1;
    }

    .menu::-webkit-scrollbar {
      display: none;
    }

    .menu a {
      height: 46px;
      padding: 0 16px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.68);
      font-size: 14px;
      font-weight: 850;
      border: 1px solid transparent;
      white-space: nowrap;
      transition: 180ms ease;
    }

    .menu a:hover,
    .menu a.active {
      background: rgba(255,255,255,0.11);
      border-color: rgba(255,255,255,0.12);
      color: white;
    }

    .menu a.active {
      background: rgba(79,140,255,0.22);
      border-color: rgba(79,140,255,0.38);
    }

    .content-header {
      margin-bottom: 24px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
    }

    .title-block h1 {
      font-size: clamp(34px, 4.8vw, 64px);
      line-height: 0.95;
      letter-spacing: -0.065em;
      font-weight: 950;
      margin-bottom: 10px;
    }

    .title-block p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
      font-weight: 650;
      max-width: 760px;
    }

    .count-pill {
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.74);
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
      padding-bottom: 35px;
    }

    .card {
      min-height: 238px;
      border-radius: 24px;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,0.12), transparent 50%),
        linear-gradient(180deg, rgba(255,255,255,0.09), rgba(255,255,255,0.04));
      border: 1px solid var(--border);
      overflow: hidden;
      transition: 220ms ease;
      box-shadow: 0 18px 50px rgba(0,0,0,0.25);
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(255,255,255,0.24);
      box-shadow: 0 28px 80px rgba(0,0,0,0.44);
    }

    .preview {
      height: 138px;
      display: grid;
      place-items: center;
      padding: 18px;
      border-bottom: 1px solid rgba(255,255,255,0.09);
      background: rgba(0,0,0,0.20);
      overflow: hidden;
      position: relative;
      perspective: 900px;
    }

    .icon-demo {
      position: relative;
      width: 68px;
      height: 68px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      font-size: 32px;
      color: white;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.16);
      box-shadow: 0 14px 34px rgba(0,0,0,.28);
      transition: 260ms ease;
      isolation: isolate;
      overflow: hidden;
      transform-style: preserve-3d;
    }

    .icon-demo span {
      position: relative;
      z-index: 5;
      display: grid;
      place-items: center;
      line-height: 1;
    }

    .card-body {
      padding: 15px;
    }

    .name-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .name-row h3 {
      font-size: 16px;
      line-height: 1.12;
      letter-spacing: -0.03em;
      font-weight: 900;
    }

    .copy-btn {
      width: 36px;
      height: 36px;
      border-radius: 13px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.085);
      color: white;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex: 0 0 auto;
      transition: 180ms ease;
    }

    .copy-btn:hover {
      background: rgba(79,140,255,0.95);
      border-color: rgba(79,140,255,0.95);
      transform: translateY(-2px);
    }

    .card-body p {
      color: rgba(255,255,255,0.55);
      font-size: 12.5px;
      line-height: 1.45;
      font-weight: 650;
    }

    .empty {
      padding: 24px;
      border-radius: 22px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.72);
      text-align: center;
      font-weight: 750;
      margin-bottom: 20px;
      display: none;
    }

    .load-status {
      margin: 0 auto 70px;
      width: fit-content;
      padding: 12px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.65);
      font-size: 12px;
      font-weight: 850;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%) translateY(18px);
      padding: 13px 18px;
      border-radius: 16px;
      background: rgba(255,255,255,0.93);
      color: #111;
      font-size: 13px;
      font-weight: 850;
      box-shadow: 0 18px 60px rgba(0,0,0,0.45);
      opacity: 0;
      pointer-events: none;
      transition: 220ms ease;
      z-index: 9999;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 1280px) {
      .grid { grid-template-columns: repeat(4, 1fr); }
    }

    @media (max-width: 1100px) {
      .grid { grid-template-columns: repeat(3, 1fr); }
      .topbar { align-items: flex-start; flex-direction: column; }
      .search-box { width: 100%; }
      .menu { width: 100%; }
    }

    @media (max-width: 760px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
      .content-header { display: block; }
      .count-pill { display: inline-block; margin-top: 12px; }
    }

    @media (max-width: 520px) {
      .page { padding: 12px; }
      .topbar { top: 10px; border-radius: 20px; }
      .menu a { height: 42px; padding: 0 13px; font-size: 13px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <div class="page">
    <header class="topbar">
      <div class="search-box">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2.2"/>
          <path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <input id="searchInput" type="text" placeholder="Search effect..." />
      </div>

      <nav class="menu" id="mainMenu"></nav>
    </header>

    <main>
      <header class="content-header">
        <div class="title-block">
          <h1>Icon Effects</h1>
          <p>100 live icon effects for like, share, save, bell, play, search, mic, settings, verified, premium, upload, download, and app actions.</p>
        </div>

        <div class="count-pill" id="countPill">0 Effects</div>
      </header>

      <div id="emptyState" class="empty">
        No effect found. Try searching “spin”, “glow”, “heart”, “bell”, “verified”, “upload”, “download”, or “premium”.
      </div>

      <section id="grid" class="grid"></section>

      <div id="loadStatus" class="load-status">Showing 0 of 100 effects</div>
    </main>
  </div>

  <style id="dynamicEffectStyles"></style>

  <script src="nav.js"></script>

  <script>
    const effects = [];

    const baseIconCSS = `.icon-demo {
  position: relative;
  width: 68px;
  height: 68px;
  border-radius: 22px;
  display: grid;
  place-items: center;
  font-size: 32px;
  color: white;
  background: rgba(255,255,255,0.10);
  border: 1px solid rgba(255,255,255,0.16);
  box-shadow: 0 14px 34px rgba(0,0,0,.28);
  transition: 260ms ease;
  isolation: isolate;
  overflow: hidden;
  transform-style: preserve-3d;
}
.icon-demo span {
  position: relative;
  z-index: 5;
  display: grid;
  place-items: center;
  line-height: 1;
}`;

    const commonKeyframes = `
@keyframes iconSpin { to { transform: rotate(360deg); } }
@keyframes iconReverseSpin { to { transform: rotate(-360deg); } }
@keyframes iconPulse { 0%,100%{transform:scale(1);opacity:.75;} 50%{transform:scale(1.18);opacity:1;} }
@keyframes iconPop { 0%,100%{transform:scale(1);} 50%{transform:scale(1.35);} }
@keyframes iconBounce { 0%,100%{transform:translateY(0);} 40%{transform:translateY(-12px);} 60%{transform:translateY(4px);} }
@keyframes iconFloat { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);} }
@keyframes iconShake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }
@keyframes iconSwing { 0%,100%{transform:rotate(0);} 25%{transform:rotate(10deg);} 75%{transform:rotate(-10deg);} }
@keyframes iconGlow { 0%,100%{box-shadow:0 0 0 rgba(79,140,255,0);} 50%{box-shadow:0 0 30px rgba(79,140,255,.72);} }
@keyframes iconRedGlow { 0%,100%{box-shadow:0 0 0 rgba(255,95,87,0);} 50%{box-shadow:0 0 30px rgba(255,95,87,.72);} }
@keyframes iconGreenGlow { 0%,100%{box-shadow:0 0 0 rgba(53,199,89,0);} 50%{box-shadow:0 0 30px rgba(53,199,89,.72);} }
@keyframes iconGoldGlow { 0%,100%{box-shadow:0 0 0 rgba(255,189,46,0);} 50%{box-shadow:0 0 30px rgba(255,189,46,.72);} }
@keyframes iconGradient { 0%,100%{background-position:0% center;} 50%{background-position:100% center;} }
@keyframes iconShine { 0%{left:-50%;} 55%,100%{left:130%;} }
@keyframes iconPing { 0%{box-shadow:0 0 0 0 rgba(79,140,255,.7);} 70%{box-shadow:0 0 0 20px rgba(79,140,255,0);} 100%{box-shadow:0 0 0 0 rgba(79,140,255,0);} }
@keyframes iconHeart { 0%,100%{transform:scale(1);} 35%{transform:scale(1.35);} 55%{transform:scale(.92);} 75%{transform:scale(1.18);} }
@keyframes iconBell { 0%,100%{transform:rotate(0);} 20%{transform:rotate(-13deg);} 40%{transform:rotate(13deg);} 60%{transform:rotate(-9deg);} 80%{transform:rotate(9deg);} }
@keyframes iconScan { 0%,100%{top:0;} 50%{top:calc(100% - 3px);} }
@keyframes iconJelly { 0%,100%{transform:scale(1);} 30%{transform:scale(1.18,.82);} 50%{transform:scale(.9,1.12);} 70%{transform:scale(1.05,.95);} }
@keyframes iconRubber { 0%,100%{transform:scale(1);} 35%{transform:scaleX(1.22) scaleY(.82);} 55%{transform:scaleX(.9) scaleY(1.12);} 75%{transform:scaleX(1.04) scaleY(.96);} }
`;

    function addEffect(name, about, className, css, icon) {
      effects.push({
        id: String(effects.length),
        name,
        about,
        className,
        html: `<div class="icon-demo ${className}"><span>${icon || "★"}</span></div>`,
        css
      });
    }

    addEffect("Spin Icon", "Icon rotates continuously.", "icon-spin", `.icon-spin span{animation:iconSpin 1.2s linear infinite;}`, "⚙");
    addEffect("Reverse Spin Icon", "Icon rotates in reverse direction.", "icon-reverse-spin", `.icon-reverse-spin span{animation:iconReverseSpin 1.2s linear infinite;}`, "↻");
    addEffect("Slow Spin Icon", "Slow premium rotating icon.", "icon-slow-spin", `.icon-slow-spin span{animation:iconSpin 3s linear infinite;}`, "◌");
    addEffect("Pulse Icon", "Icon softly scales up and down.", "icon-pulse", `.icon-pulse span{animation:iconPulse 1.4s ease-in-out infinite;}`, "●");
    addEffect("Pop Icon", "Icon pops like a reaction.", "icon-pop", `.icon-pop span{animation:iconPop 1.2s ease-in-out infinite;}`, "✦");
    addEffect("Bounce Icon", "Icon bounces vertically.", "icon-bounce", `.icon-bounce span{animation:iconBounce 1.4s ease-in-out infinite;}`, "↑");
    addEffect("Float Icon", "Icon floats smoothly.", "icon-float", `.icon-float span{animation:iconFloat 2.2s ease-in-out infinite;}`, "☁");
    addEffect("Shake Icon", "Icon shakes for alert state.", "icon-shake", `.icon-shake{background:rgba(255,95,87,.14);border-color:rgba(255,95,87,.45);} .icon-shake span{animation:iconShake .65s ease-in-out infinite;}`, "!");
    addEffect("Swing Icon", "Icon swings side to side.", "icon-swing", `.icon-swing span{transform-origin:top center;animation:iconSwing 1.4s ease-in-out infinite;}`, "🔔");
    addEffect("Jelly Icon", "Icon stretches like jelly.", "icon-jelly", `.icon-jelly span{animation:iconJelly 1.5s ease-in-out infinite;}`, "★");

    addEffect("Rubber Icon", "Icon gets rubber stretch motion.", "icon-rubber", `.icon-rubber span{animation:iconRubber 1.6s ease-in-out infinite;}`, "◆");
    addEffect("Glow Icon", "Icon container glows blue.", "icon-glow", `.icon-glow{border-color:rgba(79,140,255,.5);animation:iconGlow 1.7s ease-in-out infinite;} .icon-glow span{color:#dbe8ff;text-shadow:0 0 14px rgba(79,140,255,.8);}`, "✦");
    addEffect("Red Glow Icon", "Red glow icon for alerts.", "icon-red-glow", `.icon-red-glow{background:rgba(255,95,87,.14);border-color:rgba(255,95,87,.45);animation:iconRedGlow 1.6s ease-in-out infinite;} .icon-red-glow span{color:#ff5f57;}`, "●");
    addEffect("Green Glow Icon", "Green glow icon for success.", "icon-green-glow", `.icon-green-glow{background:rgba(53,199,89,.14);border-color:rgba(53,199,89,.45);animation:iconGreenGlow 1.6s ease-in-out infinite;} .icon-green-glow span{color:#35c759;}`, "✓");
    addEffect("Gold Glow Icon", "Premium gold glowing icon.", "icon-gold-glow", `.icon-gold-glow{background:rgba(255,189,46,.14);border-color:rgba(255,189,46,.45);animation:iconGoldGlow 1.6s ease-in-out infinite;} .icon-gold-glow span{color:#ffbd2e;}`, "♛");
    addEffect("Neon Icon", "Neon icon with bright text shadow.", "icon-neon", `.icon-neon{border-color:rgba(79,140,255,.85);box-shadow:0 0 18px rgba(79,140,255,.4),inset 0 0 14px rgba(79,140,255,.15);} .icon-neon span{text-shadow:0 0 18px rgba(255,255,255,.85);animation:iconPulse 1.5s infinite;}`, "⚡");
    addEffect("Soft Aura Icon", "Soft aura expands behind icon.", "icon-aura", `.icon-aura::before{content:"";position:absolute;inset:-18px;border-radius:inherit;background:radial-gradient(circle,rgba(79,140,255,.45),transparent 65%);animation:iconAura 1.8s ease-in-out infinite;z-index:1;} @keyframes iconAura{0%,100%{opacity:.2;transform:scale(.75);}50%{opacity:1;transform:scale(1.08);}}`, "✦");
    addEffect("Ping Icon", "Outer ping ring expands from icon.", "icon-ping", `.icon-ping{background:#4f8cff;animation:iconPing 1.3s ease-out infinite;}`, "●");
    addEffect("Border Glow Icon", "Icon border glows repeatedly.", "icon-border-glow", `.icon-border-glow{border-color:rgba(79,140,255,.55);animation:iconBorderGlow 1.6s ease-in-out infinite;} @keyframes iconBorderGlow{0%,100%{border-color:rgba(79,140,255,.25);}50%{border-color:#4f8cff;box-shadow:0 0 24px rgba(79,140,255,.55);}}`, "○");
    addEffect("Inset Glow Icon", "Icon glows from inside.", "icon-inset-glow", `.icon-inset-glow{animation:iconInset 1.6s ease-in-out infinite;} @keyframes iconInset{0%,100%{box-shadow:inset 0 0 0 rgba(79,140,255,0);}50%{box-shadow:inset 0 0 24px rgba(79,140,255,.5);}}`, "◆");

    addEffect("Heart Beat Icon", "Heart icon beats like a like button.", "icon-heart-beat", `.icon-heart-beat span{color:#ff5f57;animation:iconHeart 1.1s ease-in-out infinite;}`, "♥");
    addEffect("Like Pop Icon", "Like icon pops up strongly.", "icon-like-pop", `.icon-like-pop span{color:#ff5f57;animation:iconPop 1s ease-in-out infinite;}`, "❤");
    addEffect("Heart Glow Icon", "Heart has red glow and pulse.", "icon-heart-glow", `.icon-heart-glow{background:rgba(255,95,87,.14);border-color:rgba(255,95,87,.45);animation:iconRedGlow 1.4s infinite;} .icon-heart-glow span{color:#ff5f57;animation:iconHeart 1.2s infinite;}`, "♥");
    addEffect("Star Twinkle Icon", "Star twinkles with rotation.", "icon-star-twinkle", `.icon-star-twinkle span{color:#ffbd2e;animation:iconStar 1.2s ease-in-out infinite;} @keyframes iconStar{0%,100%{transform:scale(1) rotate(0);opacity:.7;}50%{transform:scale(1.35) rotate(90deg);opacity:1;}}`, "★");
    addEffect("Save Bounce Icon", "Save/bookmark icon bounces.", "icon-save-bounce", `.icon-save-bounce span{color:#4f8cff;animation:iconBounce 1.3s ease-in-out infinite;}`, "◆");
    addEffect("Share Fly Icon", "Share icon flies diagonally.", "icon-share-fly", `.icon-share-fly span{animation:iconShareFly 1.2s ease-in-out infinite;} @keyframes iconShareFly{0%,100%{transform:translate(0,0);}50%{transform:translate(10px,-10px);}}`, "↗");
    addEffect("Send Icon", "Send icon moves forward.", "icon-send", `.icon-send span{animation:iconSend 1.2s ease-in-out infinite;} @keyframes iconSend{0%,100%{transform:translate(0,0) rotate(0);}50%{transform:translate(12px,-8px) rotate(-10deg);}}`, "➤");
    addEffect("Comment Pop Icon", "Comment icon pops like chat message.", "icon-comment-pop", `.icon-comment-pop span{animation:iconPop 1.4s ease-in-out infinite;}`, "☰");
    addEffect("Notification Bell Icon", "Bell rings like notification.", "icon-bell-ring", `.icon-bell-ring span{transform-origin:top center;animation:iconBell 1.2s ease-in-out infinite;}`, "🔔");
    addEffect("Notification Badge Icon", "Icon has notification count badge.", "icon-notification-badge", `.icon-notification-badge::after{content:"9";position:absolute;right:-5px;top:-5px;width:24px;height:24px;border-radius:50%;background:#ff5f57;display:grid;place-items:center;font-size:12px;font-weight:950;animation:iconPop 1.2s infinite;z-index:7;}`, "✉");

    addEffect("Settings Gear Icon", "Settings gear rotates continuously.", "icon-gear", `.icon-gear span{animation:iconSpin 1.5s linear infinite;}`, "⚙");
    addEffect("Refresh Icon", "Refresh icon rotates and pulses.", "icon-refresh", `.icon-refresh span{animation:iconRefresh 1.4s ease-in-out infinite;} @keyframes iconRefresh{0%,100%{transform:rotate(0) scale(1);}50%{transform:rotate(180deg) scale(1.2);}}`, "⟳");
    addEffect("Sync Icon", "Sync icon spins smoothly.", "icon-sync", `.icon-sync span{animation:iconSpin 1s linear infinite;}`, "↻");
    addEffect("Search Icon", "Search icon expands on hover.", "icon-search", `.icon-search:hover{transform:scale(1.12);box-shadow:0 0 24px rgba(79,140,255,.45);} .icon-search:hover span{color:#4f8cff;}`, "⌕");
    addEffect("Mic Pulse Icon", "Mic recording pulse icon.", "icon-mic", `.icon-mic{background:rgba(255,95,87,.14);border-color:rgba(255,95,87,.45);animation:iconRedGlow 1.3s infinite;} .icon-mic span{color:#ff5f57;animation:iconPulse 1.1s infinite;}`, "●");
    addEffect("Camera Flash Icon", "Camera flash overlay effect.", "icon-camera-flash", `.icon-camera-flash::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.75);opacity:0;animation:iconCameraFlash 1.5s ease-in-out infinite;z-index:6;} @keyframes iconCameraFlash{0%,70%,100%{opacity:0;}75%{opacity:1;}}`, "▣");
    addEffect("Play Pulse Icon", "Play icon pulses for video UI.", "icon-play-pulse", `.icon-play-pulse span{animation:iconPulse 1.2s ease-in-out infinite;}`, "▶");
    addEffect("Pause Blink Icon", "Pause icon blinks softly.", "icon-pause-blink", `.icon-pause-blink span{animation:iconBlink 1.1s ease-in-out infinite;} @keyframes iconBlink{0%,100%{opacity:1;}50%{opacity:.35;}}`, "Ⅱ");

    const grid = document.getElementById("grid");
    const searchInput = document.getElementById("searchInput");
    const countPill = document.getElementById("countPill");
    const emptyState = document.getElementById("emptyState");
    const loadStatus = document.getElementById("loadStatus");
    const dynamicEffectStyles = document.getElementById("dynamicEffectStyles");

    const batchSize = 20;
    let visibleCount = batchSize;
    let filteredEffects = [...effects];
    let isLoadingMore = false;

    dynamicEffectStyles.textContent = commonKeyframes + "\n\n" + effects.map(effect => effect.css).join("\n\n");

    function copyIcon() {
      return `
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <rect x="9" y="9" width="10" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
          <rect x="5" y="5" width="10" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
        </svg>
      `;
    }

    function renderCards() {
      grid.innerHTML = "";

      const visibleEffects = filteredEffects.slice(0, visibleCount);

      visibleEffects.forEach(effect => {
        const card = document.createElement("div");
        card.className = "card";
        card.dataset.search = `${effect.name} ${effect.about} ${effect.className}`.toLowerCase();

        card.innerHTML = `
          <div class="preview">${effect.html}</div>
          <div class="card-body">
            <div class="name-row">
              <h3>${effect.name}</h3>
              <button class="copy-btn" data-id="${effect.id}" title="Copy code">
                ${copyIcon()}
              </button>
            </div>
            <p>${effect.about}</p>
          </div>
        `;

        grid.appendChild(card);
      });

      document.querySelectorAll(".copy-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          copyCode(btn.dataset.id);
        });
      });

      emptyState.style.display = filteredEffects.length ? "none" : "block";
      countPill.textContent = filteredEffects.length + " Effects";

      const shown = Math.min(visibleCount, filteredEffects.length);
      loadStatus.textContent = `Showing ${shown} of ${filteredEffects.length} effects`;

      if (filteredEffects.length === 0) {
        loadStatus.style.display = "none";
      } else {
        loadStatus.style.display = "block";
      }
    }

    function copyCode(id) {
      const effect = effects.find(item => item.id === id);

      if (!effect) {
        showToast("Code not found");
        return;
      }

      const code = `${effect.html}

<style>
${baseIconCSS}

${commonKeyframes}

${effect.css}
</style>`;

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(code).then(() => {
          showToast("Code copied");
        }).catch(() => {
          fallbackCopy(code);
        });
      } else {
        fallbackCopy(code);
      }
    }

    function fallbackCopy(text) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      textarea.style.top = "-9999px";
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();

      try {
        document.execCommand("copy");
        showToast("Code copied");
      } catch (err) {
        showToast("Copy failed");
      }

      document.body.removeChild(textarea);
    }

    function showToast(message) {
      const oldToast = document.querySelector(".toast");
      if (oldToast) oldToast.remove();

      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = message;
      document.body.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.add("show");
      });

      setTimeout(() => {
        toast.classList.remove("show");
        setTimeout(() => toast.remove(), 250);
      }, 1500);
    }

    function applySearch() {
      const value = searchInput.value.trim().toLowerCase();

      filteredEffects = effects.filter(effect => {
        return (
          effect.name.toLowerCase().includes(value) ||
          effect.about.toLowerCase().includes(value) ||
          effect.className.toLowerCase().includes(value)
        );
      });

      visibleCount = batchSize;
      renderCards();
    }

    function loadMoreOnScroll() {
      if (isLoadingMore) return;
      if (visibleCount >= filteredEffects.length) return;

      const nearBottom = window.innerHeight + window.scrollY >= document.body.offsetHeight - 450;

      if (nearBottom) {
        isLoadingMore = true;

        setTimeout(() => {
          visibleCount += batchSize;
          renderCards();
          isLoadingMore = false;
        }, 180);
      }
    }

    searchInput.addEventListener("input", applySearch);
    window.addEventListener("scroll", loadMoreOnScroll);

    renderCards();
  </script>
