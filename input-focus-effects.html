<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Input Focus Effects</title>

  <style>
    :root {
      --bg: #000;
      --border: rgba(255,255,255,0.14);
      --text: #fff;
      --muted: rgba(255,255,255,0.58);
      --blue: #4f8cff;
      --purple: #8d6bff;
      --green: #35c759;
      --red: #ff5f57;
      --yellow: #ffbd2e;
      --orange: #ff9f0a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,0.15), transparent 24%),
        radial-gradient(circle at 18% 28%, rgba(79,140,255,0.11), transparent 28%),
        linear-gradient(180deg, #000, #050505 55%, #090909);
      color: var(--text);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.024) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.024) 1px, transparent 1px);
      background-size: 70px 70px;
      mask-image: radial-gradient(circle at center, black, transparent 75%);
      z-index: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(100%, 1560px);
      margin: 0 auto;
      padding: 22px;
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 16px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px;
      border-radius: 24px;
      background: rgba(20,20,20,0.78);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(26px);
      box-shadow: 0 20px 70px rgba(0,0,0,0.46);
      margin-bottom: 30px;
    }

    .search-box {
      width: 280px;
      height: 46px;
      border-radius: 16px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.12);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      flex: 0 0 auto;
    }

    .search-box svg {
      color: rgba(255,255,255,0.58);
      flex: 0 0 auto;
    }

    .search-box input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font-size: 14px;
      font-weight: 750;
    }

    .search-box input::placeholder {
      color: rgba(255,255,255,0.45);
    }

    .menu {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      flex: 1;
    }

    .menu::-webkit-scrollbar {
      display: none;
    }

    .menu a {
      height: 46px;
      padding: 0 16px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.68);
      font-size: 14px;
      font-weight: 850;
      border: 1px solid transparent;
      white-space: nowrap;
      transition: 180ms ease;
    }

    .menu a:hover,
    .menu a.active {
      background: rgba(255,255,255,0.11);
      border-color: rgba(255,255,255,0.12);
      color: white;
    }

    .menu a.active {
      background: rgba(79,140,255,0.22);
      border-color: rgba(79,140,255,0.38);
    }

    .content-header {
      margin-bottom: 24px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
    }

    .title-block h1 {
      font-size: clamp(34px, 4.8vw, 64px);
      line-height: 0.95;
      letter-spacing: -0.065em;
      font-weight: 950;
      margin-bottom: 10px;
    }

    .title-block p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
      font-weight: 650;
      max-width: 760px;
    }

    .count-pill {
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.74);
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
      padding-bottom: 35px;
    }

    .card {
      min-height: 238px;
      border-radius: 24px;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,0.12), transparent 50%),
        linear-gradient(180deg, rgba(255,255,255,0.09), rgba(255,255,255,0.04));
      border: 1px solid var(--border);
      overflow: hidden;
      transition: 220ms ease;
      box-shadow: 0 18px 50px rgba(0,0,0,0.25);
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(255,255,255,0.24);
      box-shadow: 0 28px 80px rgba(0,0,0,0.44);
    }

    .preview {
      height: 138px;
      display: grid;
      place-items: center;
      padding: 18px;
      border-bottom: 1px solid rgba(255,255,255,0.09);
      background: rgba(0,0,0,0.20);
      overflow: hidden;
      position: relative;
      perspective: 900px;
    }

    .input-wrap {
      position: relative;
      width: 150px;
    }

    .input-demo {
      width: 100%;
      height: 44px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.10);
      color: white;
      outline: none;
      padding: 0 14px;
      font-size: 13px;
      font-weight: 800;
      transition: 260ms ease;
      box-shadow: 0 14px 34px rgba(0,0,0,.28);
    }

    .input-demo::placeholder {
      color: rgba(255,255,255,0.45);
    }

    .input-demo:focus {
      border-color: rgba(79,140,255,0.95);
    }

    .fake-input {
      position: relative;
      width: 150px;
      min-height: 44px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.10);
      color: white;
      display: flex;
      align-items: center;
      padding: 0 14px;
      font-size: 13px;
      font-weight: 850;
      transition: 260ms ease;
      overflow: hidden;
      box-shadow: 0 14px 34px rgba(0,0,0,.28);
      isolation: isolate;
    }

    .fake-input span {
      position: relative;
      z-index: 5;
    }

    .card-body {
      padding: 15px;
    }

    .name-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .name-row h3 {
      font-size: 16px;
      line-height: 1.12;
      letter-spacing: -0.03em;
      font-weight: 900;
    }

    .copy-btn {
      width: 36px;
      height: 36px;
      border-radius: 13px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.085);
      color: white;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex: 0 0 auto;
      transition: 180ms ease;
    }

    .copy-btn:hover {
      background: rgba(79,140,255,0.95);
      border-color: rgba(79,140,255,0.95);
      transform: translateY(-2px);
    }

    .card-body p {
      color: rgba(255,255,255,0.55);
      font-size: 12.5px;
      line-height: 1.45;
      font-weight: 650;
    }

    .empty {
      padding: 24px;
      border-radius: 22px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.72);
      text-align: center;
      font-weight: 750;
      margin-bottom: 20px;
      display: none;
    }

    .load-status {
      margin: 0 auto 70px;
      width: fit-content;
      padding: 12px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.65);
      font-size: 12px;
      font-weight: 850;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%) translateY(18px);
      padding: 13px 18px;
      border-radius: 16px;
      background: rgba(255,255,255,0.93);
      color: #111;
      font-size: 13px;
      font-weight: 850;
      box-shadow: 0 18px 60px rgba(0,0,0,0.45);
      opacity: 0;
      pointer-events: none;
      transition: 220ms ease;
      z-index: 9999;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 1280px) {
      .grid { grid-template-columns: repeat(4, 1fr); }
    }

    @media (max-width: 1100px) {
      .grid { grid-template-columns: repeat(3, 1fr); }
      .topbar { align-items: flex-start; flex-direction: column; }
      .search-box { width: 100%; }
      .menu { width: 100%; }
    }

    @media (max-width: 760px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
      .content-header { display: block; }
      .count-pill { display: inline-block; margin-top: 12px; }
    }

    @media (max-width: 520px) {
      .page { padding: 12px; }
      .topbar { top: 10px; border-radius: 20px; }
      .menu a { height: 42px; padding: 0 13px; font-size: 13px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <div class="page">
    <header class="topbar">
      <div class="search-box">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2.2"/>
          <path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <input id="searchInput" type="text" placeholder="Search effect..." />
      </div>

      <nav class="menu" id="mainMenu"></nav>
    </header>

    <main>
      <header class="content-header">
        <div class="title-block">
          <h1>Input Focus Effects</h1>
          <p>100 live input, search, textarea, form, focus, validation, floating label, and premium field effects.</p>
        </div>

        <div class="count-pill" id="countPill">0 Effects</div>
      </header>

      <div id="emptyState" class="empty">
        No effect found. Try searching “glow”, “floating”, “search”, “error”, “success”, “password”, or “textarea”.
      </div>

      <section id="grid" class="grid"></section>

      <div id="loadStatus" class="load-status">Showing 0 of 100 effects</div>
    </main>
  </div>

  <style id="dynamicEffectStyles"></style>

  <script src="nav.js"></script>

  <script>
    const effects = [];

    const baseInputCSS = `.input-wrap {
  position: relative;
  width: 150px;
}
.input-demo {
  width: 100%;
  height: 44px;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.16);
  background: rgba(255,255,255,0.10);
  color: white;
  outline: none;
  padding: 0 14px;
  font-size: 13px;
  font-weight: 800;
  transition: 260ms ease;
  box-shadow: 0 14px 34px rgba(0,0,0,.28);
}
.input-demo::placeholder {
  color: rgba(255,255,255,0.45);
}
.input-demo:focus {
  border-color: rgba(79,140,255,0.95);
}`;

    const baseFakeCSS = `.fake-input {
  position: relative;
  width: 150px;
  min-height: 44px;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.16);
  background: rgba(255,255,255,0.10);
  color: white;
  display: flex;
  align-items: center;
  padding: 0 14px;
  font-size: 13px;
  font-weight: 850;
  transition: 260ms ease;
  overflow: hidden;
  box-shadow: 0 14px 34px rgba(0,0,0,.28);
  isolation: isolate;
}
.fake-input span {
  position: relative;
  z-index: 5;
}`;

    const commonKeyframes = `
@keyframes inputGlow { 0%,100%{box-shadow:0 0 0 rgba(79,140,255,0);} 50%{box-shadow:0 0 26px rgba(79,140,255,.65);} }
@keyframes inputRedGlow { 0%,100%{box-shadow:0 0 0 rgba(255,95,87,0);} 50%{box-shadow:0 0 24px rgba(255,95,87,.65);} }
@keyframes inputGreenGlow { 0%,100%{box-shadow:0 0 0 rgba(53,199,89,0);} 50%{box-shadow:0 0 24px rgba(53,199,89,.65);} }
@keyframes inputGoldGlow { 0%,100%{box-shadow:0 0 0 rgba(255,189,46,0);} 50%{box-shadow:0 0 24px rgba(255,189,46,.65);} }
@keyframes inputShake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }
@keyframes inputPulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.04);} }
@keyframes inputFloat { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-7px);} }
@keyframes inputShimmer { to{background-position:-220% center;} }
@keyframes inputGradient { 0%,100%{background-position:0% center;} 50%{background-position:100% center;} }
@keyframes inputScan { 0%,100%{top:0;} 50%{top:calc(100% - 3px);} }
@keyframes inputTypingDots { 0%{content:"";} 25%{content:".";} 50%{content:"..";} 75%,100%{content:"...";} }
@keyframes inputSpin { to{transform:rotate(360deg);} }
@keyframes inputDotWave { 0%,100%{transform:translateY(0);opacity:.45;} 50%{transform:translateY(-7px);opacity:1;} }
`;

    function addEffect(name, about, type, className, css, html) {
      effects.push({
        id: String(effects.length),
        name,
        about,
        type,
        className,
        html: html || `<div class="input-wrap ${className}"><input class="input-demo" placeholder="Focus me" /></div>`,
        css
      });
    }

    addEffect("Blue Focus Glow", "Input gets blue glow when focused.", "input", "input-blue-focus", `.input-blue-focus .input-demo:focus{box-shadow:0 0 26px rgba(79,140,255,.65);border-color:#4f8cff;}`);
    addEffect("Soft Focus Glow", "Input gets soft white glow on focus.", "input", "input-soft-focus", `.input-soft-focus .input-demo:focus{box-shadow:0 0 24px rgba(255,255,255,.28);border-color:rgba(255,255,255,.5);}`);
    addEffect("Green Focus Glow", "Success-style green focus state.", "input", "input-green-focus", `.input-green-focus .input-demo:focus{box-shadow:0 0 24px rgba(53,199,89,.65);border-color:#35c759;}`);
    addEffect("Red Focus Glow", "Error-style red focus state.", "input", "input-red-focus", `.input-red-focus .input-demo:focus{box-shadow:0 0 24px rgba(255,95,87,.65);border-color:#ff5f57;}`);
    addEffect("Gold Focus Glow", "Premium gold focus state.", "input", "input-gold-focus", `.input-gold-focus .input-demo:focus{box-shadow:0 0 24px rgba(255,189,46,.65);border-color:#ffbd2e;}`);
    addEffect("Inset Focus", "Input glows from inside on focus.", "input", "input-inset-focus", `.input-inset-focus .input-demo:focus{box-shadow:inset 0 0 18px rgba(79,140,255,.45),0 0 20px rgba(79,140,255,.25);border-color:#4f8cff;}`);
    addEffect("Border Grow Focus", "Border becomes thicker on focus.", "input", "input-border-grow", `.input-border-grow .input-demo:focus{border-width:2px;border-color:#4f8cff;box-shadow:0 0 18px rgba(79,140,255,.35);}`);
    addEffect("Lift Focus", "Input lifts upward on focus.", "input", "input-lift-focus", `.input-lift-focus .input-demo:focus{transform:translateY(-6px);box-shadow:0 24px 48px rgba(0,0,0,.45);}`);
    addEffect("Scale Focus", "Input scales slightly on focus.", "input", "input-scale-focus", `.input-scale-focus .input-demo:focus{transform:scale(1.06);border-color:#4f8cff;box-shadow:0 0 22px rgba(79,140,255,.45);}`);
    addEffect("Press Focus", "Input presses inward on focus.", "input", "input-press-focus", `.input-press-focus .input-demo:focus{transform:translateY(4px) scale(.98);box-shadow:inset 0 8px 16px rgba(0,0,0,.35);}`);

    addEffect("Underline Focus", "Underline expands when input is focused.", "input", "input-underline-focus", `.input-underline-focus .input-demo{border-color:transparent;border-radius:0;background:transparent;box-shadow:none;border-bottom:2px solid rgba(255,255,255,.18);} .input-underline-focus::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:#4f8cff;transform:scaleX(0);transform-origin:left;transition:.28s ease;} .input-underline-focus:focus-within::after{transform:scaleX(1);}`);
    addEffect("Center Underline", "Underline expands from center.", "input", "input-center-underline", `.input-center-underline .input-demo{border-color:transparent;border-radius:0;background:transparent;box-shadow:none;border-bottom:2px solid rgba(255,255,255,.18);} .input-center-underline::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:#4f8cff;transform:scaleX(0);transform-origin:center;transition:.28s ease;} .input-center-underline:focus-within::after{transform:scaleX(1);}`);
    addEffect("Double Underline", "Two underline layers animate on focus.", "input", "input-double-underline", `.input-double-underline .input-demo{border-color:transparent;border-radius:0;background:transparent;box-shadow:none;border-bottom:2px solid rgba(255,255,255,.18);} .input-double-underline::before,.input-double-underline::after{content:"";position:absolute;left:0;right:0;height:2px;background:#4f8cff;transform:scaleX(0);transition:.28s ease;} .input-double-underline::before{bottom:0;transform-origin:left;} .input-double-underline::after{bottom:-5px;transform-origin:right;background:#8d6bff;} .input-double-underline:focus-within::before,.input-double-underline:focus-within::after{transform:scaleX(1);}`);
    addEffect("Top Border Focus", "Top border slides in on focus.", "input", "input-top-border", `.input-top-border::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:#4f8cff;transform:scaleX(0);transition:.28s ease;} .input-top-border:focus-within::before{transform:scaleX(1);}`);
    addEffect("Left Border Focus", "Left border grows on focus.", "input", "input-left-border", `.input-left-border::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#4f8cff;transform:scaleY(0);transition:.28s ease;border-radius:999px;} .input-left-border:focus-within::before{transform:scaleY(1);}`);
    addEffect("Right Border Focus", "Right border grows on focus.", "input", "input-right-border", `.input-right-border::after{content:"";position:absolute;right:0;top:0;bottom:0;width:3px;background:#8d6bff;transform:scaleY(0);transition:.28s ease;border-radius:999px;} .input-right-border:focus-within::after{transform:scaleY(1);}`);
    addEffect("Full Border Draw", "Border draws around input on focus.", "input", "input-border-draw", `.input-border-draw .input-demo:focus{border-color:transparent;} .input-border-draw::after{content:"";position:absolute;inset:0;border-radius:14px;padding:2px;background:linear-gradient(90deg,#4f8cff,#8d6bff,#4f8cff);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:.25s ease;} .input-border-draw:focus-within::after{opacity:1;}`);
    addEffect("Rotating Border", "Animated rotating border around input.", "input", "input-rotating-border", `.input-rotating-border{overflow:hidden;border-radius:14px;} .input-rotating-border::before{content:"";position:absolute;inset:-80%;background:conic-gradient(from 0deg,transparent,#4f8cff,transparent,#8d6bff,transparent);opacity:0;animation:inputSpin 2s linear infinite;} .input-rotating-border:focus-within::before{opacity:1;} .input-rotating-border .input-demo{position:relative;z-index:2;background:#111;}`);
    addEffect("Dashed Focus", "Dashed border appears on focus.", "input", "input-dashed-focus", `.input-dashed-focus .input-demo:focus{border:2px dashed #4f8cff;box-shadow:0 0 22px rgba(79,140,255,.35);}`);
    addEffect("Gradient Border Focus", "Gradient border appears on focus.", "input", "input-gradient-border", `.input-gradient-border::after{content:"";position:absolute;inset:0;border-radius:14px;padding:2px;background:linear-gradient(90deg,#4f8cff,#8d6bff,#4f8cff);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:.25s ease;} .input-gradient-border:focus-within::after{opacity:1;}`);

    addEffect("Floating Label", "Label floats above input on focus.", "input", "input-floating-label", `.input-floating-label label{position:absolute;left:14px;top:13px;color:rgba(255,255,255,.48);font-size:13px;font-weight:850;transition:.25s ease;pointer-events:none;} .input-floating-label .input-demo{padding-top:12px;} .input-floating-label:focus-within label{top:5px;font-size:10px;color:#4f8cff;}`, `<div class="input-wrap input-floating-label"><input class="input-demo" /><label>Email</label></div>`);
    addEffect("Floating Label Glow", "Floating label with focus glow.", "input", "input-floating-glow", `.input-floating-glow label{position:absolute;left:14px;top:13px;color:rgba(255,255,255,.48);font-size:13px;font-weight:850;transition:.25s ease;pointer-events:none;} .input-floating-glow .input-demo{padding-top:12px;} .input-floating-glow:focus-within label{top:5px;font-size:10px;color:#4f8cff;text-shadow:0 0 12px rgba(79,140,255,.8);} .input-floating-glow .input-demo:focus{box-shadow:0 0 24px rgba(79,140,255,.5);}`, `<div class="input-wrap input-floating-glow"><input class="input-demo" /><label>Name</label></div>`);
    addEffect("Floating Label Slide", "Label slides to top-left on focus.", "input", "input-floating-slide", `.input-floating-slide label{position:absolute;left:14px;top:13px;color:rgba(255,255,255,.48);font-size:13px;font-weight:850;transition:.25s ease;pointer-events:none;} .input-floating-slide:focus-within label{top:-18px;left:4px;font-size:11px;color:#4f8cff;}`, `<div class="input-wrap input-floating-slide"><input class="input-demo" placeholder="" /><label>Search</label></div>`);
    addEffect("Label Pop", "Label pops upward on focus.", "input", "input-label-pop", `.input-label-pop label{position:absolute;left:14px;top:13px;color:rgba(255,255,255,.48);font-size:13px;font-weight:850;transition:.25s ease;pointer-events:none;} .input-label-pop:focus-within label{transform:translateY(-28px) scale(.82);color:#4f8cff;}`, `<div class="input-wrap input-label-pop"><input class="input-demo" /><label>Label</label></div>`);

    const grid = document.getElementById("grid");
    const searchInput = document.getElementById("searchInput");
    const countPill = document.getElementById("countPill");
    const emptyState = document.getElementById("emptyState");
    const loadStatus = document.getElementById("loadStatus");
    const dynamicEffectStyles = document.getElementById("dynamicEffectStyles");

    const batchSize = 20;
    let visibleCount = batchSize;
    let filteredEffects = [...effects];
    let isLoadingMore = false;

    dynamicEffectStyles.textContent = commonKeyframes + "\n\n" + effects.map(effect => effect.css).join("\n\n");

    function copyIcon() {
      return `
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <rect x="9" y="9" width="10" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
          <rect x="5" y="5" width="10" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
        </svg>
      `;
    }

    function renderCards() {
      grid.innerHTML = "";

      const visibleEffects = filteredEffects.slice(0, visibleCount);

      visibleEffects.forEach(effect => {
        const card = document.createElement("div");
        card.className = "card";
        card.dataset.search = `${effect.name} ${effect.about} ${effect.className} ${effect.type}`.toLowerCase();

        card.innerHTML = `
          <div class="preview">${effect.html}</div>
          <div class="card-body">
            <div class="name-row">
              <h3>${effect.name}</h3>
              <button class="copy-btn" data-id="${effect.id}" title="Copy code">
                ${copyIcon()}
              </button>
            </div>
            <p>${effect.about}</p>
          </div>
        `;

        grid.appendChild(card);
      });

      document.querySelectorAll(".copy-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          copyCode(btn.dataset.id);
        });
      });

      emptyState.style.display = filteredEffects.length ? "none" : "block";
      countPill.textContent = filteredEffects.length + " Effects";

      const shown = Math.min(visibleCount, filteredEffects.length);
      loadStatus.textContent = `Showing ${shown} of ${filteredEffects.length} effects`;

      if (filteredEffects.length === 0) {
        loadStatus.style.display = "none";
      } else {
        loadStatus.style.display = "block";
      }
    }

    function baseCSSFor(type) {
      if (type === "fake") return baseFakeCSS;
      return baseInputCSS;
    }

    function copyCode(id) {
      const effect = effects.find(item => item.id === id);

      if (!effect) {
        showToast("Code not found");
        return;
      }

      const code = `${effect.html}

<style>
${baseCSSFor(effect.type)}

${commonKeyframes}

${effect.css}
</style>`;

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(code).then(() => {
          showToast("Code copied");
        }).catch(() => {
          fallbackCopy(code);
        });
      } else {
        fallbackCopy(code);
      }
    }

    function fallbackCopy(text) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      textarea.style.top = "-9999px";
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();

      try {
        document.execCommand("copy");
        showToast("Code copied");
      } catch (err) {
        showToast("Copy failed");
      }

      document.body.removeChild(textarea);
    }

    function showToast(message) {
      const oldToast = document.querySelector(".toast");
      if (oldToast) oldToast.remove();

      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = message;
      document.body.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.add("show");
      });

      setTimeout(() => {
        toast.classList.remove("show");
        setTimeout(() => toast.remove(), 250);
      }, 1500);
    }

    function applySearch() {
      const value = searchInput.value.trim().toLowerCase();

      filteredEffects = effects.filter(effect => {
        return (
          effect.name.toLowerCase().includes(value) ||
          effect.about.toLowerCase().includes(value) ||
          effect.className.toLowerCase().includes(value) ||
          effect.type.toLowerCase().includes(value)
        );
      });

      visibleCount = batchSize;
      renderCards();
    }

    function loadMoreOnScroll() {
      if (isLoadingMore) return;
      if (visibleCount >= filteredEffects.length) return;

      const nearBottom = window.innerHeight + window.scrollY >= document.body.offsetHeight - 450;

      if (nearBottom) {
        isLoadingMore = true;

        setTimeout(() => {
          visibleCount += batchSize;
          renderCards();
          isLoadingMore = false;
        }, 180);
      }
    }

    searchInput.addEventListener("input", applySearch);
    window.addEventListener("scroll", loadMoreOnScroll);

    renderCards();
  </script>
