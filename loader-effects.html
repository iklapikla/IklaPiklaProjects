<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loader Effects</title>

  <style>
    :root {
      --bg: #000;
      --border: rgba(255,255,255,0.14);
      --text: #fff;
      --muted: rgba(255,255,255,0.58);
      --blue: #4f8cff;
      --purple: #8d6bff;
      --green: #35c759;
      --red: #ff5f57;
      --yellow: #ffbd2e;
      --orange: #ff9f0a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,0.15), transparent 24%),
        radial-gradient(circle at 18% 28%, rgba(79,140,255,0.11), transparent 28%),
        linear-gradient(180deg, #000, #050505 55%, #090909);
      color: var(--text);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.024) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.024) 1px, transparent 1px);
      background-size: 70px 70px;
      mask-image: radial-gradient(circle at center, black, transparent 75%);
      z-index: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(100%, 1480px);
      margin: 0 auto;
      padding: 22px;
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 16px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px;
      border-radius: 24px;
      background: rgba(20,20,20,0.78);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(26px);
      box-shadow: 0 20px 70px rgba(0,0,0,0.46);
      margin-bottom: 30px;
    }

    .search-box {
      width: 280px;
      height: 46px;
      border-radius: 16px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.12);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      flex: 0 0 auto;
    }

    .search-box svg {
      color: rgba(255,255,255,0.58);
      flex: 0 0 auto;
    }

    .search-box input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font-size: 14px;
      font-weight: 750;
    }

    .search-box input::placeholder {
      color: rgba(255,255,255,0.45);
    }

    .menu {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      flex: 1;
    }

    .menu::-webkit-scrollbar {
      display: none;
    }

    .menu a {
      height: 46px;
      padding: 0 16px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.68);
      font-size: 14px;
      font-weight: 850;
      border: 1px solid transparent;
      white-space: nowrap;
      transition: 180ms ease;
    }

    .menu a:hover,
    .menu a.active {
      background: rgba(255,255,255,0.11);
      border-color: rgba(255,255,255,0.12);
      color: white;
    }

    .menu a.active {
      background: rgba(79,140,255,0.22);
      border-color: rgba(79,140,255,0.38);
    }

    .content-header {
      margin-bottom: 24px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
    }

    .title-block h1 {
      font-size: clamp(34px, 4.8vw, 64px);
      line-height: 0.95;
      letter-spacing: -0.065em;
      font-weight: 950;
      margin-bottom: 10px;
    }

    .title-block p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
      font-weight: 650;
      max-width: 680px;
    }

    .count-pill {
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.74);
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      padding-bottom: 70px;
    }

    .card {
      min-height: 238px;
      border-radius: 24px;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,0.12), transparent 50%),
        linear-gradient(180deg, rgba(255,255,255,0.09), rgba(255,255,255,0.04));
      border: 1px solid var(--border);
      overflow: hidden;
      transition: 220ms ease;
      box-shadow: 0 18px 50px rgba(0,0,0,0.25);
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(255,255,255,0.24);
      box-shadow: 0 28px 80px rgba(0,0,0,0.44);
    }

    .preview {
      height: 138px;
      display: grid;
      place-items: center;
      padding: 18px;
      border-bottom: 1px solid rgba(255,255,255,0.09);
      background: rgba(0,0,0,0.20);
      overflow: hidden;
      position: relative;
    }

    .card-body {
      padding: 15px;
    }

    .name-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .name-row h3 {
      font-size: 16px;
      line-height: 1.12;
      letter-spacing: -0.03em;
      font-weight: 900;
    }

    .copy-btn {
      width: 36px;
      height: 36px;
      border-radius: 13px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.085);
      color: white;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex: 0 0 auto;
      transition: 180ms ease;
    }

    .copy-btn:hover {
      background: rgba(79,140,255,0.95);
      border-color: rgba(79,140,255,0.95);
      transform: translateY(-2px);
    }

    .card-body p {
      color: rgba(255,255,255,0.55);
      font-size: 12.5px;
      line-height: 1.45;
      font-weight: 650;
    }

    .empty {
      padding: 24px;
      border-radius: 22px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.72);
      text-align: center;
      font-weight: 750;
      margin-bottom: 20px;
      display: none;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%) translateY(18px);
      padding: 13px 18px;
      border-radius: 16px;
      background: rgba(255,255,255,0.93);
      color: #111;
      font-size: 13px;
      font-weight: 850;
      box-shadow: 0 18px 60px rgba(0,0,0,0.45);
      opacity: 0;
      pointer-events: none;
      transition: 220ms ease;
      z-index: 9999;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Loader Effects */
    .loader-spin {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 5px solid rgba(255,255,255,.15);
      border-top-color: var(--blue);
      animation: spin 0.9s linear infinite;
    }

    .loader-dual-ring {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 5px solid transparent;
      border-top-color: var(--blue);
      border-bottom-color: var(--purple);
      animation: spin 1s linear infinite;
    }

    .loader-dots {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .loader-dots span {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--blue);
      animation: dotBounce .9s ease-in-out infinite;
    }
    .loader-dots span:nth-child(2) { animation-delay: .15s; }
    .loader-dots span:nth-child(3) { animation-delay: .3s; }

    .loader-pulse-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--blue);
      box-shadow: 0 0 0 0 rgba(79,140,255,.7);
      animation: pulseDot 1.3s ease-out infinite;
    }

    .loader-bars {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 54px;
    }
    .loader-bars span {
      width: 8px;
      height: 22px;
      border-radius: 999px;
      background: var(--blue);
      animation: bars 1s ease-in-out infinite;
    }
    .loader-bars span:nth-child(2) { animation-delay: .12s; }
    .loader-bars span:nth-child(3) { animation-delay: .24s; }
    .loader-bars span:nth-child(4) { animation-delay: .36s; }

    .loader-wave {
      display: flex;
      align-items: center;
      gap: 5px;
      height: 54px;
    }
    .loader-wave span {
      width: 7px;
      height: 16px;
      border-radius: 999px;
      background: white;
      animation: waveLoader 1.1s ease-in-out infinite;
    }
    .loader-wave span:nth-child(2) { animation-delay: .1s; }
    .loader-wave span:nth-child(3) { animation-delay: .2s; }
    .loader-wave span:nth-child(4) { animation-delay: .3s; }
    .loader-wave span:nth-child(5) { animation-delay: .4s; }

    .loader-skeleton {
      width: 122px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(90deg, rgba(255,255,255,.07), rgba(255,255,255,.23), rgba(255,255,255,.07));
      background-size: 220%;
      animation: skeletonMove 1.4s linear infinite;
    }

    .loader-progress {
      width: 132px;
      height: 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.12);
      overflow: hidden;
    }
    .loader-progress::before {
      content: "";
      display: block;
      height: 100%;
      width: 42%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--blue), var(--purple));
      animation: progressMove 1.35s ease-in-out infinite;
    }

    .loader-indeterminate {
      width: 132px;
      height: 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.12);
      overflow: hidden;
    }
    .loader-indeterminate::before {
      content: "";
      display: block;
      height: 100%;
      width: 45%;
      border-radius: inherit;
      background: var(--blue);
      animation: indeterminate 1.15s ease-in-out infinite;
    }

    .loader-orbit {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.16);
      position: relative;
      animation: spin 1.4s linear infinite;
    }
    .loader-orbit::before {
      content: "";
      position: absolute;
      top: -6px;
      left: 50%;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--blue);
      box-shadow: 0 0 22px rgba(79,140,255,.8);
      transform: translateX(-50%);
    }

    .loader-radar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(79,140,255,.25) 0 3px, transparent 4px),
        conic-gradient(from 0deg, rgba(79,140,255,.85), transparent 38%);
      animation: spin 1.4s linear infinite;
    }

    .loader-cube {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--blue), var(--purple));
      animation: cubeRotate 1.2s ease-in-out infinite;
    }

    .loader-flip {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--blue), var(--purple));
      animation: flipLoader 1.3s ease-in-out infinite;
      transform-style: preserve-3d;
    }

    .loader-heartbeat {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: rgba(255,95,87,.85);
      transform: rotate(45deg);
      animation: heartbeat 1.1s ease-in-out infinite;
    }
    .loader-heartbeat::before,
    .loader-heartbeat::after {
      content: "";
      position: absolute;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255,95,87,.85);
    }
    .loader-heartbeat::before { left: -24px; top: 0; }
    .loader-heartbeat::after { top: -24px; left: 0; }

    .loader-ring-pulse {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 3px solid rgba(79,140,255,.85);
      animation: ringPulse 1.2s ease-out infinite;
    }

    .loader-bubble {
      width: 74px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border-radius: 999px;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.14);
    }
    .loader-bubble span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: white;
      animation: bubbleTyping 1.2s ease-in-out infinite;
    }
    .loader-bubble span:nth-child(2) { animation-delay: .18s; }
    .loader-bubble span:nth-child(3) { animation-delay: .36s; }

    .loader-text {
      font-size: 24px;
      font-weight: 950;
      letter-spacing: -0.04em;
      background: linear-gradient(90deg, rgba(255,255,255,.25), white, rgba(255,255,255,.25));
      background-size: 220%;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      animation: textLoading 1.4s linear infinite;
    }

    .loader-percent::after {
      content: "0%";
      font-size: 28px;
      font-weight: 950;
      animation: percentChange 2s steps(5) infinite;
    }

    .loader-circle-dots {
      position: relative;
      width: 62px;
      height: 62px;
      animation: spin 1.2s linear infinite;
    }
    .loader-circle-dots span {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--blue);
      left: 50%;
      top: 50%;
      transform-origin: 0 0;
    }
    .loader-circle-dots span:nth-child(1) { transform: rotate(0deg) translate(24px); opacity: 1; }
    .loader-circle-dots span:nth-child(2) { transform: rotate(72deg) translate(24px); opacity: .8; }
    .loader-circle-dots span:nth-child(3) { transform: rotate(144deg) translate(24px); opacity: .6; }
    .loader-circle-dots span:nth-child(4) { transform: rotate(216deg) translate(24px); opacity: .4; }
    .loader-circle-dots span:nth-child(5) { transform: rotate(288deg) translate(24px); opacity: .2; }

    .loader-scan {
      width: 120px;
      height: 72px;
      border-radius: 18px;
      border: 1px solid rgba(79,140,255,.45);
      background: rgba(79,140,255,.10);
      position: relative;
      overflow: hidden;
    }
    .loader-scan::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--blue);
      box-shadow: 0 0 18px rgba(79,140,255,.9);
      animation: scanMove 1.5s ease-in-out infinite;
    }

    .loader-liquid {
      width: 60px;
      height: 60px;
      border-radius: 18px;
      border: 1px solid rgba(79,140,255,.45);
      background:
        linear-gradient(180deg, transparent 45%, rgba(79,140,255,.9) 46%);
      background-size: 100% 220%;
      animation: liquidFill 1.8s ease-in-out infinite;
    }

    .loader-glow-ball {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--blue);
      box-shadow: 0 0 25px rgba(79,140,255,.85);
      animation: glowBall 1.4s ease-in-out infinite;
    }

    .loader-bounce-square {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--blue);
      animation: bounceSquare 1.1s ease-in-out infinite;
    }

    .loader-infinity {
      position: relative;
      width: 92px;
      height: 44px;
    }
    .loader-infinity::before,
    .loader-infinity::after {
      content: "";
      position: absolute;
      width: 42px;
      height: 42px;
      border: 4px solid var(--blue);
      border-radius: 50%;
      animation: infinityPulse 1.3s ease-in-out infinite;
    }
    .loader-infinity::before { left: 6px; }
    .loader-infinity::after { right: 6px; animation-delay: .35s; }

    .loader-grid {
      display: grid;
      grid-template-columns: repeat(3, 12px);
      gap: 6px;
    }
    .loader-grid span {
      width: 12px;
      height: 12px;
      border-radius: 4px;
      background: var(--blue);
      animation: gridPulse 1.2s ease-in-out infinite;
    }
    .loader-grid span:nth-child(2) { animation-delay: .1s; }
    .loader-grid span:nth-child(3) { animation-delay: .2s; }
    .loader-grid span:nth-child(4) { animation-delay: .3s; }
    .loader-grid span:nth-child(5) { animation-delay: .4s; }
    .loader-grid span:nth-child(6) { animation-delay: .5s; }
    .loader-grid span:nth-child(7) { animation-delay: .6s; }
    .loader-grid span:nth-child(8) { animation-delay: .7s; }
    .loader-grid span:nth-child(9) { animation-delay: .8s; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes dotBounce {
      0%, 100% { transform: translateY(0); opacity: .45; }
      50% { transform: translateY(-12px); opacity: 1; }
    }

    @keyframes pulseDot {
      0% { box-shadow: 0 0 0 0 rgba(79,140,255,.7); }
      70% { box-shadow: 0 0 0 22px rgba(79,140,255,0); }
      100% { box-shadow: 0 0 0 0 rgba(79,140,255,0); }
    }

    @keyframes bars {
      0%, 100% { height: 18px; opacity: .45; }
      50% { height: 48px; opacity: 1; }
    }

    @keyframes waveLoader {
      0%, 100% { height: 16px; opacity: .5; }
      50% { height: 48px; opacity: 1; }
    }

    @keyframes skeletonMove {
      to { background-position: -220% center; }
    }

    @keyframes progressMove {
      0% { transform: translateX(-110%); }
      50% { transform: translateX(70%); }
      100% { transform: translateX(240%); }
    }

    @keyframes indeterminate {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(260%); }
    }

    @keyframes cubeRotate {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(.82); }
      100% { transform: rotate(360deg) scale(1); }
    }

    @keyframes flipLoader {
      0% { transform: rotateX(0) rotateY(0); }
      50% { transform: rotateX(180deg) rotateY(0); }
      100% { transform: rotateX(180deg) rotateY(180deg); }
    }

    @keyframes heartbeat {
      0%, 100% { transform: rotate(45deg) scale(.82); }
      45% { transform: rotate(45deg) scale(1.05); }
      60% { transform: rotate(45deg) scale(.9); }
      75% { transform: rotate(45deg) scale(1.15); }
    }

    @keyframes ringPulse {
      0% { transform: scale(.65); opacity: 1; }
      100% { transform: scale(1.45); opacity: 0; }
    }

    @keyframes bubbleTyping {
      0%, 100% { transform: translateY(0); opacity: .4; }
      50% { transform: translateY(-6px); opacity: 1; }
    }

    @keyframes textLoading {
      to { background-position: -220% center; }
    }

    @keyframes percentChange {
      0% { content: "0%"; }
      20% { content: "25%"; }
      40% { content: "50%"; }
      60% { content: "75%"; }
      80%, 100% { content: "100%"; }
    }

    @keyframes scanMove {
      0%, 100% { top: 0; }
      50% { top: calc(100% - 3px); }
    }

    @keyframes liquidFill {
      0%, 100% { background-position: 0 100%; }
      50% { background-position: 0 25%; }
    }

    @keyframes glowBall {
      0%, 100% { transform: scale(.8); opacity: .6; }
      50% { transform: scale(1.35); opacity: 1; }
    }

    @keyframes bounceSquare {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-18px) rotate(45deg); }
    }

    @keyframes infinityPulse {
      0%, 100% { transform: scale(.9); opacity: .35; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    @keyframes gridPulse {
      0%, 100% { transform: scale(.7); opacity: .4; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    @media (max-width: 1100px) {
      .grid { grid-template-columns: repeat(3, 1fr); }
      .topbar { align-items: flex-start; flex-direction: column; }
      .search-box { width: 100%; }
      .menu { width: 100%; }
    }

    @media (max-width: 760px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
      .content-header { display: block; }
      .count-pill { display: inline-block; margin-top: 12px; }
    }

    @media (max-width: 520px) {
      .page { padding: 12px; }
      .topbar { top: 10px; border-radius: 20px; }
      .menu a { height: 42px; padding: 0 13px; font-size: 13px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <div class="page">
    <header class="topbar">
      <div class="search-box">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2.2"/>
          <path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <input id="searchInput" type="text" placeholder="Search effect..." />
      </div>

      <nav class="menu">
        <a href="text-animation.html">Text</a>
        <a href="button-animation.html">Button</a>
        <a href="hover-effects.html">Hover</a>
        <a href="card-effects.html">Card</a>
        <a href="ui-motion.html">UI Motion</a>
        <a href="badge-label-effects.html">Badge</a>
        <a class="active" href="loader-effects.html">Loader</a>
        <a href="input-focus-effects.html">Input</a>
        <a href="cursor-effects.html">Cursor</a>
        <a href="background-effects.html">Background</a>
      </nav>

    <main>

    const grid = document.getElementById("grid");
    const searchInput = document.getElementById("searchInput");
    const countPill = document.getElementById("countPill");
    const emptyState = document.getElementById("emptyState");

    effects.forEach((effect, index) => {
      effect.id = String(index);
    });

    function copyIcon() {
      return `
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <rect x="9" y="9" width="10" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
          <rect x="5" y="5" width="10" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
        </svg>
      `;
    }

    function renderCards(list) {
      grid.innerHTML = "";

      list.forEach(effect => {
        const card = document.createElement("div");
        card.className = "card";
        card.dataset.search = `${effect.name} ${effect.about} ${effect.className}`.toLowerCase();

        card.innerHTML = `
          <div class="preview">${effect.html}</div>
          <div class="card-body">
            <div class="name-row">
              <h3>${effect.name}</h3>
              <button class="copy-btn" data-id="${effect.id}" title="Copy code">
                ${copyIcon()}
              </button>
            </div>
            <p>${effect.about}</p>
          </div>
        `;

        grid.appendChild(card);
      });

      document.querySelectorAll(".copy-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          copyCode(btn.dataset.id);
        });
      });

      countPill.textContent = list.length + " Effects";
      emptyState.style.display = list.length ? "none" : "block";
    }

    function copyCode(id) {
      const effect = effects.find(item => item.id === id);

      if (!effect) {
        showToast("Code not found");
        return;
      }

      const code = `${effect.html}

<style>
${effect.css}
</style>`;

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(code).then(() => {
          showToast("Code copied");
        }).catch(() => {
          fallbackCopy(code);
        });
      } else {
        fallbackCopy(code);
      }
    }

    function fallbackCopy(text) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      textarea.style.top = "-9999px";
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();

      try {
        document.execCommand("copy");
        showToast("Code copied");
      } catch (err) {
        showToast("Copy failed");
      }

      document.body.removeChild(textarea);
    }

    function showToast(message) {
      const oldToast = document.querySelector(".toast");
      if (oldToast) oldToast.remove();

      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = message;
      document.body.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.add("show");
      });

      setTimeout(() => {
        toast.classList.remove("show");
        setTimeout(() => toast.remove(), 250);
      }, 1500);
    }

    searchInput.addEventListener("input", () => {
      const value = searchInput.value.trim().toLowerCase();

      const filtered = effects.filter(effect => {
        return (
          effect.name.toLowerCase().includes(value) ||
          effect.about.toLowerCase().includes(value) ||
          effect.className.toLowerCase().includes(value)
        );
      });

      renderCards(filtered);
    });

    renderCards(effects);
  </script>
