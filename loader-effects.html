<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loader Effects</title>

  <style>
    :root {
      --bg: #000;
      --border: rgba(255,255,255,0.14);
      --text: #fff;
      --muted: rgba(255,255,255,0.58);
      --blue: #4f8cff;
      --purple: #8d6bff;
      --green: #35c759;
      --red: #ff5f57;
      --yellow: #ffbd2e;
      --orange: #ff9f0a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,0.15), transparent 24%),
        radial-gradient(circle at 18% 28%, rgba(79,140,255,0.11), transparent 28%),
        linear-gradient(180deg, #000, #050505 55%, #090909);
      color: var(--text);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.024) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.024) 1px, transparent 1px);
      background-size: 70px 70px;
      mask-image: radial-gradient(circle at center, black, transparent 75%);
      z-index: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(100%, 1560px);
      margin: 0 auto;
      padding: 22px;
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 16px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px;
      border-radius: 24px;
      background: rgba(20,20,20,0.78);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(26px);
      box-shadow: 0 20px 70px rgba(0,0,0,0.46);
      margin-bottom: 30px;
    }

    .search-box {
      width: 280px;
      height: 46px;
      border-radius: 16px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.12);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      flex: 0 0 auto;
    }

    .search-box svg {
      color: rgba(255,255,255,0.58);
      flex: 0 0 auto;
    }

    .search-box input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font-size: 14px;
      font-weight: 750;
    }

    .search-box input::placeholder {
      color: rgba(255,255,255,0.45);
    }

    .menu {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      flex: 1;
    }

    .menu::-webkit-scrollbar {
      display: none;
    }

    .menu a {
      height: 46px;
      padding: 0 16px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.68);
      font-size: 14px;
      font-weight: 850;
      border: 1px solid transparent;
      white-space: nowrap;
      transition: 180ms ease;
    }

    .menu a:hover,
    .menu a.active {
      background: rgba(255,255,255,0.11);
      border-color: rgba(255,255,255,0.12);
      color: white;
    }

    .menu a.active {
      background: rgba(79,140,255,0.22);
      border-color: rgba(79,140,255,0.38);
    }

    .content-header {
      margin-bottom: 24px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
    }

    .title-block h1 {
      font-size: clamp(34px, 4.8vw, 64px);
      line-height: 0.95;
      letter-spacing: -0.065em;
      font-weight: 950;
      margin-bottom: 10px;
    }

    .title-block p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
      font-weight: 650;
      max-width: 760px;
    }

    .count-pill {
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.74);
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
      padding-bottom: 35px;
    }

    .card {
      min-height: 238px;
      border-radius: 24px;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,0.12), transparent 50%),
        linear-gradient(180deg, rgba(255,255,255,0.09), rgba(255,255,255,0.04));
      border: 1px solid var(--border);
      overflow: hidden;
      transition: 220ms ease;
      box-shadow: 0 18px 50px rgba(0,0,0,0.25);
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(255,255,255,0.24);
      box-shadow: 0 28px 80px rgba(0,0,0,0.44);
    }

    .preview {
      height: 138px;
      display: grid;
      place-items: center;
      padding: 18px;
      border-bottom: 1px solid rgba(255,255,255,0.09);
      background: rgba(0,0,0,0.20);
      overflow: hidden;
      position: relative;
      perspective: 900px;
    }

    .loader-demo {
      position: relative;
      display: grid;
      place-items: center;
      color: white;
      font-weight: 950;
    }

    .card-body {
      padding: 15px;
    }

    .name-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .name-row h3 {
      font-size: 16px;
      line-height: 1.12;
      letter-spacing: -0.03em;
      font-weight: 900;
    }

    .copy-btn {
      width: 36px;
      height: 36px;
      border-radius: 13px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.085);
      color: white;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex: 0 0 auto;
      transition: 180ms ease;
    }

    .copy-btn:hover {
      background: rgba(79,140,255,0.95);
      border-color: rgba(79,140,255,0.95);
      transform: translateY(-2px);
    }

    .card-body p {
      color: rgba(255,255,255,0.55);
      font-size: 12.5px;
      line-height: 1.45;
      font-weight: 650;
    }

    .empty {
      padding: 24px;
      border-radius: 22px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.72);
      text-align: center;
      font-weight: 750;
      margin-bottom: 20px;
      display: none;
    }

    .load-status {
      margin: 0 auto 70px;
      width: fit-content;
      padding: 12px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.65);
      font-size: 12px;
      font-weight: 850;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%) translateY(18px);
      padding: 13px 18px;
      border-radius: 16px;
      background: rgba(255,255,255,0.93);
      color: #111;
      font-size: 13px;
      font-weight: 850;
      box-shadow: 0 18px 60px rgba(0,0,0,0.45);
      opacity: 0;
      pointer-events: none;
      transition: 220ms ease;
      z-index: 9999;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 1280px) {
      .grid { grid-template-columns: repeat(4, 1fr); }
    }

    @media (max-width: 1100px) {
      .grid { grid-template-columns: repeat(3, 1fr); }
      .topbar { align-items: flex-start; flex-direction: column; }
      .search-box { width: 100%; }
      .menu { width: 100%; }
    }

    @media (max-width: 760px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
      .content-header { display: block; }
      .count-pill { display: inline-block; margin-top: 12px; }
    }

    @media (max-width: 520px) {
      .page { padding: 12px; }
      .topbar { top: 10px; border-radius: 20px; }
      .menu a { height: 42px; padding: 0 13px; font-size: 13px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <div class="page">
    <header class="topbar">
      <div class="search-box">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2.2"/>
          <path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <input id="searchInput" type="text" placeholder="Search effect..." />
      </div>

      <nav class="menu" id="mainMenu"></nav>
    </header>

    <main>
      <header class="content-header">
        <div class="title-block">
          <h1>Loader Effects</h1>
          <p>100 live loader and skeleton effects for spinners, progress bars, dots, rings, scanning, typing, AI loading, and premium app states.</p>
        </div>

        <div class="count-pill" id="countPill">0 Effects</div>
      </header>

      <div id="emptyState" class="empty">
        No effect found. Try searching “spinner”, “dots”, “skeleton”, “progress”, “ring”, “scan”, or “typing”.
      </div>

      <section id="grid" class="grid"></section>

      <div id="loadStatus" class="load-status">Showing 0 of 100 effects</div>
    </main>
  </div>

  <style id="dynamicEffectStyles"></style>

  <script src="nav.js"></script>

  <script>
    const effects = [];

    const baseLoaderCSS = `.loader-demo {
  position: relative;
  display: grid;
  place-items: center;
  color: white;
  font-weight: 950;
}`;

    const commonKeyframes = `
@keyframes loaderSpin { to { transform: rotate(360deg); } }
@keyframes loaderReverseSpin { to { transform: rotate(-360deg); } }
@keyframes loaderPulse { 0%,100%{transform:scale(1);opacity:.65;} 50%{transform:scale(1.18);opacity:1;} }
@keyframes loaderBounce { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-14px);} }
@keyframes loaderFade { 0%,100%{opacity:.25;} 50%{opacity:1;} }
@keyframes loaderGlow { 0%,100%{box-shadow:0 0 0 rgba(79,140,255,0);} 50%{box-shadow:0 0 28px rgba(79,140,255,.75);} }
@keyframes loaderShimmer { to{background-position:-220% center;} }
@keyframes loaderGradient { 0%,100%{background-position:0% center;} 50%{background-position:100% center;} }
@keyframes loaderProgress { 0%{transform:translateX(-120%);} 50%{transform:translateX(80%);} 100%{transform:translateX(260%);} }
@keyframes loaderScan { 0%,100%{top:0;} 50%{top:calc(100% - 3px);} }
@keyframes loaderDotWave { 0%,100%{transform:translateY(0);opacity:.45;} 50%{transform:translateY(-12px);opacity:1;} }
@keyframes loaderBars { 0%,100%{height:18px;opacity:.45;} 50%{height:48px;opacity:1;} }
@keyframes loaderScaleDot { 0%,100%{transform:scale(.65);opacity:.45;} 50%{transform:scale(1.25);opacity:1;} }
@keyframes loaderPing { 0%{box-shadow:0 0 0 0 rgba(79,140,255,.7);} 70%{box-shadow:0 0 0 22px rgba(79,140,255,0);} 100%{box-shadow:0 0 0 0 rgba(79,140,255,0);} }
@keyframes loaderFlip { 0%{transform:rotateX(0) rotateY(0);} 50%{transform:rotateX(180deg) rotateY(0);} 100%{transform:rotateX(180deg) rotateY(180deg);} }
@keyframes loaderCube { 0%{transform:rotate(0) scale(1);} 50%{transform:rotate(180deg) scale(.82);} 100%{transform:rotate(360deg) scale(1);} }
@keyframes loaderTypingDots { 0%{content:"";} 25%{content:".";} 50%{content:"..";} 75%,100%{content:"...";} }
`;

    function addEffect(name, about, className, css, html) {
      effects.push({
        id: String(effects.length),
        name,
        about,
        className,
        html: html || `<div class="loader-demo ${className}"></div>`,
        css
      });
    }

    addEffect("Classic Spinner", "Simple circular spinner with top stroke.", "loader-classic-spinner", `.loader-classic-spinner{width:58px;height:58px;border-radius:50%;border:5px solid rgba(255,255,255,.15);border-top-color:#4f8cff;animation:loaderSpin .9s linear infinite;}`);
    addEffect("Dual Ring Spinner", "Two-color ring spinner.", "loader-dual-ring", `.loader-dual-ring{width:60px;height:60px;border-radius:50%;border:5px solid transparent;border-top-color:#4f8cff;border-bottom-color:#8d6bff;animation:loaderSpin 1s linear infinite;}`);
    addEffect("Triple Ring Spinner", "Three layered spinning rings.", "loader-triple-ring", `.loader-triple-ring{width:66px;height:66px;border-radius:50%;border:4px solid transparent;border-top-color:#4f8cff;animation:loaderSpin 1.2s linear infinite;} .loader-triple-ring::before,.loader-triple-ring::after{content:"";position:absolute;border-radius:50%;border:4px solid transparent;} .loader-triple-ring::before{inset:8px;border-top-color:#8d6bff;animation:loaderReverseSpin .9s linear infinite;} .loader-triple-ring::after{inset:18px;border-top-color:#35c759;animation:loaderSpin .7s linear infinite;}`);
    addEffect("Thin Spinner", "Thin minimal circular loader.", "loader-thin-spinner", `.loader-thin-spinner{width:62px;height:62px;border-radius:50%;border:2px solid rgba(255,255,255,.14);border-top-color:#fff;animation:loaderSpin 1s linear infinite;}`);
    addEffect("Thick Spinner", "Thick bold app spinner.", "loader-thick-spinner", `.loader-thick-spinner{width:58px;height:58px;border-radius:50%;border:8px solid rgba(255,255,255,.12);border-top-color:#4f8cff;animation:loaderSpin .85s linear infinite;}`);
    addEffect("Gradient Spinner", "Gradient-style spinning ring.", "loader-gradient-spinner", `.loader-gradient-spinner{width:62px;height:62px;border-radius:50%;background:conic-gradient(from 0deg,#4f8cff,#8d6bff,transparent 70%);animation:loaderSpin 1s linear infinite;} .loader-gradient-spinner::after{content:"";position:absolute;inset:7px;border-radius:50%;background:#0b0b0b;}`);
    addEffect("Glow Spinner", "Spinner with blue glow pulse.", "loader-glow-spinner", `.loader-glow-spinner{width:58px;height:58px;border-radius:50%;border:5px solid rgba(79,140,255,.16);border-top-color:#4f8cff;animation:loaderSpin .9s linear infinite, loaderGlow 1.6s ease-in-out infinite;}`);
    addEffect("Dashed Spinner", "Dashed circular rotating loader.", "loader-dashed-spinner", `.loader-dashed-spinner{width:60px;height:60px;border-radius:50%;border:4px dashed rgba(79,140,255,.85);animation:loaderSpin 1.4s linear infinite;}`);
    addEffect("Segment Spinner", "Segmented stroke rotating loader.", "loader-segment-spinner", `.loader-segment-spinner{width:62px;height:62px;border-radius:50%;background:conic-gradient(#4f8cff 0 70deg, transparent 70deg 120deg, #8d6bff 120deg 190deg, transparent 190deg 260deg, #35c759 260deg 330deg, transparent 330deg);animation:loaderSpin 1.1s linear infinite;} .loader-segment-spinner::after{content:"";position:absolute;inset:8px;border-radius:50%;background:#0b0b0b;}`);
    addEffect("Apple Spinner", "Clean Apple-like spinner dots.", "loader-apple-spinner", `.loader-apple-spinner{width:64px;height:64px;border-radius:50%;animation:loaderSpin 1s linear infinite;} .loader-apple-spinner::before{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:white;top:0;left:50%;transform:translateX(-50%);box-shadow:22px 10px 0 rgba(255,255,255,.8),28px 32px 0 rgba(255,255,255,.65),12px 52px 0 rgba(255,255,255,.5),-12px 52px 0 rgba(255,255,255,.35),-28px 32px 0 rgba(255,255,255,.25),-22px 10px 0 rgba(255,255,255,.15);}`);

    addEffect("Bouncing Dots", "Three dots bounce one after another.", "loader-bouncing-dots", `.loader-bouncing-dots{display:flex;gap:8px;align-items:center;} .loader-bouncing-dots i{width:12px;height:12px;border-radius:50%;background:#4f8cff;animation:loaderDotWave .9s ease-in-out infinite;} .loader-bouncing-dots i:nth-child(2){animation-delay:.15s;} .loader-bouncing-dots i:nth-child(3){animation-delay:.3s;}`, `<div class="loader-demo loader-bouncing-dots"><i></i><i></i><i></i></div>`);
    addEffect("Scaling Dots", "Dots scale one by one.", "loader-scaling-dots", `.loader-scaling-dots{display:flex;gap:8px;} .loader-scaling-dots i{width:13px;height:13px;border-radius:50%;background:#8d6bff;animation:loaderScaleDot .9s ease-in-out infinite;} .loader-scaling-dots i:nth-child(2){animation-delay:.15s;} .loader-scaling-dots i:nth-child(3){animation-delay:.3s;}`, `<div class="loader-demo loader-scaling-dots"><i></i><i></i><i></i></div>`);
    addEffect("Fading Dots", "Dots fade in sequence.", "loader-fading-dots", `.loader-fading-dots{display:flex;gap:8px;} .loader-fading-dots i{width:13px;height:13px;border-radius:50%;background:white;animation:loaderFade 1s ease-in-out infinite;} .loader-fading-dots i:nth-child(2){animation-delay:.18s;} .loader-fading-dots i:nth-child(3){animation-delay:.36s;}`, `<div class="loader-demo loader-fading-dots"><i></i><i></i><i></i></div>`);
    addEffect("Pulse Dot", "Single dot with ping pulse.", "loader-pulse-dot", `.loader-pulse-dot{width:20px;height:20px;border-radius:50%;background:#4f8cff;animation:loaderPing 1.3s ease-out infinite;}`);
    addEffect("Double Pulse Dot", "Two pulsing dots side by side.", "loader-double-pulse", `.loader-double-pulse{display:flex;gap:16px;} .loader-double-pulse i{width:18px;height:18px;border-radius:50%;background:#4f8cff;animation:loaderPing 1.3s ease-out infinite;} .loader-double-pulse i:nth-child(2){animation-delay:.45s;background:#8d6bff;}`, `<div class="loader-demo loader-double-pulse"><i></i><i></i></div>`);
    addEffect("Dot Orbit", "Small dot orbits around ring.", "loader-dot-orbit", `.loader-dot-orbit{width:64px;height:64px;border-radius:50%;border:1px solid rgba(255,255,255,.16);animation:loaderSpin 1.3s linear infinite;} .loader-dot-orbit::before{content:"";position:absolute;top:-6px;left:50%;width:12px;height:12px;border-radius:50%;background:#4f8cff;box-shadow:0 0 20px rgba(79,140,255,.9);transform:translateX(-50%);}`);
    addEffect("Multi Dot Orbit", "Multiple dots orbit together.", "loader-multi-dot-orbit", `.loader-multi-dot-orbit{width:64px;height:64px;border-radius:50%;animation:loaderSpin 1.2s linear infinite;} .loader-multi-dot-orbit i{position:absolute;width:10px;height:10px;border-radius:50%;background:#4f8cff;left:50%;top:50%;transform-origin:0 0;} .loader-multi-dot-orbit i:nth-child(1){transform:rotate(0deg) translate(26px);} .loader-multi-dot-orbit i:nth-child(2){transform:rotate(90deg) translate(26px);opacity:.75;} .loader-multi-dot-orbit i:nth-child(3){transform:rotate(180deg) translate(26px);opacity:.5;} .loader-multi-dot-orbit i:nth-child(4){transform:rotate(270deg) translate(26px);opacity:.25;}`, `<div class="loader-demo loader-multi-dot-orbit"><i></i><i></i><i></i><i></i></div>`);
    addEffect("Circle Dots", "Five dots rotate in circle.", "loader-circle-dots", `.loader-circle-dots{width:64px;height:64px;animation:loaderSpin 1.2s linear infinite;} .loader-circle-dots i{position:absolute;width:10px;height:10px;border-radius:50%;background:#4f8cff;left:50%;top:50%;transform-origin:0 0;} .loader-circle-dots i:nth-child(1){transform:rotate(0deg) translate(24px);opacity:1;} .loader-circle-dots i:nth-child(2){transform:rotate(72deg) translate(24px);opacity:.8;} .loader-circle-dots i:nth-child(3){transform:rotate(144deg) translate(24px);opacity:.6;} .loader-circle-dots i:nth-child(4){transform:rotate(216deg) translate(24px);opacity:.4;} .loader-circle-dots i:nth-child(5){transform:rotate(288deg) translate(24px);opacity:.2;}`, `<div class="loader-demo loader-circle-dots"><i></i><i></i><i></i><i></i><i></i></div>`);
    addEffect("Typing Bubble", "Chat typing bubble dots.", "loader-typing-bubble", `.loader-typing-bubble{width:76px;height:36px;border-radius:999px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;gap:7px;} .loader-typing-bubble i{width:8px;height:8px;border-radius:50%;background:white;animation:loaderDotWave 1.2s ease-in-out infinite;} .loader-typing-bubble i:nth-child(2){animation-delay:.18s;} .loader-typing-bubble i:nth-child(3){animation-delay:.36s;}`, `<div class="loader-demo loader-typing-bubble"><i></i><i></i><i></i></div>`);

    addEffect("Wave Bars", "Vertical bars move like audio wave.", "loader-wave-bars", `.loader-wave-bars{display:flex;align-items:center;gap:5px;height:54px;} .loader-wave-bars i{width:7px;height:16px;border-radius:999px;background:white;animation:loaderBars 1.1s ease-in-out infinite;} .loader-wave-bars i:nth-child(2){animation-delay:.1s;} .loader-wave-bars i:nth-child(3){animation-delay:.2s;} .loader-wave-bars i:nth-child(4){animation-delay:.3s;} .loader-wave-bars i:nth-child(5){animation-delay:.4s;}`, `<div class="loader-demo loader-wave-bars"><i></i><i></i><i></i><i></i><i></i></div>`);
    addEffect("Equalizer Bars", "Equalizer-style loading bars.", "loader-equalizer", `.loader-equalizer{display:flex;align-items:center;gap:6px;height:54px;} .loader-equalizer i{width:8px;height:22px;border-radius:999px;background:#4f8cff;animation:loaderBars 1s ease-in-out infinite;} .loader-equalizer i:nth-child(2){animation-delay:.12s;} .loader-equalizer i:nth-child(3){animation-delay:.24s;} .loader-equalizer i:nth-child(4){animation-delay:.36s;}`, `<div class="loader-demo loader-equalizer"><i></i><i></i><i></i><i></i></div>`);

    addEffect("Chat Loading", "Chat message loading bubble.", "loader-chat-loading", `.loader-chat-loading{width:112px;height:42px;border-radius:20px 20px 20px 8px;background:rgba(79,140,255,.18);border:1px solid rgba(79,140,255,.35);display:flex;align-items:center;justify-content:center;gap:6px;} .loader-chat-loading i{width:7px;height:7px;border-radius:50%;background:white;animation:loaderDotWave 1s infinite;} .loader-chat-loading i:nth-child(2){animation-delay:.15s;} .loader-chat-loading i:nth-child(3){animation-delay:.3s;}`, `<div class="loader-demo loader-chat-loading"><i></i><i></i><i></i></div>`);
    addEffect("Notification Loading", "Notification pill loading state.", "loader-notification", `.loader-notification{width:118px;height:42px;border-radius:999px;background:rgba(255,255,255,.1);animation:loaderPulse 1.5s infinite;} .loader-notification::after{content:"Notify";}`);
    addEffect("Search Loading", "Search bar scanning loader.", "loader-search", `.loader-search{width:132px;height:42px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;} .loader-search::before{content:"";position:absolute;left:14px;width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#4f8cff;animation:loaderSpin .8s infinite;} .loader-search::after{content:"";position:absolute;left:44px;width:64px;height:8px;border-radius:999px;background:rgba(255,255,255,.18);}`);
    addEffect("Input Loading", "Input field shimmer loading.", "loader-input", `.loader-input{width:132px;height:42px;border-radius:14px;background:linear-gradient(90deg,rgba(255,255,255,.07),rgba(255,255,255,.23),rgba(255,255,255,.07));background-size:220%;animation:loaderShimmer 1.4s infinite;}`);
    addEffect("Avatar Loading", "Profile avatar loading ring.", "loader-avatar", `.loader-avatar{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.08);} .loader-avatar::before{content:"";position:absolute;inset:-4px;border-radius:50%;border:4px solid transparent;border-top-color:#4f8cff;animation:loaderSpin 1s linear infinite;}`);

    addEffect("Final Premium Loader", "Premium gradient ring with glow and shine.", "loader-final-premium", `.loader-final-premium{width:68px;height:68px;border-radius:50%;background:conic-gradient(from 0deg,#4f8cff,#8d6bff,#4f8cff,transparent 75%);animation:loaderSpin 1s linear infinite,loaderFinalGlow 1.8s ease-in-out infinite;} .loader-final-premium::after{content:"";position:absolute;inset:8px;border-radius:50%;background:#0b0b0b;} @keyframes loaderFinalGlow{0%,100%{box-shadow:0 0 0 rgba(79,140,255,0);}50%{box-shadow:0 0 34px rgba(79,140,255,.75);}}`);

    const grid = document.getElementById("grid");
    const searchInput = document.getElementById("searchInput");
    const countPill = document.getElementById("countPill");
    const emptyState = document.getElementById("emptyState");
    const loadStatus = document.getElementById("loadStatus");
    const dynamicEffectStyles = document.getElementById("dynamicEffectStyles");

    const batchSize = 20;
    let visibleCount = batchSize;
    let filteredEffects = [...effects];
    let isLoadingMore = false;

    dynamicEffectStyles.textContent = commonKeyframes + "\n\n" + effects.map(effect => effect.css).join("\n\n");

    function copyIcon() {
      return `
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <rect x="9" y="9" width="10" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
          <rect x="5" y="5" width="10" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
        </svg>
      `;
    }

    function renderCards() {
      grid.innerHTML = "";

      const visibleEffects = filteredEffects.slice(0, visibleCount);

      visibleEffects.forEach(effect => {
        const card = document.createElement("div");
        card.className = "card";
        card.dataset.search = `${effect.name} ${effect.about} ${effect.className}`.toLowerCase();

        card.innerHTML = `
          <div class="preview">${effect.html}</div>
          <div class="card-body">
            <div class="name-row">
              <h3>${effect.name}</h3>
              <button class="copy-btn" data-id="${effect.id}" title="Copy code">
                ${copyIcon()}
              </button>
            </div>
            <p>${effect.about}</p>
          </div>
        `;

        grid.appendChild(card);
      });

      document.querySelectorAll(".copy-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          copyCode(btn.dataset.id);
        });
      });

      emptyState.style.display = filteredEffects.length ? "none" : "block";
      countPill.textContent = filteredEffects.length + " Effects";

      const shown = Math.min(visibleCount, filteredEffects.length);
      loadStatus.textContent = `Showing ${shown} of ${filteredEffects.length} effects`;

      if (filteredEffects.length === 0) {
        loadStatus.style.display = "none";
      } else {
        loadStatus.style.display = "block";
      }
    }

    function copyCode(id) {
      const effect = effects.find(item => item.id === id);

      if (!effect) {
        showToast("Code not found");
        return;
      }

      const code = `${effect.html}

<style>
${baseLoaderCSS}

${commonKeyframes}

${effect.css}
</style>`;

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(code).then(() => {
          showToast("Code copied");
        }).catch(() => {
          fallbackCopy(code);
        });
      } else {
        fallbackCopy(code);
      }
    }

    function fallbackCopy(text) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      textarea.style.top = "-9999px";
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();

      try {
        document.execCommand("copy");
        showToast("Code copied");
      } catch (err) {
        showToast("Copy failed");
      }

      document.body.removeChild(textarea);
    }

    function showToast(message) {
      const oldToast = document.querySelector(".toast");
      if (oldToast) oldToast.remove();

      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = message;
      document.body.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.add("show");
      });

      setTimeout(() => {
        toast.classList.remove("show");
        setTimeout(() => toast.remove(), 250);
      }, 1500);
    }

    function applySearch() {
      const value = searchInput.value.trim().toLowerCase();

      filteredEffects = effects.filter(effect => {
        return (
          effect.name.toLowerCase().includes(value) ||
          effect.about.toLowerCase().includes(value) ||
          effect.className.toLowerCase().includes(value)
        );
      });

      visibleCount = batchSize;
      renderCards();
    }

    function loadMoreOnScroll() {
      if (isLoadingMore) return;
      if (visibleCount >= filteredEffects.length) return;

      const nearBottom = window.innerHeight + window.scrollY >= document.body.offsetHeight - 450;

      if (nearBottom) {
        isLoadingMore = true;

        setTimeout(() => {
          visibleCount += batchSize;
          renderCards();
          isLoadingMore = false;
        }, 180);
      }
    }

    searchInput.addEventListener("input", applySearch);
    window.addEventListener("scroll", loadMoreOnScroll);

    renderCards();
  </script>
</body>
</html>
