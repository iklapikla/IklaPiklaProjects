<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Screen Recorder Pro (MP4)</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Arial, sans-serif;
    }

    :root {
      --text: #ffffff;
      --muted: rgba(255,255,255,0.48);
      --dock: rgba(244, 244, 246, 0.94);
      --dock-border: rgba(255,255,255,0.75);
      --chip: rgba(255,255,255,0.92);
      --chip-hover: #ffffff;
      --chip-border: rgba(0,0,0,0.08);
      --black-text: #1d1d1f;
      --grey-text: #7a7a80;
      --blue: #3b82f6;
      --blue-dark: #2563eb;
      --green: #34c759;
      --red: #ff453a;
      --purple: #a855f7;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    .app {
      width: 100vw;
      height: 100vh;
      position: relative;
      background:
        radial-gradient(circle at 50% 32%, rgba(255,255,255,0.09), transparent 22%),
        radial-gradient(circle at 50% 100%, rgba(255,255,255,0.035), transparent 32%),
        #000;
      overflow: hidden;
    }

    video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      z-index: 1;
      display: none;
    }

    .idle-overlay, .recording-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      pointer-events: none;
      padding: 40px;
    }

    .idle-overlay {
      background:
        radial-gradient(circle at 50% 32%, rgba(255,255,255,0.09), transparent 22%),
        radial-gradient(circle at 50% 100%, rgba(255,255,255,0.035), transparent 32%),
        #000;
    }

    .recording-overlay {
      display: none;
      z-index: 3;
      background: radial-gradient(circle at 50% 32%, rgba(255,69,58,0.11), transparent 20%), #000;
    }

    .idle-content, .recording-card {
      position: relative;
      transform: translateY(-60px);
      animation: fadeUp 0.7s ease both;
      isolation: isolate;
    }

    .idle-content h1, .recording-card h2 {
      margin: 0;
      color: #fff;
      font-size: clamp(46px, 5vw, 76px);
      font-weight: 820;
      letter-spacing: -3px;
      line-height: 0.96;
    }

    .recording-card h2 {
      text-shadow: 0 8px 30px rgba(0,0,0,0.4), 0 0 36px rgba(255,69,58,0.18);
    }

    .idle-content p, .recording-card p {
      margin: 20px 0 0;
      color: var(--muted);
      font-size: clamp(15px, 1.5vw, 20px);
      line-height: 1.45;
      font-weight: 520;
    }

    .recording-dot-large {
      width: 20px;
      height: 20px;
      border-radius: 999px;
      background: var(--red);
      margin: 0 auto 22px;
      box-shadow: 0 0 0 12px rgba(255,69,58,0.14);
      animation: livePulse 1.25s infinite;
    }

    /* Floating Subtitle Box */
    .transcript-box {
      position: absolute;
      bottom: 200px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 14px 28px;
      border-radius: 20px;
      max-width: 85%;
      text-align: center;
      font-size: 20px;
      font-weight: 600;
      backdrop-filter: blur(16px);
      z-index: 5;
      display: none;
      box-shadow: 0 20px 45px rgba(0,0,0,0.5);
    }

    @keyframes livePulse {
      0% { box-shadow: 0 0 0 0 rgba(255,69,58,0.32); }
      70% { box-shadow: 0 0 0 18px rgba(255,69,58,0); }
      100% { box-shadow: 0 0 0 0 rgba(255,69,58,0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(-32px) scale(0.98); }
      to { opacity: 1; transform: translateY(-60px) scale(1); }
    }

    .control-dock {
      position: absolute;
      left: 50%;
      bottom: 50px;
      transform: translateX(-50%);
      z-index: 10;
      width: auto;
      max-width: min(1050px, calc(100vw - 42px));
      min-height: 70px;
      padding: 8px;
      border-radius: 24px;
      background: var(--dock);
      border: 1px solid var(--dock-border);
      box-shadow: 0 24px 70px rgba(0,0,0,0.38), inset 0 1px 0 rgba(255,255,255,0.95);
      backdrop-filter: blur(28px) saturate(1.45);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .chip {
      height: 50px;
      border-radius: 16px;
      background: var(--chip);
      border: 1px solid var(--chip-border);
      box-shadow: 0 8px 22px rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 11px;
      transition: transform 0.18s ease, background 0.18s ease;
      flex-shrink: 0;
    }

    .chip:hover {
      transform: scale(1.02);
      background: var(--chip-hover);
    }

    .chip-select {
      border: none;
      background: transparent;
      font-size: 12px;
      font-weight: 850;
      color: var(--black-text);
      cursor: pointer;
      outline: none;
      padding-right: 5px;
    }

    .chip-text strong {
      display: block;
      font-size: 11.5px;
      font-weight: 850;
      color: var(--black-text);
      white-space: nowrap;
    }

    .switch {
      position: relative;
      width: 34px;
      height: 20px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      inset: 0;
      cursor: pointer;
      background: #c9c9ce;
      border-radius: 999px;
      transition: 0.2s ease;
    }

    .slider::before {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      left: 2px;
      top: 2px;
      background: #fff;
      border-radius: 999px;
      transition: 0.2s ease;
    }

    input:checked + .slider { background: linear-gradient(180deg, #63dd74, var(--green)); }
    input:checked + .slider::before { transform: translateX(14px); }

    .transcribe-active input:checked + .slider { background: linear-gradient(180deg, #c084fc, var(--purple)); }

    .record-btn {
      height: 54px;
      min-width: 150px;
      border: none;
      border-radius: 18px;
      background: linear-gradient(180deg, #4d8ef7 0%, #3478f6 100%);
      color: #fff;
      font-size: 14px;
      font-weight: 850;
      padding: 0 22px;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(59,130,246,0.34);
      transition: transform 0.18s ease;
    }

    .record-btn:hover { transform: scale(1.03); }
    .record-btn.recording { background: linear-gradient(180deg, #ff625a 0%, var(--red) 100%); animation: recordPulse 1.3s infinite; }

    @keyframes recordPulse {
      0% { box-shadow: 0 12px 30px rgba(255,69,58,0.36), 0 0 0 0 rgba(255,69,58,0.25); }
      70% { box-shadow: 0 12px 30px rgba(255,69,58,0.36), 0 0 0 12px rgba(255,69,58,0); }
      100% { box-shadow: 0 12px 30px rgba(255,69,58,0.36), 0 0 0 0 rgba(255,69,58,0); }
    }

    .timer-chip { min-width: 85px; justify-content: center; font-size: 13px; font-weight: 850; color: var(--black-text); }

    .download-btn {
      width: 52px; height: 50px; border-radius: 16px; border: 1px solid rgba(0,0,0,0.12);
      background: linear-gradient(180deg, #ffffff 0%, #f5f5f7 100%); color: #1d1d1f;
      display: grid; place-items: center; cursor: pointer; transition: transform 0.18s ease;
    }

    .download-btn:disabled { opacity: 0.38; cursor: not-allowed; }

    .toast {
      position: absolute; left: 50%; bottom: 140px; transform: translateX(-50%) translateY(12px);
      z-index: 12; background: rgba(30,30,32,0.84); color: #fff; font-size: 13px; font-weight: 720;
      padding: 10px 14px; border-radius: 999px; opacity: 0; transition: 0.25s ease; backdrop-filter: blur(18px);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    svg { width: 18px; height: 18px; display: block; }

    @media (max-width: 960px) {
      .control-dock { width: min(520px, calc(100vw - 28px)); flex-wrap: wrap; bottom: 30px; }
      .record-btn { order: 5; width: 100%; }
      .transcript-box { bottom: 280px; }
    }
  </style>
</head>

<body>
  <div class="app">
    <video id="preview" autoplay muted playsinline></video>

    <div class="transcript-box" id="transcriptBox">System & Microphone monitoring active...</div>

    <div class="idle-overlay" id="idleOverlay">
      <div class="idle-content">
        <h1>Screen Recorder</h1>
        <p>Choose 'Entire Screen' to capture with professional configuration.</p>
      </div>
    </div>

    <div class="recording-overlay" id="recordingOverlay">
      <div class="recording-card">
        <div class="recording-dot-large"></div>
        <h2>Recording Live</h2>
        <p>Dynamic track quality optimization active.</p>
      </div>
    </div>

    <div class="toast" id="toast">Ready</div>

    <section class="control-dock">
      <div class="chip">
        <div class="chip-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
        </div>
        <select class="chip-select" id="resolutionSelect">
          <option value="720">720p (HD)</option>
          <option value="1080" selected>1080p (FHD)</option>
          <option value="2k">2K (QHD)</option>
          <option value="4k">4K (UHD)</option>
        </select>
      </div>

      <div class="chip" id="desktopChip">
        <div class="chip-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 9v6h4l5 4V5L9 9H5Z"/>
          </svg>
        </div>
        <div class="chip-text"><strong>System Sound</strong></div>
        <label class="switch">
          <input type="checkbox" id="desktopAudioToggle" checked />
          <span class="slider"></span>
        </label>
      </div>

      <div class="chip" id="micChip">
        <div class="chip-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 14a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v4a4 4 0 0 0 4 4Z"/>
            <path d="M19 10a7 7 0 0 1-14 0"/>
          </svg>
        </div>
        <div class="chip-text"><strong>Mic Audio</strong></div>
        <label class="switch">
          <input type="checkbox" id="micToggle" checked />
          <span class="slider"></span>
        </label>
      </div>

      <div class="chip" id="transcribeChip">
        <div class="chip-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <div class="chip-text"><strong>Live Transcribe</strong></div>
        <label class="switch transcribe-active">
          <input type="checkbox" id="transcribeToggle" checked />
          <span class="slider"></span>
        </label>
      </div>

      <button class="record-btn" id="recordBtn">Start Recording</button>
      <div class="chip timer-chip" id="timerText">00:00:00</div>

      <button class="download-btn" id="downloadBtn" disabled title="Download">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 4v10M8 11l4 4 4-4M5 20h14"/>
        </svg>
      </button>
    </section>
  </div>

  <script>
    let mediaRecorder = null;
    let recordedChunks = [];
    let combinedStream = null;
    let screenStream = null;
    let micStream = null;
    
    let desktopTrack = null;
    let micTrack = null;

    let audioContext = null;
    let audioDestination = null;
    let processorNode = null;
    let finalBlobUrl = null;
    let lastBlob = null;
    let timerInterval = null;
    let recordingStartTime = 0;
    let isRecording = false;

    // Speech Engine Setup
    let recognition = null;
    let transcribedText = ""; 

    const preview = document.getElementById("preview");
    const idleOverlay = document.getElementById("idleOverlay");
    const recordingOverlay = document.getElementById("recordingOverlay");
    const recordBtn = document.getElementById("recordBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const desktopAudioToggle = document.getElementById("desktopAudioToggle");
    const micToggle = document.getElementById("micToggle");
    const transcribeToggle = document.getElementById("transcribeToggle");
    const resolutionSelect = document.getElementById("resolutionSelect");
    const timerText = document.getElementById("timerText");
    const toast = document.getElementById("toast");
    const transcriptBox = document.getElementById("transcriptBox");

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'hi-IN'; // Mix Hindi-English tracking

      recognition.onresult = (event) => {
        let interimTranscript = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            transcribedText += event.results[i][0].transcript + ' ';
          } else {
            interimTranscript += event.results[i][0].transcript;
          }
        }
        transcriptBox.textContent = interimTranscript || "Listening to speaker + mic channels...";
      };

      recognition.onerror = (e) => {
        console.warn("Engine feedback error:", e);
        if ((e.error === 'no-speech' || e.error === 'aborted') && isRecording) {
          try { recognition.start(); } catch(err) {}
        }
      };
    } else {
      document.getElementById("transcribeChip").style.opacity = "0.4";
      transcribeToggle.disabled = true;
    }

    desktopAudioToggle.addEventListener("change", () => {
      if (desktopTrack) {
        desktopTrack.enabled = desktopAudioToggle.checked;
        showToast(desktopAudioToggle.checked ? "System sound active" : "System sound muted");
      }
    });

    micToggle.addEventListener("change", () => {
      if (micTrack) {
        micTrack.enabled = micToggle.checked;
        showToast(micToggle.checked ? "Microphone active" : "Microphone muted");
      }
    });

    recordBtn.addEventListener("click", () => {
      if (isRecording) stopRecording(); 
      else startRecording();
    });

    downloadBtn.addEventListener("click", () => downloadRecording(false));

    function getResolutionSettings(val) {
      switch(val) {
        case "720":  return { width: 1280, height: 720, bitrate: 5000000 };
        case "2k":   return { width: 2560, height: 1440, bitrate: 18000000 };
        case "4k":   return { width: 3840, height: 2160, bitrate: 35000000 };
        case "1080":
        default:     return { width: 1920, height: 1080, bitrate: 10000000 };
      }
    }

    async function startRecording() {
      try {
        cleanupBeforeStart();
        const resConfig = getResolutionSettings(resolutionSelect.value);

        // 1. Fetch User Microphone
        try {
          micStream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: false, noiseSuppression: true, sampleRate: 48000 }
          });
          micTrack = micStream.getAudioTracks()[0];
          if(micTrack) micTrack.enabled = micToggle.checked;
        } catch (e) {
          console.warn("Mic hardware locked.", e);
        }

        // 2. Fetch Display and System Audio capture
        screenStream = await navigator.mediaDevices.getDisplayMedia({
          video: {
            width: { ideal: resConfig.width },
            height: { ideal: resConfig.height },
            frameRate: { ideal: 60 },
            displaySurface: "monitor"
          },
          audio: true
        });

        const videoTrack = screenStream.getVideoTracks()[0];
        const finalTracks = [videoTrack];
        const audioTracksToMix = [];

        desktopTrack = screenStream.getAudioTracks()[0];
        if (desktopTrack) {
          desktopTrack.enabled = desktopAudioToggle.checked;
          audioTracksToMix.push(desktopTrack);
        }
        if (micTrack) {
          audioTracksToMix.push(micTrack);
        }

        // 3. ScriptProcessor Routing Pipeline (Bypasses security block for text notes)
        if (audioTracksToMix.length > 0) {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
          await audioContext.resume();
          audioDestination = audioContext.createMediaStreamDestination();

          audioTracksToMix.forEach(track => {
            const stream = new MediaStream([track]);
            const source = audioContext.createMediaStreamSource(stream);
            const gainNode = audioContext.createGain();
            gainNode.gain.value = 1.0; 
            source.connect(gainNode);
            gainNode.connect(audioDestination);
          });

          const mixedAudioTrack = audioDestination.stream.getAudioTracks()[0];
          if (mixedAudioTrack) {
            finalTracks.push(mixedAudioTrack);

            // Create a native script buffer stream so chrome sees it as active audio consumer
            processorNode = audioContext.createScriptProcessor(4096, 1, 1);
            const monitorSource = audioContext.createMediaStreamSource(audioDestination.stream);
            
            monitorSource.connect(processorNode);
            processorNode.connect(audioContext.destination); // Crucial fallback line to trigger recognition pipeline

            processorNode.onaudioprocess = function(e) {
              // Real-time audio buffer looping prevents Chrome from muting background tabs transcription
              const inputBuffer = e.inputBuffer.getChannelData(0);
            };
          }
        }

        combinedStream = new MediaStream(finalTracks);
        
        idleOverlay.style.display = "none";
        recordingOverlay.style.display = "flex";
        resolutionSelect.disabled = true;

        if (recognition && transcribeToggle.checked) {
          transcribedText = "";
          transcriptBox.textContent = "Analyzing real-time audio streams...";
          transcriptBox.style.display = "block";
          recognition.start();
        }

        const options = {
          videoBitsPerSecond: resConfig.bitrate,
          audioBitsPerSecond: 320000
        };

        const preferredTypes = [
          "video/mp4;codecs=h264,aac", 
          "video/mp4;codecs=avc1,mp4a",
          "video/mp4",
          "video/webm;codecs=vp9,opus"
        ];
        
        for (const type of preferredTypes) {
          if (MediaRecorder.isTypeSupported(type)) {
            options.mimeType = type;
            break;
          }
        }

        mediaRecorder = new MediaRecorder(combinedStream, options);
        mediaRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          lastBlob = new Blob(recordedChunks, { type: "video/mp4" });
          if (finalBlobUrl) URL.revokeObjectURL(finalBlobUrl);
          finalBlobUrl = URL.createObjectURL(lastBlob);

          idleOverlay.style.display = "flex";
          recordingOverlay.style.display = "none";
          transcriptBox.style.display = "none";
          downloadBtn.disabled = false;
          resolutionSelect.disabled = false;
          setRecordingUI(false);
          startTimer(false);

          if (transcribedText.trim().length > 0) {
            downloadTranscriptText(transcribedText);
          }

          downloadRecording(true);
        };

        videoTrack.onended = () => { if (isRecording) stopRecording(); };

        mediaRecorder.start(1000);
        setRecordingUI(true);
        startTimer(true);
        showToast("Recording started");

      } catch (error) {
        console.error(error);
        cleanupAllStreams();
        resolutionSelect.disabled = false;
        setRecordingUI(false);
        showToast("Recording cancelled");
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
      }
      if (recognition) {
        try { recognition.stop(); } catch(e){}
      }
      cleanupAllStreams();
    }

    function downloadRecording(isAuto) {
      if (!finalBlobUrl) return;
      const now = new Date();
      const fileName = `recording-${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}-${String(now.getHours()).padStart(2,"0")}${String(now.getMinutes()).padStart(2,"0")}.mp4`;

      const link = document.createElement("a");
      link.href = finalBlobUrl;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      if(!isAuto) showToast("Download started");
    }

    function downloadTranscriptText(text) {
      const blob = new Blob([text], { type: "text/plain" });
      const url = URL.createObjectURL(blob);
      const now = new Date();
      const fileName = `transcript-${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}.txt`;
      
      const link = document.createElement("a");
      link.href = url;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    function setRecordingUI(rec) {
      isRecording = rec;
      recordBtn.classList.toggle("recording", rec);
      recordBtn.textContent = rec ? "Stop Recording" : "Start Recording";
    }

    function startTimer(run) {
      if (timerInterval) clearInterval(timerInterval);
      if (!run) { timerText.textContent = "00:00:00"; return; }
      recordingStartTime = Date.now();
      timerInterval = setInterval(() => {
        const totalSeconds = Math.floor((Date.now() - recordingStartTime) / 1000);
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        timerText.textContent = `${String(hours).padStart(2,"0")}:${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;
      }, 1000);
    }

    function cleanupBeforeStart() {
      cleanupAllStreams();
      recordedChunks = [];
      downloadBtn.disabled = true;
    }

    function cleanupAllStreams() {
      [combinedStream, screenStream, micStream].forEach(s => {
        if (s) s.getTracks().forEach(t => t.stop());
      });
      if (processorNode) { processorNode.disconnect(); processorNode = null; }
      combinedStream = screenStream = micStream = desktopTrack = micTrack = null;
      if (audioContext) { audioContext.close().catch(()=>{}); audioContext = null; }
    }

    let toastTimer = null;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
    }
  </script>
</body>
</html>
