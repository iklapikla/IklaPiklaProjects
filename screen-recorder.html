<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Screen Recorder</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Arial, sans-serif;
    }

    :root {
      --text: #ffffff;
      --muted: rgba(255,255,255,0.48);
      --dock: rgba(244, 244, 246, 0.94);
      --dock-border: rgba(255,255,255,0.75);
      --chip: rgba(255,255,255,0.92);
      --chip-hover: #ffffff;
      --chip-border: rgba(0,0,0,0.08);
      --black-text: #1d1d1f;
      --grey-text: #7a7a80;
      --blue: #3b82f6;
      --blue-dark: #2563eb;
      --green: #34c759;
      --red: #ff453a;
      --download: #1d1d1f;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    .app {
      width: 100vw;
      height: 100vh;
      position: relative;
      background:
        radial-gradient(circle at 50% 32%, rgba(255,255,255,0.09), transparent 22%),
        radial-gradient(circle at 50% 100%, rgba(255,255,255,0.035), transparent 32%),
        #000;
      overflow: hidden;
    }

    video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      z-index: 1;
      display: none;
    }

    .idle-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      pointer-events: none;
      padding: 40px;
      background:
        radial-gradient(circle at 50% 32%, rgba(255,255,255,0.09), transparent 22%),
        radial-gradient(circle at 50% 100%, rgba(255,255,255,0.035), transparent 32%),
        #000;
    }

    .idle-content {
      transform: translateY(-60px);
      animation: fadeUp 0.7s ease both;
    }

    .idle-content h1 {
      margin: 0;
      color: #fff;
      font-size: clamp(46px, 5vw, 76px);
      font-weight: 820;
      letter-spacing: -3px;
      line-height: 0.96;
      text-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }

    .idle-content p {
      margin: 20px 0 0;
      color: var(--muted);
      font-size: clamp(15px, 1.5vw, 20px);
      line-height: 1.45;
      font-weight: 520;
    }

    .recording-overlay {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      background:
        radial-gradient(circle at 50% 32%, rgba(255,69,58,0.11), transparent 20%),
        #000;
      pointer-events: none;
    }

    .recording-card {
      transform: translateY(-60px);
    }

    .recording-dot-large {
      width: 20px;
      height: 20px;
      border-radius: 999px;
      background: var(--red);
      margin: 0 auto 22px;
      box-shadow: 0 0 0 12px rgba(255,69,58,0.14);
      animation: livePulse 1.25s infinite;
    }

    .recording-card h2 {
      margin: 0;
      color: #fff;
      font-size: clamp(42px, 4.6vw, 68px);
      font-weight: 820;
      letter-spacing: -2.7px;
      line-height: 0.96;
    }

    .recording-card p {
      margin: 18px 0 0;
      color: rgba(255,255,255,0.50);
      font-size: clamp(14px, 1.4vw, 18px);
      font-weight: 520;
    }

    @keyframes livePulse {
      0% {
        box-shadow: 0 0 0 0 rgba(255,69,58,0.32);
      }
      70% {
        box-shadow: 0 0 0 18px rgba(255,69,58,0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(255,69,58,0);
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(-32px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(-60px) scale(1);
      }
    }

    .control-dock {
      position: absolute;
      left: 50%;
      bottom: 104px;
      transform: translateX(-50%);
      z-index: 10;
      width: min(700px, calc(100vw - 42px));
      min-height: 70px;
      padding: 8px;
      border-radius: 24px;
      background: var(--dock);
      border: 1px solid var(--dock-border);
      box-shadow:
        0 24px 70px rgba(0,0,0,0.38),
        inset 0 1px 0 rgba(255,255,255,0.95);
      backdrop-filter: blur(28px) saturate(1.45);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      animation: dockIn 0.65s cubic-bezier(.2,.9,.2,1) both;
      transition: transform 0.22s ease, box-shadow 0.22s ease;
    }

    .control-dock:hover {
      transform: translateX(-50%) scale(1.012);
      box-shadow:
        0 30px 84px rgba(0,0,0,0.46),
        inset 0 1px 0 rgba(255,255,255,0.95);
    }

    @keyframes dockIn {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(24px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0) scale(1);
      }
    }

    .chip {
      height: 50px;
      border-radius: 16px;
      background: var(--chip);
      border: 1px solid var(--chip-border);
      box-shadow: 0 8px 22px rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 11px;
      transition:
        transform 0.18s ease,
        background 0.18s ease,
        box-shadow 0.18s ease,
        opacity 0.18s ease,
        filter 0.18s ease;
      flex-shrink: 0;
    }

    .chip:hover {
      transform: scale(1.045);
      background: var(--chip-hover);
      box-shadow: 0 12px 28px rgba(0,0,0,0.13);
    }

    .chip.disabled {
      opacity: 0.42;
      filter: grayscale(1);
      pointer-events: none;
    }

    .chip-icon {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      color: #68686f;
      flex: 0 0 auto;
    }

    .chip-text {
      line-height: 1;
      min-width: 0;
    }

    .chip-text strong {
      display: block;
      font-size: 11.5px;
      font-weight: 850;
      color: var(--black-text);
      white-space: nowrap;
      letter-spacing: -0.15px;
    }

    .switch {
      position: relative;
      width: 34px;
      height: 20px;
      flex: 0 0 auto;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      cursor: pointer;
      background: #c9c9ce;
      border-radius: 999px;
      transition: 0.2s ease;
    }

    .slider::before {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      left: 2px;
      top: 2px;
      background: #fff;
      border-radius: 999px;
      box-shadow: 0 2px 7px rgba(0,0,0,0.22);
      transition: 0.2s ease;
    }

    input:checked + .slider {
      background: linear-gradient(180deg, #63dd74, var(--green));
    }

    input:checked + .slider::before {
      transform: translateX(14px);
    }

    .record-btn {
      height: 54px;
      min-width: 164px;
      border: none;
      border-radius: 18px;
      background: linear-gradient(180deg, #4d8ef7 0%, #3478f6 100%);
      color: #fff;
      font-size: 15px;
      font-weight: 850;
      padding: 0 22px;
      cursor: pointer;
      box-shadow:
        0 12px 30px rgba(59,130,246,0.34),
        inset 0 1px 0 rgba(255,255,255,0.32);
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .record-btn:hover {
      transform: scale(1.045);
      background: linear-gradient(180deg, #5a97f7 0%, var(--blue-dark) 100%);
      box-shadow:
        0 15px 38px rgba(59,130,246,0.48),
        inset 0 1px 0 rgba(255,255,255,0.32);
    }

    .record-btn.recording {
      background: linear-gradient(180deg, #ff625a 0%, var(--red) 100%);
      box-shadow:
        0 12px 30px rgba(255,69,58,0.36),
        inset 0 1px 0 rgba(255,255,255,0.28);
      animation: recordPulse 1.3s infinite;
    }

    @keyframes recordPulse {
      0% {
        box-shadow:
          0 12px 30px rgba(255,69,58,0.36),
          0 0 0 0 rgba(255,69,58,0.25);
      }
      70% {
        box-shadow:
          0 12px 30px rgba(255,69,58,0.36),
          0 0 0 12px rgba(255,69,58,0);
      }
      100% {
        box-shadow:
          0 12px 30px rgba(255,69,58,0.36),
          0 0 0 0 rgba(255,69,58,0);
      }
    }

    .timer-chip {
      min-width: 94px;
      justify-content: center;
      padding: 0 14px;
      font-size: 13px;
      font-weight: 850;
      color: var(--black-text);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.1px;
    }

    .download-btn {
      width: 52px;
      height: 50px;
      border-radius: 16px;
      border: 1px solid rgba(0,0,0,0.12);
      background: linear-gradient(180deg, #ffffff 0%, #f5f5f7 100%);
      color: #1d1d1f;
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow:
        0 8px 22px rgba(0,0,0,0.08),
        inset 0 1px 0 rgba(255,255,255,0.95);
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease, color 0.18s ease, opacity 0.18s ease;
      flex-shrink: 0;
    }

    .download-btn:hover:not(:disabled) {
      transform: scale(1.07);
      background: linear-gradient(180deg, #ffffff 0%, #eeeeef 100%);
      color: #000;
      box-shadow:
        0 14px 32px rgba(0,0,0,0.16),
        inset 0 1px 0 rgba(255,255,255,1);
    }

    .download-btn:disabled {
      opacity: 0.38;
      cursor: not-allowed;
      filter: grayscale(1);
    }

    .download-btn svg {
      width: 22px;
      height: 22px;
      stroke-width: 2.4;
    }

    .toast {
      position: absolute;
      left: 50%;
      bottom: 190px;
      transform: translateX(-50%) translateY(12px);
      z-index: 12;
      background: rgba(30,30,32,0.84);
      color: #fff;
      font-size: 13px;
      font-weight: 720;
      padding: 10px 14px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: 0.25s ease;
      max-width: calc(100vw - 40px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      backdrop-filter: blur(18px);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    svg {
      width: 16px;
      height: 16px;
      display: block;
    }

    @media (max-width: 860px) {
      .control-dock {
        width: min(520px, calc(100vw - 28px));
        flex-wrap: wrap;
        border-radius: 24px;
        padding: 10px;
        bottom: 92px;
      }

      .record-btn {
        order: 3;
        width: 100%;
      }

      .timer-chip {
        min-width: 104px;
      }

      .toast {
        bottom: 220px;
      }
    }

    @media (max-width: 560px) {
      .idle-content h1,
      .recording-card h2 {
        font-size: 38px;
        letter-spacing: -1.8px;
      }

      .idle-content p,
      .recording-card p {
        font-size: 14px;
      }

      .chip-text {
        display: none;
      }

      .chip {
        padding: 0 9px;
      }

      .control-dock {
        bottom: 86px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <video id="preview" autoplay muted playsinline></video>

    <div class="idle-overlay" id="idleOverlay">
      <div class="idle-content">
        <h1>Screen Recorder</h1>
        <p>Choose another window or entire screen to avoid mirror loop.</p>
      </div>
    </div>

    <div class="recording-overlay" id="recordingOverlay">
      <div class="recording-card">
        <div class="recording-dot-large"></div>
        <h2>Recording</h2>
        <p>Your screen is being captured.</p>
      </div>
    </div>

    <div class="toast" id="toast">Ready</div>

    <section class="control-dock">
      <div class="chip" id="desktopChip">
        <div class="chip-icon">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M5 9v6h4l5 4V5L9 9H5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <path d="M17 9.5c.8.8 1.2 1.6 1.2 2.5s-.4 1.8-1.2 2.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>

        <div class="chip-text">
          <strong>Desktop Audio</strong>
        </div>

        <label class="switch">
          <input type="checkbox" id="desktopAudioToggle" checked />
          <span class="slider"></span>
        </label>
      </div>

      <div class="chip" id="micChip">
        <div class="chip-icon">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 14a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v4a4 4 0 0 0 4 4Z" stroke="currentColor" stroke-width="2"/>
            <path d="M19 10a7 7 0 0 1-14 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M12 17v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>

        <div class="chip-text">
          <strong>Microphone</strong>
        </div>

        <label class="switch">
          <input type="checkbox" id="micToggle" checked />
          <span class="slider"></span>
        </label>
      </div>

      <button class="record-btn" id="recordBtn">Start Recording</button>

      <div class="chip timer-chip" id="timerText">00:00:00</div>

      <button class="download-btn" id="downloadBtn" disabled title="Download Recording">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M12 4v10" stroke="currentColor" stroke-linecap="round"/>
          <path d="M8 11l4 4 4-4" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M5 20h14" stroke="currentColor" stroke-linecap="round"/>
        </svg>
      </button>
    </section>
  </div>

  <script>
    let mediaRecorder = null;
    let recordedChunks = [];

    let combinedStream = null;
    let screenStream = null;
    let micStream = null;

    let audioContext = null;
    let audioDestination = null;
    let finalBlobUrl = null;
    let lastBlob = null;

    let timerInterval = null;
    let recordingStartTime = 0;
    let lastRecordedSeconds = 0;
    let isRecording = false;

    const preview = document.getElementById("preview");
    const idleOverlay = document.getElementById("idleOverlay");
    const recordingOverlay = document.getElementById("recordingOverlay");

    const recordBtn = document.getElementById("recordBtn");
    const downloadBtn = document.getElementById("downloadBtn");

    const desktopAudioToggle = document.getElementById("desktopAudioToggle");
    const micToggle = document.getElementById("micToggle");

    const desktopChip = document.getElementById("desktopChip");
    const micChip = document.getElementById("micChip");

    const timerText = document.getElementById("timerText");
    const toast = document.getElementById("toast");

    recordBtn.addEventListener("click", () => {
      if (isRecording) {
        stopRecording();
      } else {
        startRecording();
      }
    });

    downloadBtn.addEventListener("click", () => {
      downloadRecording(false);
    });

    async function startRecording() {
      try {
        cleanupBeforeStart();

        const wantDesktopAudio = desktopAudioToggle.checked;
        const wantMic = micToggle.checked;

        showToast("Choose window or screen");

        screenStream = await navigator.mediaDevices.getDisplayMedia({
          video: {
            width: { ideal: 3840 },
            height: { ideal: 2160 },
            frameRate: { ideal: 60, max: 60 },
            cursor: "always"
          },
          audio: wantDesktopAudio
        });

        if (wantMic) {
          try {
            micStream = await navigator.mediaDevices.getUserMedia({
              audio: {
                echoCancellation: false,
                noiseSuppression: false,
                autoGainControl: false,
                sampleRate: 48000,
                channelCount: 2
              },
              video: false
            });
          } catch (micError) {
            console.warn("Microphone permission failed:", micError);
            showToast("Microphone permission not allowed");
          }
        }

        const finalTracks = [];
        const videoTrack = screenStream.getVideoTracks()[0];

        if (videoTrack) {
          finalTracks.push(videoTrack);
        }

        const audioTracksToMix = [];

        if (wantDesktopAudio) {
          screenStream.getAudioTracks().forEach(track => {
            audioTracksToMix.push(track);
          });
        }

        if (micStream) {
          micStream.getAudioTracks().forEach(track => {
            audioTracksToMix.push(track);
          });
        }

        if (audioTracksToMix.length > 0) {
          const mixedAudioTrack = await createMixedAudioTrack(audioTracksToMix);

          if (mixedAudioTrack) {
            finalTracks.push(mixedAudioTrack);
          }
        }

        combinedStream = new MediaStream(finalTracks);

        preview.srcObject = null;
        preview.removeAttribute("src");
        preview.controls = false;
        preview.muted = true;
        preview.style.display = "none";

        idleOverlay.style.display = "none";
        recordingOverlay.style.display = "flex";

        recordedChunks = [];

        const options = getBestRecorderOptions();
        mediaRecorder = new MediaRecorder(combinedStream, options);

        mediaRecorder.ondataavailable = function(event) {
          if (event.data && event.data.size > 0) {
            recordedChunks.push(event.data);
          }
        };

        mediaRecorder.onstop = function() {
          const mimeType = mediaRecorder.mimeType || "video/webm";
          lastBlob = new Blob(recordedChunks, { type: mimeType });

          if (finalBlobUrl) {
            URL.revokeObjectURL(finalBlobUrl);
          }

          finalBlobUrl = URL.createObjectURL(lastBlob);

          preview.pause();
          preview.removeAttribute("src");
          preview.srcObject = null;
          preview.controls = false;
          preview.muted = true;
          preview.style.display = "none";
          preview.load();

          idleOverlay.style.display = "flex";
          recordingOverlay.style.display = "none";

          downloadBtn.disabled = false;
          setRecordingUI(false);
          setTogglesDisabled(false);

          showToast("Recording saved. Downloading...");
          downloadRecording(true);
        };

        videoTrack.onended = function() {
          if (mediaRecorder && mediaRecorder.state !== "inactive") {
            stopRecording();
          }
        };

        mediaRecorder.start(1000);

        setRecordingUI(true);
        setTogglesDisabled(true);
        startTimer();

        showToast("Recording started");

      } catch (error) {
        console.error(error);

        stopTimer(false);
        cleanupAllStreams();

        preview.style.display = "none";
        idleOverlay.style.display = "flex";
        recordingOverlay.style.display = "none";

        setRecordingUI(false);
        setTogglesDisabled(false);

        showToast("Recording cancelled");
      }
    }

    async function createMixedAudioTrack(audioTracks) {
      try {
        audioContext = new AudioContext({ sampleRate: 48000 });
        audioDestination = audioContext.createMediaStreamDestination();

        audioTracks.forEach(function(track) {
          const stream = new MediaStream([track]);
          const source = audioContext.createMediaStreamSource(stream);
          const gainNode = audioContext.createGain();

          gainNode.gain.value = 1;
          source.connect(gainNode);
          gainNode.connect(audioDestination);
        });

        const mixedTracks = audioDestination.stream.getAudioTracks();

        if (mixedTracks.length > 0) {
          return mixedTracks[0];
        }

        return null;
      } catch (error) {
        console.error("Audio mixing failed:", error);
        return audioTracks[0] || null;
      }
    }

    function getBestRecorderOptions() {
      const preferredTypes = [
        "video/webm;codecs=vp9,opus",
        "video/webm;codecs=vp8,opus",
        "video/webm"
      ];

      let mimeType = "";

      for (const type of preferredTypes) {
        if (MediaRecorder.isTypeSupported(type)) {
          mimeType = type;
          break;
        }
      }

      const options = {
        videoBitsPerSecond: 35000000,
        audioBitsPerSecond: 320000
      };

      if (mimeType) {
        options.mimeType = mimeType;
      }

      return options;
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        showToast("Saving recording...");
        mediaRecorder.stop();
      }

      stopTimer(true);
      cleanupAllStreams();
    }

    function downloadRecording(isAutoDownload) {
      if (!finalBlobUrl) return;

      const now = new Date();

      const fileName =
        "screen-recording-" +
        now.getFullYear() + "-" +
        String(now.getMonth() + 1).padStart(2, "0") + "-" +
        String(now.getDate()).padStart(2, "0") + "-" +
        String(now.getHours()).padStart(2, "0") + "-" +
        String(now.getMinutes()).padStart(2, "0") + "-" +
        String(now.getSeconds()).padStart(2, "0") +
        ".webm";

      const link = document.createElement("a");
      link.href = finalBlobUrl;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      if (!isAutoDownload) {
        showToast("Download started");
      }
    }

    function setRecordingUI(recording) {
      isRecording = recording;

      if (recording) {
        recordBtn.classList.add("recording");
        recordBtn.textContent = "Stop Recording";
      } else {
        recordBtn.classList.remove("recording");
        recordBtn.textContent = "Start Recording";
      }
    }

    function setTogglesDisabled(disabled) {
      desktopAudioToggle.disabled = disabled;
      micToggle.disabled = disabled;

      if (disabled) {
        desktopChip.classList.add("disabled");
        micChip.classList.add("disabled");
      } else {
        desktopChip.classList.remove("disabled");
        micChip.classList.remove("disabled");
      }
    }

    function startTimer() {
      recordingStartTime = Date.now();
      lastRecordedSeconds = 0;
      updateTimerDisplay(0);

      if (timerInterval) {
        clearInterval(timerInterval);
      }

      timerInterval = setInterval(() => {
        const seconds = Math.floor((Date.now() - recordingStartTime) / 1000);
        lastRecordedSeconds = seconds;
        updateTimerDisplay(seconds);
      }, 500);
    }

    function stopTimer(keepLastTime) {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }

      if (keepLastTime) {
        updateTimerDisplay(lastRecordedSeconds);
      } else {
        lastRecordedSeconds = 0;
        updateTimerDisplay(0);
      }
    }

    function updateTimerDisplay(totalSeconds) {
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      const text =
        String(hours).padStart(2, "0") + ":" +
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0");

      timerText.textContent = text;
    }

    function cleanupBeforeStart() {
      cleanupAllStreams();

      if (finalBlobUrl) {
        URL.revokeObjectURL(finalBlobUrl);
        finalBlobUrl = null;
      }

      lastBlob = null;
      recordedChunks = [];

      preview.pause();
      preview.removeAttribute("src");
      preview.srcObject = null;
      preview.controls = false;
      preview.muted = true;
      preview.style.display = "none";
      preview.load();

      idleOverlay.style.display = "flex";
      recordingOverlay.style.display = "none";
      downloadBtn.disabled = true;

      stopTimer(false);
    }

    function cleanupAllStreams() {
      if (combinedStream) {
        combinedStream.getTracks().forEach(track => track.stop());
        combinedStream = null;
      }

      if (screenStream) {
        screenStream.getTracks().forEach(track => track.stop());
        screenStream = null;
      }

      if (micStream) {
        micStream.getTracks().forEach(track => track.stop());
        micStream = null;
      }

      if (audioDestination) {
        audioDestination.stream.getTracks().forEach(track => track.stop());
        audioDestination = null;
      }

      if (audioContext) {
        audioContext.close().catch(() => {});
        audioContext = null;
      }
    }

    let toastTimer = null;

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");

      if (toastTimer) {
        clearTimeout(toastTimer);
      }

      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2200);
    }
  </script>
</body>
</html>
