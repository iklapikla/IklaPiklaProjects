<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text Animation Effects</title>

  <style>
    :root {
      --bg: #000;
      --border: rgba(255,255,255,0.14);
      --text: #fff;
      --muted: rgba(255,255,255,0.58);
      --blue: #4f8cff;
      --purple: #8d6bff;
      --green: #35c759;
      --red: #ff5f57;
      --yellow: #ffbd2e;
      --orange: #ff9f0a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,0.15), transparent 24%),
        radial-gradient(circle at 18% 28%, rgba(79,140,255,0.11), transparent 28%),
        linear-gradient(180deg, #000, #050505 55%, #090909);
      color: var(--text);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.024) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.024) 1px, transparent 1px);
      background-size: 70px 70px;
      mask-image: radial-gradient(circle at center, black, transparent 75%);
      z-index: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(100%, 1560px);
      margin: 0 auto;
      padding: 22px;
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 16px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px;
      border-radius: 24px;
      background: rgba(20,20,20,0.78);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(26px);
      box-shadow: 0 20px 70px rgba(0,0,0,0.46);
      margin-bottom: 30px;
    }

    .search-box {
      width: 280px;
      height: 46px;
      border-radius: 16px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.12);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      flex: 0 0 auto;
    }

    .search-box svg {
      color: rgba(255,255,255,0.58);
      flex: 0 0 auto;
    }

    .search-box input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font-size: 14px;
      font-weight: 750;
    }

    .search-box input::placeholder {
      color: rgba(255,255,255,0.45);
    }

    .menu {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      flex: 1;
    }

    .menu::-webkit-scrollbar {
      display: none;
    }

    .menu a {
      height: 46px;
      padding: 0 16px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.68);
      font-size: 14px;
      font-weight: 850;
      border: 1px solid transparent;
      white-space: nowrap;
      transition: 180ms ease;
    }

    .menu a:hover,
    .menu a.active {
      background: rgba(255,255,255,0.11);
      border-color: rgba(255,255,255,0.12);
      color: white;
    }

    .menu a.active {
      background: rgba(79,140,255,0.22);
      border-color: rgba(79,140,255,0.38);
    }

    .content-header {
      margin-bottom: 24px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
    }

    .title-block h1 {
      font-size: clamp(34px, 4.8vw, 64px);
      line-height: 0.95;
      letter-spacing: -0.065em;
      font-weight: 950;
      margin-bottom: 10px;
    }

    .title-block p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
      font-weight: 650;
      max-width: 760px;
    }

    .count-pill {
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.74);
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
      padding-bottom: 35px;
    }

    .card {
      min-height: 238px;
      border-radius: 24px;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,0.12), transparent 50%),
        linear-gradient(180deg, rgba(255,255,255,0.09), rgba(255,255,255,0.04));
      border: 1px solid var(--border);
      overflow: hidden;
      transition: 220ms ease;
      box-shadow: 0 18px 50px rgba(0,0,0,0.25);
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(255,255,255,0.24);
      box-shadow: 0 28px 80px rgba(0,0,0,0.44);
    }

    .preview {
      height: 138px;
      display: grid;
      place-items: center;
      padding: 18px;
      border-bottom: 1px solid rgba(255,255,255,0.09);
      background: rgba(0,0,0,0.20);
      overflow: hidden;
      position: relative;
      perspective: 900px;
    }

    .sample {
      font-size: 30px;
      line-height: 1;
      letter-spacing: -0.055em;
      font-weight: 950;
      text-align: center;
      white-space: nowrap;
      display: inline-block;
      position: relative;
    }

    .card-body {
      padding: 15px;
    }

    .name-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .name-row h3 {
      font-size: 16px;
      line-height: 1.12;
      letter-spacing: -0.03em;
      font-weight: 900;
    }

    .copy-btn {
      width: 36px;
      height: 36px;
      border-radius: 13px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.085);
      color: white;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex: 0 0 auto;
      transition: 180ms ease;
    }

    .copy-btn:hover {
      background: rgba(79,140,255,0.95);
      border-color: rgba(79,140,255,0.95);
      transform: translateY(-2px);
    }

    .card-body p {
      color: rgba(255,255,255,0.55);
      font-size: 12.5px;
      line-height: 1.45;
      font-weight: 650;
    }

    .empty {
      padding: 24px;
      border-radius: 22px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.72);
      text-align: center;
      font-weight: 750;
      margin-bottom: 20px;
      display: none;
    }

    .load-status {
      margin: 0 auto 70px;
      width: fit-content;
      padding: 12px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.65);
      font-size: 12px;
      font-weight: 850;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%) translateY(18px);
      padding: 13px 18px;
      border-radius: 16px;
      background: rgba(255,255,255,0.93);
      color: #111;
      font-size: 13px;
      font-weight: 850;
      box-shadow: 0 18px 60px rgba(0,0,0,0.45);
      opacity: 0;
      pointer-events: none;
      transition: 220ms ease;
      z-index: 9999;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #effectStyles {
      display: none;
    }

    @media (max-width: 1280px) {
      .grid { grid-template-columns: repeat(4, 1fr); }
    }

    @media (max-width: 1100px) {
      .grid { grid-template-columns: repeat(3, 1fr); }
      .topbar { align-items: flex-start; flex-direction: column; }
      .search-box { width: 100%; }
      .menu { width: 100%; }
    }

    @media (max-width: 760px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
      .content-header { display: block; }
      .count-pill { display: inline-block; margin-top: 12px; }
    }

    @media (max-width: 520px) {
      .page { padding: 12px; }
      .topbar { top: 10px; border-radius: 20px; }
      .menu a { height: 42px; padding: 0 13px; font-size: 13px; }
      .grid { grid-template-columns: 1fr; }
      .sample { font-size: 28px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <header class="topbar">
      <div class="search-box">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2.2"/>
          <path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <input id="searchInput" type="text" placeholder="Search effect..." />
      </div>

      <nav class="menu" id="mainMenu"></nav>
    </header>

    <main>
      <header class="content-header">
        <div class="title-block">
          <h1>Text Animation</h1>
          <p>100 live text animation effects. First 20 effects load initially, then next 20 effects load automatically while scrolling.</p>
        </div>

        <div class="count-pill" id="countPill">0 Effects</div>
      </header>

      <div id="emptyState" class="empty">
        No effect found. Try searching “shine”, “glow”, “typewriter”, “gradient”, “blur”, or “wave”.
      </div>

      <section id="grid" class="grid"></section>

      <div id="loadStatus" class="load-status">Showing 0 of 100 effects</div>
    </main>
  </div>

  <style id="dynamicEffectStyles"></style>

  <script src="nav.js"></script>

  <script>
    const effects = [];

    function addEffect(name, about, className, css, html) {
      effects.push({
        id: String(effects.length),
        name,
        about,
        className,
        html: html || `<div class="sample ${className}">Text</div>`,
        css
      });
    }

    addEffect("Fade In Text", "Simple opacity fade-in text animation.", "fx-fade-in", `.fx-fade-in { animation: fxFadeIn 2s ease-in-out infinite alternate; }
@keyframes fxFadeIn { from { opacity: .15; } to { opacity: 1; } }`);

    addEffect("Fade Out Text", "Text fades out and returns smoothly.", "fx-fade-out", `.fx-fade-out { animation: fxFadeOut 2s ease-in-out infinite alternate; }
@keyframes fxFadeOut { from { opacity: 1; } to { opacity: .15; } }`);

    addEffect("Fade Up Text", "Text comes from bottom and fades in.", "fx-fade-up", `.fx-fade-up { animation: fxFadeUp 2.1s ease-in-out infinite; }
@keyframes fxFadeUp { 0% { opacity: 0; transform: translateY(26px); } 45%, 75% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-16px); } }`);

    addEffect("Fade Down Text", "Text comes from top and fades in.", "fx-fade-down", `.fx-fade-down { animation: fxFadeDown 2.1s ease-in-out infinite; }
@keyframes fxFadeDown { 0% { opacity: 0; transform: translateY(-26px); } 45%, 75% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(16px); } }`);

    addEffect("Slide Left Text", "Text slides from right to left.", "fx-slide-left", `.fx-slide-left { animation: fxSlideLeft 2.2s ease-in-out infinite; }
@keyframes fxSlideLeft { 0% { opacity: 0; transform: translateX(45px); } 45%, 75% { opacity: 1; transform: translateX(0); } 100% { opacity: 0; transform: translateX(-35px); } }`);

    addEffect("Slide Right Text", "Text slides from left to right.", "fx-slide-right", `.fx-slide-right { animation: fxSlideRight 2.2s ease-in-out infinite; }
@keyframes fxSlideRight { 0% { opacity: 0; transform: translateX(-45px); } 45%, 75% { opacity: 1; transform: translateX(0); } 100% { opacity: 0; transform: translateX(35px); } }`);

    addEffect("Zoom In Text", "Text scales in from small size.", "fx-zoom-in", `.fx-zoom-in { animation: fxZoomIn 2s ease-in-out infinite; }
@keyframes fxZoomIn { 0% { opacity: 0; transform: scale(.65); } 45%, 75% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.15); } }`);

    addEffect("Zoom Out Text", "Text starts large and settles down.", "fx-zoom-out", `.fx-zoom-out { animation: fxZoomOut 2s ease-in-out infinite; }
@keyframes fxZoomOut { 0% { opacity: 0; transform: scale(1.45); } 45%, 75% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(.78); } }`);

    addEffect("Pop Text", "Text pops with elastic feeling.", "fx-pop", `.fx-pop { animation: fxPop 1.6s cubic-bezier(.17,.67,.28,1.35) infinite; }
@keyframes fxPop { 0% { opacity: 0; transform: scale(.45); } 45%, 75% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(.9); } }`);

    addEffect("Bounce Text", "Text bounces up and down.", "fx-bounce", `.fx-bounce { animation: fxBounce 1.5s ease-in-out infinite; }
@keyframes fxBounce { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-18px); } 60% { transform: translateY(4px); } }`);

    addEffect("Pulse Text", "Text scales softly like a pulse.", "fx-pulse", `.fx-pulse { animation: fxPulse 1.5s ease-in-out infinite; }
@keyframes fxPulse { 0%, 100% { transform: scale(1); opacity: .75; } 50% { transform: scale(1.1); opacity: 1; } }`);

    addEffect("Floating Text", "Text floats gently up and down.", "fx-float", `.fx-float { animation: fxFloat 2.4s ease-in-out infinite; }
@keyframes fxFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-13px); } }`);

    addEffect("Shake Text", "Text shakes quickly for error states.", "fx-shake", `.fx-shake { animation: fxShake .55s ease-in-out infinite; }
@keyframes fxShake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }`);

    addEffect("Rubber Text", "Text stretches like rubber band.", "fx-rubber", `.fx-rubber { animation: fxRubber 1.8s ease-in-out infinite; }
@keyframes fxRubber { 0%, 100% { transform: scale(1); } 35% { transform: scaleX(1.25) scaleY(.75); } 55% { transform: scaleX(.85) scaleY(1.15); } 75% { transform: scaleX(1.05) scaleY(.95); } }`);

    addEffect("Swing Text", "Text swings from side to side.", "fx-swing", `.fx-swing { transform-origin: top center; animation: fxSwing 1.7s ease-in-out infinite; }
@keyframes fxSwing { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(8deg); } 75% { transform: rotate(-8deg); } }`);

    addEffect("Wobble Text", "Text wobbles horizontally.", "fx-wobble", `.fx-wobble { animation: fxWobble 1.4s ease-in-out infinite; }
@keyframes fxWobble { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-10px) rotate(-3deg); } 40% { transform: translateX(8px) rotate(2deg); } 60% { transform: translateX(-6px) rotate(-2deg); } 80% { transform: translateX(4px) rotate(1deg); } }`);

    addEffect("Jello Text", "Soft jelly-style text deformation.", "fx-jello", `.fx-jello { animation: fxJello 1.6s ease-in-out infinite; }
@keyframes fxJello { 0%, 100% { transform: skewX(0); } 30% { transform: skewX(12deg); } 45% { transform: skewX(-10deg); } 60% { transform: skewX(6deg); } 75% { transform: skewX(-4deg); } }`);

    addEffect("Rotate Text", "Text rotates once smoothly.", "fx-rotate", `.fx-rotate { animation: fxRotate 2s ease-in-out infinite; }
@keyframes fxRotate { 0% { transform: rotate(0deg); } 50% { transform: rotate(360deg); } 100% { transform: rotate(360deg); } }`);

    addEffect("Flip X Text", "Text flips vertically in 3D.", "fx-flip-x", `.fx-flip-x { animation: fxFlipX 2s ease-in-out infinite; transform-style: preserve-3d; }
@keyframes fxFlipX { 0%, 100% { transform: rotateX(0); } 50% { transform: rotateX(360deg); } }`);

    addEffect("Flip Y Text", "Text flips horizontally in 3D.", "fx-flip-y", `.fx-flip-y { animation: fxFlipY 2s ease-in-out infinite; transform-style: preserve-3d; }
@keyframes fxFlipY { 0%, 100% { transform: rotateY(0); } 50% { transform: rotateY(360deg); } }`);

    addEffect("Shining Text", "Premium shine sweep over text.", "fx-shine", `.fx-shine {
  background: linear-gradient(90deg, #fff 0%, #fff 34%, #80b2ff 50%, #fff 66%, #fff 100%);
  background-size: 260% auto;
  color: transparent;
  -webkit-background-clip: text;
  background-clip: text;
  animation: fxShine 2.2s linear infinite;
}
@keyframes fxShine { to { background-position: -260% center; } }`);

    addEffect("Gradient Text", "Animated gradient moving across text.", "fx-gradient", `.fx-gradient {
  background: linear-gradient(90deg, #ffffff, #65a2ff, #b986ff, #ffffff);
  background-size: 260%;
  color: transparent;
  -webkit-background-clip: text;
  background-clip: text;
  animation: fxGradient 3s ease-in-out infinite;
}
@keyframes fxGradient { 0%, 100% { background-position: 0% center; } 50% { background-position: 100% center; } }`);

    addEffect("Rainbow Text", "Rainbow color animation across text.", "fx-rainbow", `.fx-rainbow {
  background: linear-gradient(90deg, #ff5f57, #ffbd2e, #35c759, #4f8cff, #8d6bff, #ff5f57);
  background-size: 300%;
  color: transparent;
  -webkit-background-clip: text;
  background-clip: text;
  animation: fxRainbow 3s linear infinite;
}
@keyframes fxRainbow { to { background-position: 300% center; } }`);

    addEffect("Neon Text", "Blue neon glow with flicker.", "fx-neon", `.fx-neon {
  color: white;
  text-shadow: 0 0 8px rgba(79,140,255,.9), 0 0 22px rgba(79,140,255,.75), 0 0 45px rgba(79,140,255,.45);
  animation: fxNeon 1.8s ease-in-out infinite;
}
@keyframes fxNeon { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.35); } }`);

    addEffect("Soft Glow Text", "Clean white glow animation.", "fx-soft-glow", `.fx-soft-glow { animation: fxSoftGlow 2s ease-in-out infinite; }
@keyframes fxSoftGlow { 0%, 100% { text-shadow: 0 0 0 rgba(255,255,255,0); } 50% { text-shadow: 0 0 28px rgba(255,255,255,.68); } }`);

    addEffect("Red Glow Text", "Red glow for alert style text.", "fx-red-glow", `.fx-red-glow { color: #fff; animation: fxRedGlow 1.7s ease-in-out infinite; }
@keyframes fxRedGlow { 0%, 100% { text-shadow: 0 0 0 rgba(255,95,87,0); } 50% { text-shadow: 0 0 28px rgba(255,95,87,.85); } }`);

    addEffect("Gold Glow Text", "Gold premium glow animation.", "fx-gold-glow", `.fx-gold-glow { color: #fff7df; animation: fxGoldGlow 1.8s ease-in-out infinite; }
@keyframes fxGoldGlow { 0%, 100% { text-shadow: 0 0 0 rgba(255,189,46,0); } 50% { text-shadow: 0 0 30px rgba(255,189,46,.85); } }`);

    addEffect("Cyber Text", "Cyberpunk color split effect.", "fx-cyber", `.fx-cyber {
  color: #fff;
  text-shadow: 2px 0 #ff5f57, -2px 0 #4f8cff;
  animation: fxCyber 1.1s steps(2) infinite;
}
@keyframes fxCyber { 0%, 100% { transform: translate(0); } 30% { transform: translate(-2px, 1px); } 60% { transform: translate(2px, -1px); } }`);

    addEffect("Glitch Text", "Glitch movement with RGB shadows.", "fx-glitch", `.fx-glitch {
  text-shadow: 2px 0 #ff453a, -2px 0 #4f8cff;
  animation: fxGlitch 1.2s infinite;
}
@keyframes fxGlitch { 0%, 100% { transform: translate(0); } 20% { transform: translate(-2px, 1px); } 40% { transform: translate(2px, -1px); } 60% { transform: translate(-1px, -1px); } 80% { transform: translate(1px, 2px); } }`);

    addEffect("Holographic Text", "Holographic pastel gradient movement.", "fx-holo", `.fx-holo {
  background: linear-gradient(120deg, #fff, #87f7ff, #ff9ee7, #fff);
  background-size: 260%;
  color: transparent;
  -webkit-background-clip: text;
  background-clip: text;
  animation: fxHolo 2.6s ease-in-out infinite;
}
@keyframes fxHolo { 0%, 100% { background-position: 0% center; } 50% { background-position: 100% center; } }`);

    addEffect("Fire Text", "Warm fire-like moving gradient.", "fx-fire", `.fx-fire {
  background: linear-gradient(90deg, #ff5f57, #ffbd2e, #ff9f0a, #ff5f57);
  background-size: 240%;
  color: transparent;
  -webkit-background-clip: text;
  background-clip: text;
  animation: fxFire 1.4s ease-in-out infinite;
}
@keyframes fxFire { 0%, 100% { background-position: 0% center; transform: scale(1); } 50% { background-position: 100% center; transform: scale(1.06); } }`);

    addEffect("Ice Text", "Cool blue frozen glow effect.", "fx-ice", `.fx-ice {
  color: #dff6ff;
  text-shadow: 0 0 10px rgba(135,247,255,.8), 0 0 25px rgba(79,140,255,.6);
  animation: fxIce 2s ease-in-out infinite;
}
@keyframes fxIce { 0%, 100% { filter: brightness(.9); } 50% { filter: brightness(1.35); } }`);

    addEffect("Chrome Text", "Metal chrome moving shine effect.", "fx-chrome", `.fx-chrome {
  background: linear-gradient(90deg, #999, #fff, #555, #fff, #aaa);
  background-size: 250%;
  color: transparent;
  -webkit-background-clip: text;
  background-clip: text;
  animation: fxChrome 2.4s linear infinite;
}
@keyframes fxChrome { to { background-position: -250% center; } }`);

    addEffect("Glass Text", "Glass-like transparent text shine.", "fx-glass-text", `.fx-glass-text {
  color: rgba(255,255,255,.65);
  text-shadow: 0 1px 0 rgba(255,255,255,.4), 0 0 22px rgba(255,255,255,.28);
  animation: fxGlassText 2s ease-in-out infinite;
}
@keyframes fxGlassText { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }`);

    addEffect("Blink Text", "Simple blinking text attention effect.", "fx-blink", `.fx-blink { animation: fxBlink 1s ease-in-out infinite; }
@keyframes fxBlink { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }`);

    addEffect("Flash Text", "Quick bright flash animation.", "fx-flash", `.fx-flash { animation: fxFlash 1.2s ease-in-out infinite; }
@keyframes fxFlash { 0%, 100% { opacity: 1; filter: brightness(1); } 50% { opacity: .6; filter: brightness(1.7); } }`);

    const grid = document.getElementById("grid");
    const searchInput = document.getElementById("searchInput");
    const countPill = document.getElementById("countPill");
    const emptyState = document.getElementById("emptyState");
    const loadStatus = document.getElementById("loadStatus");
    const dynamicEffectStyles = document.getElementById("dynamicEffectStyles");

    const batchSize = 20;
    let visibleCount = batchSize;
    let filteredEffects = [...effects];
    let isLoadingMore = false;

    dynamicEffectStyles.textContent = effects.map(effect => effect.css).join("\n\n");

    function copyIcon() {
      return `
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <rect x="9" y="9" width="10" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
          <rect x="5" y="5" width="10" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
        </svg>
      `;
    }

    function renderCards() {
      grid.innerHTML = "";

      const visibleEffects = filteredEffects.slice(0, visibleCount);

      visibleEffects.forEach(effect => {
        const card = document.createElement("div");
        card.className = "card";
        card.dataset.search = `${effect.name} ${effect.about} ${effect.className}`.toLowerCase();

        card.innerHTML = `
          <div class="preview">${effect.html}</div>
          <div class="card-body">
            <div class="name-row">
              <h3>${effect.name}</h3>
              <button class="copy-btn" data-id="${effect.id}" title="Copy code">
                ${copyIcon()}
              </button>
            </div>
            <p>${effect.about}</p>
          </div>
        `;

        grid.appendChild(card);
      });

      document.querySelectorAll(".copy-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          copyCode(btn.dataset.id);
        });
      });

      emptyState.style.display = filteredEffects.length ? "none" : "block";
      countPill.textContent = filteredEffects.length + " Effects";

      const shown = Math.min(visibleCount, filteredEffects.length);
      loadStatus.textContent = `Showing ${shown} of ${filteredEffects.length} effects`;

      if (filteredEffects.length === 0) {
        loadStatus.style.display = "none";
      } else {
        loadStatus.style.display = "block";
      }
    }

    function copyCode(id) {
      const effect = effects.find(item => item.id === id);

      if (!effect) {
        showToast("Code not found");
        return;
      }

      const code = `${effect.html}

<style>
.sample {
  font-size: 30px;
  line-height: 1;
  letter-spacing: -0.055em;
  font-weight: 950;
  display: inline-block;
  position: relative;
}

${effect.css}
</style>`;

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(code).then(() => {
          showToast("Code copied");
        }).catch(() => {
          fallbackCopy(code);
        });
      } else {
        fallbackCopy(code);
      }
    }

    function fallbackCopy(text) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      textarea.style.top = "-9999px";
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();

      try {
        document.execCommand("copy");
        showToast("Code copied");
      } catch (err) {
        showToast("Copy failed");
      }

      document.body.removeChild(textarea);
    }

    function showToast(message) {
      const oldToast = document.querySelector(".toast");
      if (oldToast) oldToast.remove();

      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = message;
      document.body.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.add("show");
      });

      setTimeout(() => {
        toast.classList.remove("show");
        setTimeout(() => toast.remove(), 250);
      }, 1500);
    }

    function applySearch() {
      const value = searchInput.value.trim().toLowerCase();

      filteredEffects = effects.filter(effect => {
        return (
          effect.name.toLowerCase().includes(value) ||
          effect.about.toLowerCase().includes(value) ||
          effect.className.toLowerCase().includes(value)
        );
      });

      visibleCount = batchSize;
      renderCards();
    }

    function loadMoreOnScroll() {
      if (isLoadingMore) return;
      if (visibleCount >= filteredEffects.length) return;

      const nearBottom = window.innerHeight + window.scrollY >= document.body.offsetHeight - 450;

      if (nearBottom) {
        isLoadingMore = true;

        setTimeout(() => {
          visibleCount += batchSize;
          renderCards();
          isLoadingMore = false;
        }, 180);
      }
    }

    searchInput.addEventListener("input", applySearch);
    window.addEventListener("scroll", loadMoreOnScroll);

    renderCards();
  </script>
</body>
</html>
