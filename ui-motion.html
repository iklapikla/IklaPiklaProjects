<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UI Motion Effects</title>

  <style>
    :root {
      --bg: #000;
      --border: rgba(255,255,255,0.14);
      --text: #fff;
      --muted: rgba(255,255,255,0.58);
      --blue: #4f8cff;
      --purple: #8d6bff;
      --green: #35c759;
      --red: #ff5f57;
      --yellow: #ffbd2e;
      --orange: #ff9f0a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,0.15), transparent 24%),
        radial-gradient(circle at 18% 28%, rgba(79,140,255,0.11), transparent 28%),
        linear-gradient(180deg, #000, #050505 55%, #090909);
      color: var(--text);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.024) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.024) 1px, transparent 1px);
      background-size: 70px 70px;
      mask-image: radial-gradient(circle at center, black, transparent 75%);
      z-index: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(100%, 1560px);
      margin: 0 auto;
      padding: 22px;
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 16px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px;
      border-radius: 24px;
      background: rgba(20,20,20,0.78);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(26px);
      box-shadow: 0 20px 70px rgba(0,0,0,0.46);
      margin-bottom: 30px;
    }

    .search-box {
      width: 280px;
      height: 46px;
      border-radius: 16px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.12);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      flex: 0 0 auto;
    }

    .search-box svg {
      color: rgba(255,255,255,0.58);
      flex: 0 0 auto;
    }

    .search-box input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font-size: 14px;
      font-weight: 750;
    }

    .search-box input::placeholder {
      color: rgba(255,255,255,0.45);
    }

    .menu {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      flex: 1;
    }

    .menu::-webkit-scrollbar {
      display: none;
    }

    .menu a {
      height: 46px;
      padding: 0 16px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.68);
      font-size: 14px;
      font-weight: 850;
      border: 1px solid transparent;
      white-space: nowrap;
      transition: 180ms ease;
    }

    .menu a:hover,
    .menu a.active {
      background: rgba(255,255,255,0.11);
      border-color: rgba(255,255,255,0.12);
      color: white;
    }

    .menu a.active {
      background: rgba(79,140,255,0.22);
      border-color: rgba(79,140,255,0.38);
    }

    .content-header {
      margin-bottom: 24px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
    }

    .title-block h1 {
      font-size: clamp(34px, 4.8vw, 64px);
      line-height: 0.95;
      letter-spacing: -0.065em;
      font-weight: 950;
      margin-bottom: 10px;
    }

    .title-block p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
      font-weight: 650;
      max-width: 760px;
    }

    .count-pill {
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.74);
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
      padding-bottom: 35px;
    }

    .card {
      min-height: 238px;
      border-radius: 24px;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,0.12), transparent 50%),
        linear-gradient(180deg, rgba(255,255,255,0.09), rgba(255,255,255,0.04));
      border: 1px solid var(--border);
      overflow: hidden;
      transition: 220ms ease;
      box-shadow: 0 18px 50px rgba(0,0,0,0.25);
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(255,255,255,0.24);
      box-shadow: 0 28px 80px rgba(0,0,0,0.44);
    }

    .preview {
      height: 138px;
      display: grid;
      place-items: center;
      padding: 18px;
      border-bottom: 1px solid rgba(255,255,255,0.09);
      background: rgba(0,0,0,0.20);
      overflow: hidden;
      position: relative;
      perspective: 900px;
    }

    .ui-demo {
      position: relative;
      width: 128px;
      height: 82px;
      border-radius: 20px;
      background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.07));
      border: 1px solid rgba(255,255,255,.16);
      display: grid;
      place-items: center;
      color: white;
      font-size: 13px;
      font-weight: 900;
      overflow: hidden;
      transition: 260ms ease;
      box-shadow: 0 14px 34px rgba(0,0,0,.28);
      isolation: isolate;
      transform-style: preserve-3d;
    }

    .ui-demo span {
      position: relative;
      z-index: 5;
    }

    .card-body {
      padding: 15px;
    }

    .name-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .name-row h3 {
      font-size: 16px;
      line-height: 1.12;
      letter-spacing: -0.03em;
      font-weight: 900;
    }

    .copy-btn {
      width: 36px;
      height: 36px;
      border-radius: 13px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.085);
      color: white;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex: 0 0 auto;
      transition: 180ms ease;
    }

    .copy-btn:hover {
      background: rgba(79,140,255,0.95);
      border-color: rgba(79,140,255,0.95);
      transform: translateY(-2px);
    }

    .card-body p {
      color: rgba(255,255,255,0.55);
      font-size: 12.5px;
      line-height: 1.45;
      font-weight: 650;
    }

    .empty {
      padding: 24px;
      border-radius: 22px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.72);
      text-align: center;
      font-weight: 750;
      margin-bottom: 20px;
      display: none;
    }

    .load-status {
      margin: 0 auto 70px;
      width: fit-content;
      padding: 12px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.65);
      font-size: 12px;
      font-weight: 850;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%) translateY(18px);
      padding: 13px 18px;
      border-radius: 16px;
      background: rgba(255,255,255,0.93);
      color: #111;
      font-size: 13px;
      font-weight: 850;
      box-shadow: 0 18px 60px rgba(0,0,0,0.45);
      opacity: 0;
      pointer-events: none;
      transition: 220ms ease;
      z-index: 9999;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 1280px) {
      .grid { grid-template-columns: repeat(4, 1fr); }
    }

    @media (max-width: 1100px) {
      .grid { grid-template-columns: repeat(3, 1fr); }
      .topbar { align-items: flex-start; flex-direction: column; }
      .search-box { width: 100%; }
      .menu { width: 100%; }
    }

    @media (max-width: 760px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
      .content-header { display: block; }
      .count-pill { display: inline-block; margin-top: 12px; }
    }

    @media (max-width: 520px) {
      .page { padding: 12px; }
      .topbar { top: 10px; border-radius: 20px; }
      .menu a { height: 42px; padding: 0 13px; font-size: 13px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <div class="page">
    <header class="topbar">
      <div class="search-box">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2.2"/>
          <path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <input id="searchInput" type="text" placeholder="Search effect..." />
      </div>

      <nav class="menu" id="mainMenu"></nav>
    </header>

    <main>
      <header class="content-header">
        <div class="title-block">
          <h1>UI Motion</h1>
          <p>100 live UI motion effects for modals, drawers, toast, dropdown, tabs, toggles, alerts, menus, and app micro-motion.</p>
        </div>

        <div class="count-pill" id="countPill">0 Effects</div>
      </header>

      <div id="emptyState" class="empty">
        No effect found. Try searching “modal”, “toast”, “drawer”, “toggle”, “dropdown”, “tabs”, or “notification”.
      </div>

      <section id="grid" class="grid"></section>

      <div id="loadStatus" class="load-status">Showing 0 of 100 effects</div>
    </main>
  </div>

  <style id="dynamicEffectStyles"></style>

  <script src="nav.js"></script>

  <script>
    const effects = [];

    const baseUICSS = `.ui-demo {
  position: relative;
  width: 128px;
  height: 82px;
  border-radius: 20px;
  background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.07));
  border: 1px solid rgba(255,255,255,.16);
  display: grid;
  place-items: center;
  color: white;
  font-size: 13px;
  font-weight: 900;
  overflow: hidden;
  transition: 260ms ease;
  box-shadow: 0 14px 34px rgba(0,0,0,.28);
  isolation: isolate;
  transform-style: preserve-3d;
}
.ui-demo span {
  position: relative;
  z-index: 5;
}`;

    const commonKeyframes = `
@keyframes uiFade { 0%{opacity:0;} 45%,75%{opacity:1;} 100%{opacity:0;} }
@keyframes uiScale { 0%{opacity:0;transform:scale(.65);} 45%,75%{opacity:1;transform:scale(1);} 100%{opacity:0;transform:scale(.85);} }
@keyframes uiSlideUp { 0%{opacity:0;transform:translateY(42px);} 45%,75%{opacity:1;transform:translateY(0);} 100%{opacity:0;transform:translateY(24px);} }
@keyframes uiSlideDown { 0%{opacity:0;transform:translateY(-42px);} 45%,75%{opacity:1;transform:translateY(0);} 100%{opacity:0;transform:translateY(-24px);} }
@keyframes uiSlideLeft { 0%{opacity:0;transform:translateX(60px);} 45%,75%{opacity:1;transform:translateX(0);} 100%{opacity:0;transform:translateX(-42px);} }
@keyframes uiSlideRight { 0%{opacity:0;transform:translateX(-60px);} 45%,75%{opacity:1;transform:translateX(0);} 100%{opacity:0;transform:translateX(42px);} }
@keyframes uiSpin { to{transform:rotate(360deg);} }
@keyframes uiPulse { 0%,100%{transform:scale(1);opacity:.75;} 50%{transform:scale(1.08);opacity:1;} }
@keyframes uiFloat { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-12px);} }
@keyframes uiGlow { 0%,100%{box-shadow:0 0 0 rgba(79,140,255,0);} 50%{box-shadow:0 0 30px rgba(79,140,255,.75);} }
@keyframes uiShake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }
@keyframes uiBounce { 0%,100%{transform:translateY(0);} 40%{transform:translateY(-14px);} 60%{transform:translateY(4px);} }
@keyframes uiGradient { 0%,100%{background-position:0% center;} 50%{background-position:100% center;} }
@keyframes uiShimmer { to{background-position:-220% center;} }
@keyframes uiScan { 0%,100%{top:0;} 50%{top:calc(100% - 3px);} }
`;

    function addEffect(name, about, className, css, html) {
      effects.push({
        id: String(effects.length),
        name,
        about,
        className,
        html: html || `<div class="ui-demo ${className}"><span>UI</span></div>`,
        css
      });
    }

    addEffect("Modal Fade", "Modal fades in and out softly.", "ui-modal-fade", `.ui-modal-fade{animation:uiFade 2.1s ease-in-out infinite;}`);
    addEffect("Modal Scale", "Modal opens with premium scale motion.", "ui-modal-scale", `.ui-modal-scale{animation:uiScale 2s cubic-bezier(.2,.8,.2,1) infinite;}`);
    addEffect("Modal Slide Up", "Modal slides up from bottom.", "ui-modal-slide-up", `.ui-modal-slide-up{animation:uiSlideUp 2.1s ease-in-out infinite;}`);
    addEffect("Modal Slide Down", "Modal slides down from top.", "ui-modal-slide-down", `.ui-modal-slide-down{animation:uiSlideDown 2.1s ease-in-out infinite;}`);
    addEffect("Modal Slide Left", "Modal slides from right to left.", "ui-modal-slide-left", `.ui-modal-slide-left{animation:uiSlideLeft 2.1s ease-in-out infinite;}`);
    addEffect("Modal Slide Right", "Modal slides from left to right.", "ui-modal-slide-right", `.ui-modal-slide-right{animation:uiSlideRight 2.1s ease-in-out infinite;}`);
    addEffect("Modal Blur Reveal", "Modal appears from blur into focus.", "ui-modal-blur", `.ui-modal-blur{animation:uiModalBlur 2.2s ease-in-out infinite;} @keyframes uiModalBlur{0%{opacity:0;filter:blur(14px);transform:scale(.95);}45%,75%{opacity:1;filter:blur(0);transform:scale(1);}100%{opacity:0;filter:blur(10px);transform:scale(.98);}}`);
    addEffect("Modal Elastic", "Modal opens with elastic motion.", "ui-modal-elastic", `.ui-modal-elastic{animation:uiModalElastic 1.8s cubic-bezier(.2,.9,.2,1.45) infinite;} @keyframes uiModalElastic{0%{opacity:0;transform:scale(.35);}45%,75%{opacity:1;transform:scale(1);}100%{opacity:0;transform:scale(.75);}}`);
    addEffect("Modal Flip", "Modal flips in 3D.", "ui-modal-flip", `.ui-modal-flip{animation:uiModalFlip 2s ease-in-out infinite;} @keyframes uiModalFlip{0%{opacity:0;transform:rotateY(-90deg);}45%,75%{opacity:1;transform:rotateY(0);}100%{opacity:0;transform:rotateY(90deg);}}`);
    addEffect("Modal Drop", "Modal drops from top with bounce.", "ui-modal-drop", `.ui-modal-drop{animation:uiModalDrop 2s ease-in-out infinite;} @keyframes uiModalDrop{0%{opacity:0;transform:translateY(-70px);}45%{opacity:1;transform:translateY(8px);}60%{transform:translateY(-5px);}75%{transform:translateY(0);}100%{opacity:0;transform:translateY(35px);}}`);

    addEffect("Toast Slide Right", "Toast notification slides from right.", "ui-toast-right", `.ui-toast-right{width:132px;height:48px;border-radius:16px;animation:uiSlideLeft 2.2s ease-in-out infinite;}`);
    addEffect("Toast Slide Left", "Toast notification slides from left.", "ui-toast-left", `.ui-toast-left{width:132px;height:48px;border-radius:16px;animation:uiSlideRight 2.2s ease-in-out infinite;}`);
    addEffect("Toast Slide Up", "Toast slides upward from bottom.", "ui-toast-up", `.ui-toast-up{width:132px;height:48px;border-radius:16px;animation:uiSlideUp 2.2s ease-in-out infinite;}`);
    addEffect("Toast Pop", "Toast pops like success message.", "ui-toast-pop", `.ui-toast-pop{width:132px;height:48px;border-radius:16px;animation:uiScale 1.8s ease-in-out infinite;}`);
    addEffect("Toast Success", "Green success toast motion.", "ui-toast-success", `.ui-toast-success{width:132px;height:48px;border-radius:16px;background:rgba(53,199,89,.18);border-color:rgba(53,199,89,.45);animation:uiToastSuccess 1.8s ease-in-out infinite;} @keyframes uiToastSuccess{0%,100%{transform:translateY(18px) scale(.92);opacity:0;}45%,75%{transform:translateY(0) scale(1);opacity:1;}}`, `<div class="ui-demo ui-toast-success"><span>Copied</span></div>`);
    addEffect("Toast Error", "Red error toast shake motion.", "ui-toast-error", `.ui-toast-error{width:132px;height:48px;border-radius:16px;background:rgba(255,95,87,.16);border-color:rgba(255,95,87,.45);animation:uiShake .7s ease-in-out infinite;}`, `<div class="ui-demo ui-toast-error"><span>Error</span></div>`);
    addEffect("Toast Warning", "Yellow warning toast glow.", "ui-toast-warning", `.ui-toast-warning{width:132px;height:48px;border-radius:16px;background:rgba(255,189,46,.16);border-color:rgba(255,189,46,.45);animation:uiToastWarn 1.6s ease-in-out infinite;} @keyframes uiToastWarn{0%,100%{box-shadow:0 0 0 rgba(255,189,46,0);}50%{box-shadow:0 0 24px rgba(255,189,46,.65);}}`, `<div class="ui-demo ui-toast-warning"><span>Warning</span></div>`);
    addEffect("Toast Stack", "Stacked toast shadow movement.", "ui-toast-stack", `.ui-toast-stack{width:132px;height:48px;border-radius:16px;box-shadow:8px 8px 0 rgba(255,255,255,.06),16px 16px 0 rgba(255,255,255,.03);animation:uiFloat 2.4s ease-in-out infinite;}`, `<div class="ui-demo ui-toast-stack"><span>Toast</span></div>`);
    addEffect("Toast Progress", "Toast with animated progress line.", "ui-toast-progress", `.ui-toast-progress{width:132px;height:48px;border-radius:16px;} .ui-toast-progress::after{content:"";position:absolute;left:0;bottom:0;height:4px;width:100%;background:#4f8cff;transform-origin:left;animation:uiToastProgress 2s linear infinite;} @keyframes uiToastProgress{0%{transform:scaleX(1);}100%{transform:scaleX(0);}}`, `<div class="ui-demo ui-toast-progress"><span>Toast</span></div>`);
    addEffect("Toast Glow", "Toast with blue glow pulse.", "ui-toast-glow", `.ui-toast-glow{width:132px;height:48px;border-radius:16px;border-color:rgba(79,140,255,.55);animation:uiGlow 1.8s ease-in-out infinite;}`, `<div class="ui-demo ui-toast-glow"><span>Toast</span></div>`);

    addEffect("Drawer Left", "Left drawer slides in and out.", "ui-drawer-left", `.ui-drawer-left{width:46px;height:90px;justify-self:start;margin-left:12px;animation:uiDrawerLeft 2.2s ease-in-out infinite;} @keyframes uiDrawerLeft{0%{opacity:0;transform:translateX(-60px);}45%,75%{opacity:1;transform:translateX(0);}100%{opacity:0;transform:translateX(-60px);}}`, `<div class="ui-demo ui-drawer-left"><span>Menu</span></div>`);
    addEffect("Drawer Right", "Right drawer slides in and out.", "ui-drawer-right", `.ui-drawer-right{width:46px;height:90px;justify-self:end;margin-right:12px;animation:uiDrawerRight 2.2s ease-in-out infinite;} @keyframes uiDrawerRight{0%{opacity:0;transform:translateX(60px);}45%,75%{opacity:1;transform:translateX(0);}100%{opacity:0;transform:translateX(60px);}}`, `<div class="ui-demo ui-drawer-right"><span>Menu</span></div>`);
    addEffect("Drawer Expand", "Drawer expands width from side.", "ui-drawer-expand", `.ui-drawer-expand{justify-self:start;width:42px;height:90px;animation:uiDrawerExpand 2.2s ease-in-out infinite;} @keyframes uiDrawerExpand{0%,100%{width:42px;}50%{width:122px;}}`);
    addEffect("Drawer Collapse", "Drawer collapses width.", "ui-drawer-collapse", `.ui-drawer-collapse{justify-self:start;width:122px;height:90px;animation:uiDrawerCollapse 2.2s ease-in-out infinite;} @keyframes uiDrawerCollapse{0%,100%{width:122px;}50%{width:42px;}}`);
    addEffect("Bottom Sheet", "Mobile bottom sheet rises from bottom.", "ui-bottom-sheet", `.ui-bottom-sheet{width:132px;height:52px;align-self:end;animation:uiBottomSheet 2.2s ease-in-out infinite;} @keyframes uiBottomSheet{0%{opacity:0;transform:translateY(70px);}45%,75%{opacity:1;transform:translateY(18px);}100%{opacity:0;transform:translateY(70px);}}`, `<div class="ui-demo ui-bottom-sheet"><span>Sheet</span></div>`);
    addEffect("Bottom Sheet Bounce", "Bottom sheet rises with bounce.", "ui-bottom-bounce", `.ui-bottom-bounce{width:132px;height:52px;align-self:end;animation:uiBottomBounce 2.2s ease-in-out infinite;} @keyframes uiBottomBounce{0%{transform:translateY(72px);opacity:0;}45%{transform:translateY(12px);opacity:1;}60%{transform:translateY(24px);}75%{transform:translateY(18px);}100%{transform:translateY(72px);opacity:0;}}`);
    addEffect("Side Panel Scale", "Side panel scales in.", "ui-side-scale", `.ui-side-scale{width:52px;height:90px;justify-self:end;transform-origin:right;animation:uiSideScale 2s ease-in-out infinite;} @keyframes uiSideScale{0%{opacity:0;transform:scaleX(.2);}45%,75%{opacity:1;transform:scaleX(1);}100%{opacity:0;transform:scaleX(.2);}}`);
    addEffect("Panel Blur", "Panel appears with blur.", "ui-panel-blur", `.ui-panel-blur{width:132px;height:72px;animation:uiPanelBlur 2s ease-in-out infinite;} @keyframes uiPanelBlur{0%{opacity:0;filter:blur(12px);transform:translateY(20px);}50%,75%{opacity:1;filter:blur(0);transform:translateY(0);}100%{opacity:0;filter:blur(10px);transform:translateY(20px);}}`);
    addEffect("Panel Glow", "Panel glows while opening.", "ui-panel-glow", `.ui-panel-glow{width:132px;height:72px;border-color:rgba(79,140,255,.55);animation:uiGlow 1.8s ease-in-out infinite;}`);
    addEffect("Panel Flip", "Panel flips in 3D.", "ui-panel-flip", `.ui-panel-flip{width:132px;height:72px;animation:uiModalFlip 2s ease-in-out infinite;}`);

    const grid = document.getElementById("grid");
    const searchInput = document.getElementById("searchInput");
    const countPill = document.getElementById("countPill");
    const emptyState = document.getElementById("emptyState");
    const loadStatus = document.getElementById("loadStatus");
    const dynamicEffectStyles = document.getElementById("dynamicEffectStyles");

    const batchSize = 20;
    let visibleCount = batchSize;
    let filteredEffects = [...effects];
    let isLoadingMore = false;

    dynamicEffectStyles.textContent = commonKeyframes + "\n\n" + effects.map(effect => effect.css).join("\n\n");

    function copyIcon() {
      return `
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <rect x="9" y="9" width="10" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
          <rect x="5" y="5" width="10" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
        </svg>
      `;
    }

    function renderCards() {
      grid.innerHTML = "";

      const visibleEffects = filteredEffects.slice(0, visibleCount);

      visibleEffects.forEach(effect => {
        const card = document.createElement("div");
        card.className = "card";
        card.dataset.search = `${effect.name} ${effect.about} ${effect.className}`.toLowerCase();

        card.innerHTML = `
          <div class="preview">${effect.html}</div>
          <div class="card-body">
            <div class="name-row">
              <h3>${effect.name}</h3>
              <button class="copy-btn" data-id="${effect.id}" title="Copy code">
                ${copyIcon()}
              </button>
            </div>
            <p>${effect.about}</p>
          </div>
        `;

        grid.appendChild(card);
      });

      document.querySelectorAll(".copy-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          copyCode(btn.dataset.id);
        });
      });

      emptyState.style.display = filteredEffects.length ? "none" : "block";
      countPill.textContent = filteredEffects.length + " Effects";

      const shown = Math.min(visibleCount, filteredEffects.length);
      loadStatus.textContent = `Showing ${shown} of ${filteredEffects.length} effects`;

      if (filteredEffects.length === 0) {
        loadStatus.style.display = "none";
      } else {
        loadStatus.style.display = "block";
      }
    }

    function copyCode(id) {
      const effect = effects.find(item => item.id === id);

      if (!effect) {
        showToast("Code not found");
        return;
      }

      const code = `${effect.html}

<style>
${baseUICSS}

${commonKeyframes}

${effect.css}
</style>`;

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(code).then(() => {
          showToast("Code copied");
        }).catch(() => {
          fallbackCopy(code);
        });
      } else {
        fallbackCopy(code);
      }
    }

    function fallbackCopy(text) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      textarea.style.top = "-9999px";
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();

      try {
        document.execCommand("copy");
        showToast("Code copied");
      } catch (err) {
        showToast("Copy failed");
      }

      document.body.removeChild(textarea);
    }

    function showToast(message) {
      const oldToast = document.querySelector(".toast");
      if (oldToast) oldToast.remove();

      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = message;
      document.body.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.add("show");
      });

      setTimeout(() => {
        toast.classList.remove("show");
        setTimeout(() => toast.remove(), 250);
      }, 1500);
    }

    function applySearch() {
      const value = searchInput.value.trim().toLowerCase();

      filteredEffects = effects.filter(effect => {
        return (
          effect.name.toLowerCase().includes(value) ||
          effect.about.toLowerCase().includes(value) ||
          effect.className.toLowerCase().includes(value)
        );
      });

      visibleCount = batchSize;
      renderCards();
    }

    function loadMoreOnScroll() {
      if (isLoadingMore) return;
      if (visibleCount >= filteredEffects.length) return;

      const nearBottom = window.innerHeight + window.scrollY >= document.body.offsetHeight - 450;

      if (nearBottom) {
        isLoadingMore = true;

        setTimeout(() => {
          visibleCount += batchSize;
          renderCards();
          isLoadingMore = false;
        }, 180);
      }
    }

    searchInput.addEventListener("input", applySearch);
    window.addEventListener("scroll", loadMoreOnScroll);

    renderCards();
  </script>
